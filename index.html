                  const dc=getDayColor(trades);
                  const dayPnl=trades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
                  return{date:dt,inMonth,ds,trades,isToday,isSel,dc,dayPnl};
                });
                // Saturday (last column) carries the week label — numbered by
                // its own position within ITS month, so a week that spills
                // into next month is correctly "Week 1" of that month, etc.
                const satDate=week[6];
                const weekNum=Math.floor((satDate.getDate()-1)/7)+1;
                const weekPnl=days.reduce((s,d)=>s+d.dayPnl,0);
                const weekTradeCount=days.reduce((s,d)=>s+d.trades.length,0);
                return{days,weekNum,weekPnl,weekTradeCount};
              });

              const maxAbsDay=Math.max(1,...weekRows.flatMap(w=>w.days.map(d=>Math.abs(d.dayPnl))));
              const maxAbsWeek=Math.max(1,...weekRows.map(w=>Math.abs(w.weekPnl)));
              const posTxt=dark?"#5DCAA5":"#0f6e56",negTxt=dark?"#F09995":"#993c1d";
              const subTxt=dark?"rgba(255,255,255,0.55)":"rgba(0,0,0,0.5)";
              function heatBg(pnl,maxAbs,dc){
                if(dc==="open"&&!pnl)return dark?"#0a1a2a":"#e8f2fc";
                if(!pnl)return null;
                // Flat, consistent colors — every winning day is the exact
                // same green and every losing day the exact same red,
                // regardless of how big or small that day's P&L was. This
                // avoids two loss days looking like different "categories"
                // just because one lost more money than the other.
                return pnl>0?"rgba(29,158,117,0.32)":"rgba(226,75,74,0.32)";
              }

              return weekRows.map((wk,wi)=>(
                <div key={"wk"+wi} style={{display:"flex",gap:5,marginBottom:5}}>
                  {wk.days.map((d,di)=>{
                    if(di===6){
                      const wBg=wk.weekTradeCount>0?heatBg(wk.weekPnl,maxAbsWeek,null):D.card;
                      const wBc=wk.weekTradeCount>0?(wk.weekPnl>0?"#1D9E75":wk.weekPnl<0?"#E24B4A":D.border):D.border2;
                      return(
                        <div key={"wkcell"+wi} style={{flex:1,minHeight:84,borderRadius:8,border:`1.5px solid ${wBc}`,background:wBg||D.card,opacity:d.inMonth?1:0.55,display:"flex",flexDirection:"column",padding:"6px 7px",gap:2}}>
                          <div style={{fontSize:12,fontWeight:600,color:subTxt}}>{d.date.getDate()}</div>
                          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2}}>
                            <div style={{fontSize:10,fontWeight:800,color:D.text,textTransform:"uppercase",letterSpacing:"0.04em"}}>Week {wk.weekNum}</div>
                            <div style={{fontSize:15,fontWeight:800,color:wk.weekPnl>0?posTxt:wk.weekPnl<0?negTxt:D.text3}}>{(wk.weekPnl>=0?"+":"")+"$"+wk.weekPnl.toFixed(2)}</div>
                            <div style={{fontSize:10,color:subTxt}}>{wk.weekTradeCount} trade{wk.weekTradeCount!==1?"s":""}</div>
                          </div>
                        </div>
                      );
                    }
                    const bg=d.isSel?D.navActive:(heatBg(d.dayPnl,maxAbsDay,d.dc)||D.card);
                    const bc=d.isSel?D.navActive:d.isToday?"#378ADD":d.dayPnl>0?"#1D9E75":d.dayPnl<0?"#E24B4A":D.border2;
                    return(
                      <div key={"d"+wi+di} onClick={()=>d.trades.length>0&&setSelDay(d.isSel?null:d.ds)} style={{flex:1,minHeight:84,border:`${d.isToday?2:1.5}px solid ${bc}`,borderRadius:8,padding:"6px 7px",background:bg,cursor:d.trades.length>0?"pointer":"default",transition:"all 0.12s",display:"flex",flexDirection:"column",gap:3,opacity:d.inMonth?1:0.55}}>
                        {d.isToday?(
                          <div style={{width:20,height:20,borderRadius:"50%",background:"#378ADD",color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{d.date.getDate()}</div>
                        ):(
                          <div style={{fontSize:12,fontWeight:600,color:d.isSel?D.navActiveTxt:D.text2}}>{d.date.getDate()}</div>
                        )}
                        {d.trades.length>0&&(
                          <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:3}}>
                            <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                              {d.trades.slice(0,3).map((t,ti)=>{
                                const rc=t.result==="win"?{bg:"rgba(29,158,117,0.22)",c:posTxt}:t.result==="loss"?{bg:"rgba(226,75,74,0.22)",c:negTxt}:{bg:"rgba(55,138,221,0.22)",c:"#6FB3F0"};
                                return(<span key={ti} style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:4,background:d.isSel?"rgba(255,255,255,0.2)":rc.bg,color:d.isSel?D.navActiveTxt:rc.c,whiteSpace:"nowrap"}}>{t.pair||"—"} {t.result==="win"?"✓":t.result==="loss"?"✗":"●"}</span>);
                              })}
                              {d.trades.length>3&&<span style={{fontSize:9,fontWeight:600,color:d.isSel?D.navActiveTxt:subTxt}}>+{d.trades.length-3}</span>}
                            </div>
                            <div style={{fontSize:13,fontWeight:800,color:d.isSel?D.navActiveTxt:d.dayPnl>0?posTxt:d.dayPnl<0?negTxt:D.text}}>{(d.dayPnl>=0?"+":"")+"$"+d.dayPnl.toFixed(2)}</div>
                            <div style={{fontSize:10,color:d.isSel?D.navActiveTxt:subTxt}}>{d.trades.length} trade{d.trades.length!==1?"s":""}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ));
            })()}
            {selDay&&selDayT.length>0&&(<div style={{marginTop:16,border:`1px solid ${D.border}`,borderRadius:12,padding:"16px",background:D.card}}><div style={{fontSize:13,fontWeight:700,color:D.text,marginBottom:12}}>{new Date(selDay+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>{selDayT.map((t,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"10px 12px",background:D.card2,borderRadius:8,marginBottom:6}}><div style={{display:"flex",gap:5}}>{t.imgBefore&&<img src={t.imgBefore} alt="before" style={{width:54,height:42,objectFit:"cover",borderRadius:6}}/>}{t.imgAfter&&<img src={t.imgAfter} alt="after" style={{width:54,height:42,objectFit:"cover",borderRadius:6}}/>}</div><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3,flexWrap:"wrap"}}><span style={{fontSize:13,fontWeight:700,color:D.text}}>{t.pair||"—"}</span>{t.setup&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:5,background:SC[t.setup]||"#666",color:"#fff",fontWeight:700}}>{t.setup}</span>}{t.result&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:600,background:RC[t.result]?.bg||"#eee",color:RC[t.result]?.c||"#666"}}>{t.result.charAt(0).toUpperCase()+t.result.slice(1)}</span>}{t.rr&&<span style={{fontSize:11,color:D.text3}}>RR: {t.rr}</span>}{t.pnl&&<span style={{fontSize:12,fontWeight:700,color:parseFloat(t.pnl)>0?"#0f6e56":parseFloat(t.pnl)<0?"#993c1d":D.text3}}>{parseFloat(t.pnl)>0?"+":""}{t.pnl}$</span>}</div>{(t.noteBefore||t.note)&&<div style={{fontSize:11,color:D.text3,lineHeight:1.5,marginTop:2}}><span style={{fontWeight:700,color:D.text2}}>Saw:</span> {t.noteBefore||t.note}</div>}{t.noteAfter&&<div style={{fontSize:11,color:D.text3,lineHeight:1.5,marginTop:2}}><span style={{fontWeight:700,color:D.text2}}>Result:</span> {t.noteAfter}</div>}</div></div>))}</div>)}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(105px,1fr))",gap:8,marginTop:16}}>
              {[{l:"Month trades",v:mT.length,c:D.text},{l:"Wins",v:mW,c:"#0f6e56"},{l:"Losses",v:mL,c:"#993c1d"},{l:"Win rate",v:mWr+"%",c:mWr>=50?"#0f6e56":"#993c1d"},{l:"Month P&L",v:(mPnl>=0?"+":"")+"$"+mPnl.toFixed(2),c:mPnl>0?"#0f6e56":mPnl<0?"#993c1d":D.text}].map(s=>(<div key={s.l} style={{background:D.statBg,borderRadius:10,padding:"11px 14px",border:`1px solid ${D.statBorder}`}}><div style={{fontSize:10,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{s.l}</div><div style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</div></div>))}
            </div>
            {mCl>0&&(<div style={{marginTop:12,padding:"12px 14px",background:D.statBg,borderRadius:10,border:`1px solid ${D.statBorder}`}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:D.text3,marginBottom:5}}><span>Month win rate</span><span style={{fontWeight:700,color:mWr>=50?"#0f6e56":"#993c1d"}}>{mWr}%</span></div><div style={{height:8,background:D.border,borderRadius:99,overflow:"hidden",marginBottom:10}}><div style={{height:"100%",width:mWr+"%",background:mWr>=50?"#1D9E75":"#E24B4A",borderRadius:99,transition:"width 0.4s"}}/></div><div style={{display:"flex",gap:14,alignItems:"center"}}>{[{c:"#1D9E75",l:"Win day"},{c:"#E24B4A",l:"Loss day"}].map(x=>(<div key={x.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:D.text3}}><div style={{width:10,height:10,borderRadius:3,background:x.c}}/>{x.l}</div>))}<div style={{marginLeft:"auto",fontSize:11,color:D.text3}}>Click a day for details</div></div></div>)}
            <div style={{marginTop:20,border:`1px solid ${D.border}`,borderRadius:12,overflow:"hidden"}}>
              <div style={{display:"flex",borderBottom:`1px solid ${D.border2}`}}>{[{id:"month",l:`${SHORT_MONTHS[calMi]} Only`},{id:"total",l:"All Months"}].map(v=>(<button key={v.id} onClick={()=>setPnlView(v.id)} style={{flex:1,padding:"12px",border:"none",background:pnlView===v.id?D.navActive:D.statBg,color:pnlView===v.id?D.navActiveTxt:D.text3,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{v.l} P&L</button>))}</div>
              {pnlView==="month"&&(<div style={{padding:"18px",background:D.card}}><div style={{fontSize:12,color:D.text3,marginBottom:14}}>{MONTHS[calMi]} {calYear} · {activeAcc.name} — isolated</div><div style={{display:"flex",gap:16,marginBottom:12}}><div style={{flex:1,padding:"16px",background:mPnl>0?(dark?"#0a2a1a":"#f0faf5"):mPnl<0?(dark?"#2a0a0a":"#fef2f2"):D.statBg,borderRadius:10,textAlign:"center",border:`1px solid ${mPnl>0?"#1D9E75":mPnl<0?"#E24B4A":D.border}`}}><div style={{fontSize:10,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Month P&L</div><div style={{fontSize:32,fontWeight:900,color:mPnl>0?"#0f6e56":mPnl<0?"#993c1d":D.text}}>{(mPnl>=0?"+":"")+"$"+mPnl.toFixed(2)}</div></div><div style={{display:"flex",flexDirection:"column",gap:8,flex:1}}>{[{l:"Trades",v:mT.length},{l:"Win rate",v:mWr+"%",c:mWr>=50?"#0f6e56":"#993c1d"},{l:"W / L",v:`${mW} / ${mL}`}].map(r=>(<div key={r.l} style={{padding:"9px 12px",background:D.statBg,borderRadius:8,display:"flex",justifyContent:"space-between",border:`1px solid ${D.statBorder}`}}><span style={{fontSize:12,color:D.text3}}>{r.l}</span><span style={{fontSize:13,fontWeight:700,color:r.c||D.text}}>{r.v}</span></div>))}</div></div></div>)}
              {pnlView==="total"&&(<div style={{padding:"18px",background:D.card}}><div style={{fontSize:12,color:D.text3,marginBottom:14}}>{activeAcc.name} — all months separated</div>{mPnlList.length===0?(<div style={{textAlign:"center",padding:"2rem",color:D.text3,fontSize:13}}>No trades with dates yet</div>):(<><div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>{mPnlList.map(([key,mp])=>{const[y,m]=key.split("-");const lbl=MONTHS[parseInt(m)-1]+" "+y;const mt=all.filter(t=>{if(!t.date)return false;const d=new Date(t.date+"T00:00:00");return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`===key;});const mw=mt.filter(t=>t.result==="win").length;const ml2=mt.filter(t=>t.result==="loss").length;const wr=mt.filter(t=>t.result!=="open").length>0?Math.round((mw/mt.filter(t=>t.result!=="open").length)*100):0;return(<div key={key} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:D.statBg,borderRadius:10,border:`1px solid ${D.statBorder}`}}><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:D.text,marginBottom:2}}>{lbl}</div><div style={{fontSize:11,color:D.text3}}>{mt.length} trades · {mw}W / {ml2}L · {wr}% WR</div></div><div style={{fontSize:17,fontWeight:800,color:mp>0?"#0f6e56":mp<0?"#993c1d":D.text3,minWidth:80,textAlign:"right"}}>{(mp>=0?"+":"")+"$"+mp.toFixed(2)}</div></div>);})}</div><div style={{padding:"13px 16px",background:D.topBar,borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:12,color:"#666",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em"}}>Total all months</span><span style={{fontSize:22,fontWeight:900,color:totPnl>0?"#5DCAA5":totPnl<0?"#F09995":"#fff"}}>{(totPnl>=0?"+":"")+"$"+totPnl.toFixed(2)}</span></div></>)}</div>)}
            </div>
            <div style={{marginTop:20,border:`1px solid ${D.border}`,borderRadius:12,overflow:"hidden"}}>
              <div style={{display:"flex",borderBottom:`1px solid ${D.border2}`}}>{[{id:"month",l:`${SHORT_MONTHS[calMi]} Setups`},{id:"all",l:"All-time Setups"}].map(v=>(<button key={v.id} onClick={()=>setSetupView(v.id)} style={{flex:1,padding:"12px",border:"none",background:setupView===v.id?D.navActive:D.statBg,color:setupView===v.id?D.navActiveTxt:D.text3,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{v.l}</button>))}</div>
              <div style={{padding:"16px",background:D.card}}><div style={{fontSize:11,color:D.text3,marginBottom:14}}>{setupView==="month"?"Best & worst setups this month":"Best & worst setups all time"} · {activeAcc.name}</div><SetupPerf stats={setupView==="month"?setupStats(mT):setupStats(all)} D={D}/></div>
            </div>
            <AnalyticsSection all={all} mT={mT} D={D} calMi={calMi} calYear={calYear}/>
          </div>
        )}
        </>)}

        {view==="accounts"&&(
          <AccountsView D={D} dark={dark} accounts={accounts} activeAccId={activeAccId} setActiveAccId={setActiveAccId} allAccTrades={allAccTrades} onNew={()=>{setEditAcc(null);setShowAccModal(true);}} onEdit={a=>{setEditAcc(a);setShowAccModal(true);}}/>
        )}

        {view==="payouts"&&(
          <PayoutsView D={D} dark={dark} user={user} isAdmin={isAdmin} accounts={accounts} allAccTrades={allAccTrades} onWithdraw={withdrawFromAccount}/>
        )}

        {view==="achievements"&&(
          <AchievementsView D={D} dark={dark} user={user} globalPnl={globalPnl}/>
        )}

        {view==="helpcenter"&&(
          <HelpCenterView D={D} dark={dark}/>
        )}
      </div>
      {showSidebar&&(<Sidebar D={D} dark={dark} user={user} isAdmin={isAdmin} view={view} onNavigate={v=>{setView(v);setShowSidebar(false);}} onSettings={()=>{setShowSettings("personal");setShowSidebar(false);}} onReferrals={()=>{setShowSettings("referrals");setShowSidebar(false);}} onAdminPanel={()=>{setShowAdminPanel(true);setShowSidebar(false);}} onClose={()=>setShowSidebar(false)}/>)}
      {showAccModal&&(<AccountModal dark={dark} D={D} existing={editAcc} onSave={acc=>{saveAccount(acc);setShowAccModal(false);if(!activeAccId)setActiveAccId(acc.id);}} onDelete={id=>{deleteAccount(id);setShowAccModal(false);}} onClose={()=>setShowAccModal(false)}/>)}
      {showSettings&&(<SettingsModal D={D} dark={dark} user={user} profile={profile} onSaveProfile={saveProfile} onChangePassword={changePassword} onSetNewPassword={setNewPassword} onChangeEmail={changeEmail} initialTab={showSettings==="referrals"?"referrals":"personal"} onClose={()=>setShowSettings(false)}/>)}
      {showAdminPanel&&(<AdminPanel D={D} dark={dark} onClose={()=>setShowAdminPanel(false)}/>)}
    </div>
  );
}

// ── ERROR BOUNDARY ───────────────────────────────────────────────
// Without this, any unexpected JS error during render unmounts the
// whole app and leaves a blank white screen with no clue why.
// This catches it and shows the actual error so it's fixable.
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error("App crashed:",error,info);}
  render(){
    if(this.state.error){
      return(
        <div style={{minHeight:"100vh",background:"#0d0d0d",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"DM Sans,sans-serif"}}>
          <div style={{maxWidth:520,width:"100%",background:"#161616",border:"1px solid #2a2a2a",borderRadius:16,padding:"28px",color:"#eee"}}>
            <div style={{fontSize:18,fontWeight:800,marginBottom:10}}>⚠️ Something went wrong</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:16,lineHeight:1.5}}>The app hit an error and stopped. Here's the detail (screenshot this if you need help fixing it):</div>
            <pre style={{background:"#0d0d0d",border:"1px solid #2a2a2a",borderRadius:8,padding:12,fontSize:12,color:"#ff6b6b",overflowX:"auto",whiteSpace:"pre-wrap"}}>{String(this.state.error&&(this.state.error.stack||this.state.error.message||this.state.error))}</pre>
            <button onClick={()=>{this.setState({error:null});window.location.reload();}} style={{marginTop:16,padding:"11px 18px",border:"none",borderRadius:9,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>Reload App</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// Mount
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
