function getWeekStart(d){const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const w=new Date(d);w.setDate(diff);w.setHours(0,0,0,0);return w;}
function weekKey(d){return d.toISOString().slice(0,10);}

function compressImageFile(file,maxWidth=1000,quality=0.7){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,maxWidth/img.width);
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Couldn't read this image."));};
    img.src=url;
  });
}

function compressDataUrl(dataUrl,maxWidth=700,quality=0.5){
  return new Promise(resolve=>{
    if(!dataUrl||typeof dataUrl!=="string"||!dataUrl.startsWith("data:image")){resolve(dataUrl);return;}
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxWidth/img.width);
      const w=Math.round(img.width*scale)||1,h=Math.round(img.height*scale)||1;
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

function fmtMoney(amount,code,opts={}){
  const n=parseFloat(amount)||0;
  const sym=currencySymbol(code||"USD");
  const showSign=opts.sign;
  const abs=Math.abs(n);
  const decimals=opts.decimals!==undefined?opts.decimals:2;
  const numStr=abs.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  const sign=showSign?(n>=0?"+":"-"):(n<0?"-":"");
  return`${sign}${sym}${numStr}`;
}

  if(!cloudinaryConfigured)throw new Error("Cloudinary isn't configured yet — add your Cloud Name and Upload Preset in the code (see setup notes near CLOUDINARY_CLOUD_NAME).");
  const blob=await (await fetch(dataUrl)).blob();
  const formData=new FormData();
  formData.append("file",blob);
  formData.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);
  const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,{method:"POST",body:formData});
  if(!res.ok){
    let msg="Cloudinary upload failed.";
    try{const errJson=await res.json();if(errJson?.error?.message)msg=errJson.error.message;}catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  return data.secure_url;
}

    if(!email){reject(new Error("Missing email for payment."));return;}
    const reference=`${planType}_${Date.now()}_${Math.floor(Math.random()*1e6)}`;
    const handler=PaystackPop.setup({
      key:PAYSTACK_PUBLIC_KEY,
      email,
      amount:amountMinor,
      currency:PAYSTACK_CURRENCY,
      ref:reference,
      metadata:{planType,...(metadata||{})},
      callback:function(response){resolve(response);},
      onClose:function(){reject(new Error("cancelled"));}
    });
    handler.openIframe();
  });
}

function getDayColor(ts){
  if(!ts.length)return null;
  const cl=ts.filter(t=>t.result==="win"||t.result==="loss");
  if(!cl.length)return"open";
  const w=cl.filter(t=>t.result==="win").length,l=cl.filter(t=>t.result==="loss").length;
  if(w>0&&l===0)return"win";if(l>0&&w===0)return"loss";
  return w>=l?"win":"loss";
}

function DonutChart({data,title,size=160,D}){
  if(!data||!data.length)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",width:size,height:size}}><div style={{fontSize:11,color:D.text3,textAlign:"center"}}>{title}<br/>No data</div></div>);
  const total=data.reduce((s,d)=>s+Math.abs(d.value),0);
  if(total===0)return null;
  const r=60,cx=80,cy=80,stroke=22;
  let cumAngle=-90;
  const slices=data.map(d=>{const pct=Math.abs(d.value)/total;const angle=pct*360;const start=cumAngle;cumAngle+=angle;return{...d,pct,angle,start};});
  function polarToXY(angle,radius){const rad=angle*Math.PI/180;return{x:cx+radius*Math.cos(rad),y:cy+radius*Math.sin(rad)};}
  function describeArc(startAngle,endAngle,radius){const s=polarToXY(startAngle,radius);const e=polarToXY(endAngle,radius);const large=endAngle-startAngle>180?1:0;return`M${s.x},${s.y} A${radius},${radius},0,${large},1,${e.x},${e.y}`;}
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div style={{fontSize:11,fontWeight:700,color:D.text3,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,textAlign:"center"}}>{title}</div>
      <svg width={size} height={size} viewBox="0 0 160 160">
        {slices.map((s,i)=>(<path key={i} d={describeArc(s.start,s.start+s.angle-0.5,r)} fill="none" stroke={s.color} strokeWidth={stroke} strokeLinecap="butt"/>))}
        <circle cx={cx} cy={cy} r={r-stroke/2-2} fill={D.card}/>
        <text x={cx} y={cy-6} textAnchor="middle" style={{fontSize:11,fill:D.text3,fontFamily:"DM Sans,sans-serif"}}>top</text>
        <text x={cx} y={cy+10} textAnchor="middle" style={{fontSize:13,fontWeight:700,fill:D.text,fontFamily:"DM Sans,sans-serif"}}>{data[0]?.label||""}</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:4,width:"100%",marginTop:4}}>
        {slices.slice(0,4).map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11}}><div style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/><span style={{color:D.text,fontWeight:600,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.label}</span><span style={{color:s.value>=0?"#0f6e56":"#993c1d",fontWeight:700}}>{s.value>=0?"+":""}{s.value.toFixed(2)}$</span></div>))}
      </div>
    </div>
  );
}

function AnalyticsSection({all,mT,D,calMi,calYear}){
  const [view,setView]=useState("month");
  const trades=view==="month"?mT:all;
  const label=view==="month"?`${SHORT_MONTHS[calMi]} ${calYear}`:"All Time";
  function pairStats(arr){const m={};arr.forEach(t=>{if(!t.pair||t.result==="open")return;if(!m[t.pair])m[t.pair]={pnl:0,w:0,l:0};m[t.pair].pnl+=(parseFloat(t.pnl)||0);if(t.result==="win")m[t.pair].w++;if(t.result==="loss")m[t.pair].l++;});return Object.entries(m).map(([k,v])=>({label:k,...v})).sort((a,b)=>b.pnl-a.pnl);}
  function setupStatsArr(arr){const m={};arr.forEach(t=>{if(!t.setup||t.result==="open")return;if(!m[t.setup])m[t.setup]={pnl:0,w:0,l:0};m[t.setup].pnl+=(parseFloat(t.pnl)||0);if(t.result==="win")m[t.setup].w++;if(t.result==="loss")m[t.setup].l++;});return Object.entries(m).map(([k,v])=>({label:k,...v,color:SC[k]||"#888"})).sort((a,b)=>b.pnl-a.pnl);}
  const PAIR_COLORS=["#6366F1","#F59E0B","#10B981","#EF4444","#8B5CF6","#EC4899","#14B8A6","#F97316"];
  const pairs=pairStats(trades);
  const setups=setupStatsArr(trades);
  const bestPairs=pairs.slice(0,5).map((p,i)=>({...p,value:p.pnl,color:PAIR_COLORS[i%PAIR_COLORS.length]}));
  const worstPairs=[...pairs].reverse().slice(0,5).map((p,i)=>({...p,value:p.pnl,color:PAIR_COLORS[i%PAIR_COLORS.length]}));
  const bestSetups=setups.slice(0,5).map(s=>({...s,value:s.pnl}));
  const worstSetups=[...setups].reverse().slice(0,5).map(s=>({...s,value:s.pnl}));
  return(
    <div style={{marginTop:20,border:`1px solid ${D.border}`,borderRadius:12,overflow:"hidden"}}>
      <div style={{display:"flex",borderBottom:`1px solid ${D.border2}`}}>
        {[{id:"month",l:`${SHORT_MONTHS[calMi]} Analytics`},{id:"all",l:"All-Time Analytics"}].map(v=>(<button key={v.id} onClick={()=>setView(v.id)} style={{flex:1,padding:"12px",border:"none",background:view===v.id?D.navActive:D.statBg,color:view===v.id?D.navActiveTxt:D.text3,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{v.l}</button>))}
      </div>
      <div style={{padding:"20px",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)"}}>
        <div style={{fontSize:12,color:D.text3,marginBottom:18}}>{label} — Pair & Setup Performance</div>
        {trades.filter(t=>t.result!=="open").length===0?(<div style={{textAlign:"center",padding:"2rem",color:D.text3,fontSize:13}}>No closed trades for this period yet</div>):(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
            {bestPairs.length>0&&<DonutChart data={bestPairs} title="Best Pairs" D={D}/>}
            {worstPairs.filter(p=>p.value<0).length>0&&<DonutChart data={worstPairs.filter(p=>p.value<0)} title="Worst Pairs" D={D}/>}
            {bestSetups.length>0&&<DonutChart data={bestSetups} title="Best Setups" D={D}/>}
            {worstSetups.filter(s=>s.value<0).length>0&&<DonutChart data={worstSetups.filter(s=>s.value<0)} title="Worst Setups" D={D}/>}

function getISOWeekNum(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=date.getUTCDay()||7;
  date.setUTCDate(date.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}

function AnalyticsDashboard({D,dark,activeAcc,all}){
  const [range,setRange]=useState("month");
  const now=new Date();
  const startOfWeek=(()=>{const d=new Date(now);const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);d.setHours(0,0,0,0);return d;})();
  const trades=(()=>{
    if(range==="day")return all.filter(t=>t.date===`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`);
    if(range==="week")return all.filter(t=>{if(!t.date)return false;const d=new Date(t.date+"T00:00:00");return d>=startOfWeek;});
    if(range==="month")return all.filter(t=>{if(!t.date)return false;const d=new Date(t.date+"T00:00:00");return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    return all;
  })();
  const closed=trades.filter(t=>t.result==="win"||t.result==="loss");
  const wins=closed.filter(t=>t.result==="win");
  const losses=closed.filter(t=>t.result==="loss");
  const winRate=closed.length>0?Math.round((wins.length/closed.length)*100):0;
  const netPnl=trades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const grossWin=wins.reduce((s,t)=>s+Math.max(0,parseFloat(t.pnl)||0),0);
  const grossLoss=Math.abs(losses.reduce((s,t)=>s+Math.min(0,parseFloat(t.pnl)||0),0));
  const profitFactor=grossLoss>0?(grossWin/grossLoss):(grossWin>0?grossWin:0);
  const rrVals=closed.map(t=>Math.abs(parseFloat(t.rr))).filter(v=>!isNaN(v)&&v>0);
  const avgRR=rrVals.length>0?rrVals.reduce((a,b)=>a+b,0)/rrVals.length:0;
  const sortedByDate=[...closed].filter(t=>t.date).sort((a,b)=>b.date.localeCompare(a.date));
  let streak=0,streakType=null;
  for(const t of sortedByDate){if(streak===0){streakType=t.result;streak=1;}else if(t.result===streakType){streak++;}else break;}
  const startBalance=parseFloat(activeAcc?.balance)||0;
  const allTimePnl=all.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const allTimePct=startBalance>0?(allTimePnl/startBalance*100):0;
  const balance=startBalance+allTimePnl;

  let trendMap={},trendKeys=[],trendLabelFor,trendTitle;
  if(range==="day"){
    all.forEach(t=>{if(!t.date)return;trendMap[t.date]=(trendMap[t.date]||0)+(parseFloat(t.pnl)||0);});
    trendKeys=Object.keys(trendMap).sort().slice(-14);
    trendLabelFor=k=>{const d=new Date(k+"T00:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});};
    trendTitle="Daily P&L Trend";
  }else if(range==="month"||range==="all"){
    all.forEach(t=>{if(!t.date)return;const mk=t.date.slice(0,7);trendMap[mk]=(trendMap[mk]||0)+(parseFloat(t.pnl)||0);});
    trendKeys=Object.keys(trendMap).sort().slice(-12);
    trendLabelFor=k=>{const parts=k.split("-");return SHORT_MONTHS[parseInt(parts[1])-1];};
    trendTitle=range==="month"?"Monthly P&L Trend":"All-Time P&L Trend";
  }else{
    all.forEach(t=>{const wk=t._wk;if(!wk)return;trendMap[wk]=(trendMap[wk]||0)+(parseFloat(t.pnl)||0);});
    trendKeys=Object.keys(trendMap).sort().slice(-12);
    trendLabelFor=k=>{const d=new Date(k+"T00:00:00");return"W"+getISOWeekNum(d);};
    trendTitle="Weekly P&L Trend";
  }
  let cum=0;
  const trendPoints=trendKeys.map(k=>{cum+=trendMap[k];return{key:k,label:trendLabelFor(k),cum,periodPnl:trendMap[k]};});
  // With only one data point the line degenerates to a single dot with nothing
  // to connect it to. Prepend a $0 starting point so there's always a real,
  // visible line showing whether P&L is trending up or down.
  const chartPoints=trendPoints.length===1?[{key:"start",label:"Start",cum:0,periodPnl:0},trendPoints[0]]:trendPoints;
  const maxCum=Math.max(0,...chartPoints.map(p=>p.cum));
  const minCum=Math.min(0,...chartPoints.map(p=>p.cum));
  const niceMax=maxCum<=0?100:Math.ceil(maxCum/100)*100;
  const niceMin=minCum>=0?0:Math.floor(minCum/100)*100;
  const chartW=860,chartH=200,padL=48,padB=26,padT=10,padR=10;
  const plotW=chartW-padL-padR,plotH=chartH-padT-padB;
  function xFor(i){return chartPoints.length<=1?padL:padL+(i/(chartPoints.length-1))*plotW;}
  function yFor(v){const range2=(niceMax-niceMin)||1;return padT+plotH-((v-niceMin)/range2)*plotH;}
  // Smooth curve through all points (Catmull-Rom → cubic Bezier), matching the
  // reference design: one continuous curved blue line, not straight segments.
  function smoothPath(pts){
    if(pts.length===0)return"";
    if(pts.length===1)return`M${pts[0].x},${pts[0].y}`;
    let d=`M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i===0?0:i-1],p1=pts[i],p2=pts[i+1],p3=pts[i+2===pts.length+1?i+1:Math.min(i+2,pts.length-1)];
      const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
      const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
      d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }
    return d;
  }
  const curvePts=chartPoints.map((p,i)=>({x:xFor(i),y:yFor(p.cum)}));
  const linePath=smoothPath(curvePts);
  const areaPath=chartPoints.length>0?`${linePath} L${xFor(chartPoints.length-1).toFixed(1)},${yFor(niceMin).toFixed(1)} L${xFor(0).toFixed(1)},${yFor(niceMin).toFixed(1)} Z`:"";

  const setupMap={};
  closed.forEach(t=>{if(!t.setup)return;const r=parseFloat(t.rr)||0;setupMap[t.setup]=(setupMap[t.setup]||0)+r;});
  const setupArr=Object.entries(setupMap).map(([k,v])=>({label:k,r:v})).sort((a,b)=>b.r-a.r);
  const setupMaxAbs=Math.max(1,...setupArr.map(s=>Math.abs(s.r)));
  const bestSetup=setupArr.length?setupArr.reduce((a,b)=>a.r>=b.r?a:b):null;
  const avoidSetup=setupArr.length?setupArr.reduce((a,b)=>a.r<=b.r?a:b):null;

  // Mistake/emotion tag impact — how much each tagged behavior has actually
  // cost (or, rarely, not cost) in real P&L, so patterns aren't just felt,
  // they're measurable.
  const tagMap={};
  trades.forEach(t=>{
    (t.tags||[]).forEach(tag=>{
      if(!tagMap[tag])tagMap[tag]={count:0,pnl:0};
      tagMap[tag].count++;

          <div style={{fontSize:15,fontWeight:800,color:D.text}}>Pair Distribution</div>
          <div style={{fontSize:11.5,color:D.text3,marginTop:2,marginBottom:16}}>Trade volume and performance by pair</div>
          {pairArr.length===0?(

              <svg width={130} height={130} viewBox="0 0 160 160" style={{flexShrink:0}}>
                {(()=>{let cumAngle=-90;return pairArr.map((p,i)=>{const pct=p.count/totalPairTrades;const angle=pct*360;const start=cumAngle;cumAngle+=angle;const r=60,cx=80,cy=80,stroke=22;function polarToXY(a,rad){const rd=a*Math.PI/180;return{x:cx+rad*Math.cos(rd),y:cy+rad*Math.sin(rd)};}const s=polarToXY(start,r),e=polarToXY(start+angle-1,r);const large=angle>180?1:0;const d=`M${s.x},${s.y} A${r},${r},0,${large},1,${e.x},${e.y}`;return<path key={p.label} d={d} fill="none" stroke={PAIR_COLORS[i%PAIR_COLORS.length]} strokeWidth={stroke} strokeLinecap="butt"/>;});})()}

function ImageEditorModal({src,onSave,onClose,D}){
  const canvasRef=useRef();
  const [brightness,setBrightness]=useState(100);
  const [contrast,setContrast]=useState(100);
  const [rotation,setRotation]=useState(0);
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const img=new Image();
    img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.filter=`brightness(${brightness}%) contrast(${contrast}%)`;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.drawImage(img,-img.width/2,-img.height/2);ctx.restore();};
    img.src=src;
  },[src,brightness,contrast,rotation]);
  function handleSave(){onSave(canvasRef.current.toDataURL("image/jpeg",0.92));}
  function handleDownload(){const a=document.createElement("a");a.href=canvasRef.current.toDataURL("image/jpeg",0.92);a.download="trade-chart.jpg";a.click();}

  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:16,padding:"24px",width:"90%",maxWidth:700,border:`1px solid ${D.border}`,boxShadow:"0 24px 80px rgba(0,0,0,0.5)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:800,color:D.text}}>✏️ Edit Image</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>

        <canvas ref={canvasRef} style={{width:"100%",borderRadius:8,border:`1px solid ${D.border}`,marginBottom:16,maxHeight:360,objectFit:"contain"}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:16}}>
          {[{label:"Brightness",val:brightness,set:setBrightness,min:50,max:150},{label:"Contrast",val:contrast,set:setContrast,min:50,max:150}].map(s=>(<div key={s.label}><div style={{fontSize:11,color:D.text3,marginBottom:4,fontWeight:700}}>{s.label}: {s.val}%</div><input type="range" min={s.min} max={s.max} value={s.val} onChange={e=>s.set(Number(e.target.value))} style={{width:"100%",accentColor:"#2563EB"}}/></div>))}
          <div><div style={{fontSize:11,color:D.text3,marginBottom:4,fontWeight:700}}>Rotation: {rotation}°</div><div style={{display:"flex",gap:6}}>{[-90,90,180].map(r=>(<button key={r} onClick={()=>setRotation(v=>(v+r+360)%360)} style={{flex:1,padding:"5px",border:`1px solid ${D.border}`,borderRadius:6,background:D.card2,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text2,fontSize:11,cursor:"pointer"}}>{r>0?"+":""}{r}°</button>))}</div></div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={handleSave} style={{flex:1,padding:"11px",border:"none",borderRadius:10,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:800,cursor:"pointer"}}>💾 Save Changes</button>
          <button onClick={handleDownload} style={{padding:"11px 18px",border:`1px solid ${D.border}`,borderRadius:10,background:"transparent",color:D.text2,fontSize:13,fontWeight:700,cursor:"pointer"}}>⬇ Download</button>

function SetupPerf({stats,D}){
  const entries=Object.keys(stats).map(s=>{const d=stats[s];const tot=d.w+d.l;const wr=tot>0?Math.round((d.w/tot)*100):null;return{name:s,...d,tot,wr};}).filter(e=>e.tot>0);
  if(!entries.length)return(<div style={{textAlign:"center",padding:"2rem",color:D.text3,fontSize:13}}>No closed trades for this period yet</div>);
  const best=entries.reduce((a,b)=>(a.wr||0)>=(b.wr||0)?a:b,entries[0]);
  const worst=entries.reduce((a,b)=>(a.wr||0)<=(b.wr||0)?a:b,entries[0]);
  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:14}}>
        <div style={{flex:1,padding:"11px 14px",background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:10,border:"1px solid #1D9E75"}}><div style={{fontSize:10,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Best setup</div><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,fontWeight:800,padding:"3px 10px",borderRadius:6,background:SC[best.name]||"#666",color:"#fff"}}>{best.name}</span><span style={{fontSize:15,fontWeight:800,color:"#0f6e56"}}>{best.wr}% WR</span></div></div>
        {entries.length>1&&best.name!==worst.name&&(<div style={{flex:1,padding:"11px 14px",background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:10,border:"1px solid #E24B4A"}}><div style={{fontSize:10,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Worst setup</div><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,fontWeight:800,padding:"3px 10px",borderRadius:6,background:SC[worst.name]||"#666",color:"#fff"}}>{worst.name}</span><span style={{fontSize:15,fontWeight:800,color:"#993c1d"}}>{worst.wr}% WR</span></div></div>)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {entries.sort((a,b)=>(b.wr||0)-(a.wr||0)).map(e=>(<div key={e.name} style={{padding:"11px 14px",background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:9,border:`1px solid ${D.statBorder}`}}><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}><span style={{fontSize:12,fontWeight:800,padding:"2px 9px",borderRadius:6,background:SC[e.name]||"#666",color:"#fff"}}>{e.name}</span><span style={{fontSize:12,color:D.text3}}>{e.tot} trades · {e.w}W / {e.l}L</span><span style={{marginLeft:"auto",fontSize:14,fontWeight:800,color:e.wr>=50?"#0f6e56":"#993c1d"}}>{e.wr}%</span><span style={{fontSize:12,fontWeight:700,color:e.pnl>0?"#0f6e56":e.pnl<0?"#993c1d":D.text3}}>{(e.pnl>=0?"+":"")+"$"+e.pnl.toFixed(2)}</span></div><div style={{height:5,background:D.border,borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:(e.wr||0)+"%",background:SC[e.name]||"#888",borderRadius:99,opacity:0.8}}/></div></div>))}
      </div>
    </div>
  );
}

function ImgCard({trade,onImgBefore,onImgAfter,onImgBeforeData,onImgAfterData,onNote,D}){
  const bfRef=useRef(),afRef=useRef();
  const [editImg,setEditImg]=useState(null);
  const [focusedField,setFocusedField]=useState(null);
  const bs=RC[trade.result]||{bg:"#f0f0f0",c:"#888"};
  const wkDate=trade._wk?new Date(trade._wk+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
  useEffect(()=>{
    function handleGlobalPaste(e){
      if(!focusedField)return;
      const items=e.clipboardData?.items;if(!items)return;
      for(const item of items){if(item.type.startsWith("image/")){const file=item.getAsFile();if(!file)return;compressImageFile(file,1000,0.7).then(dataUrl=>{if(focusedField==="imgBefore")onImgBeforeData(dataUrl);else onImgAfterData(dataUrl);}).catch(err=>console.error(err));e.preventDefault();break;}}
    }
    document.addEventListener("paste",handleGlobalPaste);
    return()=>document.removeEventListener("paste",handleGlobalPaste);
  },[focusedField,onImgBeforeData,onImgAfterData]);
  function handleDownload(src,label){const a=document.createElement("a");a.href=src;a.download=`${trade.pair||"trade"}-${label}.jpg`;a.click();}

    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[{label:"📸  BEFORE",img:trade.imgBefore,ref:bfRef,field:"imgBefore",onUp:onImgBefore},{label:"✅  AFTER",img:trade.imgAfter,ref:afRef,field:"imgAfter",onUp:onImgAfter}].map((s,si)=>(

            </div>
            <div onFocus={()=>setFocusedField(s.field)} onBlur={()=>setFocusedField(null)} onClick={()=>s.ref.current.click()} tabIndex={0} style={{height:180,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:D.inputBg,cursor:"pointer",position:"relative",overflow:"hidden",outline:focusedField===s.field?"2px solid #2563EB":"none",transition:"outline 0.15s"}}>
              {s.img?<img src={s.img} alt={s.label} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<><div style={{fontSize:30,marginBottom:8}}>{si===0?"📸":"✅"}</div><div style={{fontSize:12,color:D.text3,fontWeight:500}}>Click to upload</div><div style={{fontSize:11,color:"#2563EB",marginTop:4,fontWeight:600}}>or click here then Ctrl+V to paste</div></>}
              <input ref={s.ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>s.onUp(e.target.files[0])}/>
            </div>
          </div>
        ))}
      </div>
      <div style={{marginTop:10}}>
        <input type="text" value={trade.imgNote||""} onChange={e=>onNote(e.target.value)} placeholder="Caption or notes..." style={{width:"100%",fontSize:12,padding:"7px 10px",border:`1px solid ${D.inputBorder}`,borderRadius:7,background:D.inputBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text,outline:"none"}}/>
      </div>
      {editImg&&(<ImageEditorModal src={editImg.src} D={D} onSave={data=>{if(editImg.field==="imgBefore")onImgBeforeData(data);else onImgAfterData(data);setEditImg(null);}} onClose={()=>setEditImg(null)}/>)}
    </div>
  );
}

                      {img?(<img src={img} alt={c.label} style={{width:"100%",height:"100%",objectFit:"cover"}}/>):(

                          <div style={{fontSize:10.5,color:D.text3}}>PNG, JPG up to 10MB — compressed automatically</div>
                          <div style={{fontSize:11,color:"#2563EB",fontWeight:700}}>Or paste from clipboard (Ctrl+V)</div>
                        </>
                      )}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 22px",borderTop:`1px solid ${D.border}`}}>

          </div>
        </div>
      </div>
    </div>
  );
}

function ChecklistModal({D,dark,existing,accounts,onSave,onClose}){
  const [name,setName]=useState(existing?.name||"");
  const [color,setColor]=useState(existing?.color||CLCOLORS[0]);
  const [account,setAccount]=useState(existing?.account||"");
  const [items,setItems]=useState(existing?.items||[]);
  const [newText,setNewText]=useState("");
  const [newNote,setNewNote]=useState("");
  const [newRequired,setNewRequired]=useState(false);
  const [editIdx,setEditIdx]=useState(null);
  function addItem(){if(!newText.trim())return;const item={text:newText.trim(),note:newNote.trim(),required:newRequired};if(editIdx!==null){setItems(p=>p.map((it,i)=>i===editIdx?item:it));setEditIdx(null);}else{setItems(p=>[...p,item]);}setNewText("");setNewNote("");setNewRequired(false);}
  function removeItem(i){setItems(p=>p.filter((_,j)=>j!==i));}
  function moveItem(i,dir){const a=[...items];const b=i+dir;if(b<0||b>=a.length)return;[a[i],a[b]]=[a[b],a[i]];setItems(a);}
  function startEdit(i){setEditIdx(i);setNewText(items[i].text);setNewNote(items[i].note||"");setNewRequired(items[i].required||false);}
  function submit(){if(!name.trim())return;onSave({id:existing?.id||uid(),name:name.trim(),color,account,items});}
  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)"};
  const inp2=(extra={})=>({fontSize:13,padding:"8px 10px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text,outline:"none",...extra});
  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <div style={{fontSize:18,fontWeight:800,color:D.text}}>{existing?"Edit Checklist":"New Checklist"}</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>
        </div>
        <div style={{marginBottom:14}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Checklist Name</div><input style={{...inp2(),width:"100%",boxSizing:"border-box"}} value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. My OB Setup"/></div>
        <div style={{marginBottom:14}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Color</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{CLCOLORS.map(c=>(<div key={c} onClick={()=>setColor(c)} style={{width:28,height:28,borderRadius:7,background:c,cursor:"pointer",border:color===c?"3px solid "+D.text:"3px solid transparent",transition:"border 0.1s"}}/>))}</div></div>
        <div style={{marginBottom:18}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Assign to Account (optional)</div><select style={{...inp2(),width:"100%",boxSizing:"border-box",colorScheme:dark?"dark":"light"}} value={account} onChange={e=>setAccount(e.target.value)}><option style={{background:dark?"#1a1a1a":"#ffffff",color:dark?"#f0f0f0":"#111111"}} value="">All accounts</option>{accounts.map(a=>(<option style={{background:dark?"#1a1a1a":"#ffffff",color:dark?"#f0f0f0":"#111111"}} key={a.id} value={a.name}>{a.name}</option>))}</select></div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Rules ({items.length})</div>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
            {items.map((item,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"10px 12px",background:D.card2,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:8,border:`1px solid ${D.border}`}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}><span style={{fontSize:13,color:D.text,fontWeight:500}}>{item.text}</span>{item.required&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:4,background:"#EF4444",color:"#fff",fontWeight:800}}>REQ</span>}</div>{item.note&&<div style={{fontSize:11,color:D.text3}}>{item.note}</div>}</div><div style={{display:"flex",gap:4,flexShrink:0}}><button onClick={()=>moveItem(i,-1)} style={{border:`1px solid ${D.border}`,background:"transparent",color:D.text3,borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>↑</button><button onClick={()=>moveItem(i,1)} style={{border:`1px solid ${D.border}`,background:"transparent",color:D.text3,borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>↓</button><button onClick={()=>startEdit(i)} style={{border:`1px solid ${D.border}`,background:"transparent",color:D.text2,borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>✏️</button><button onClick={()=>removeItem(i)} style={{border:"1px solid #E24B4A",background:"transparent",color:"#E24B4A",borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>✕</button></div></div>))}
          </div>
          <div style={{padding:"14px",background:D.card2,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:10,border:`1px solid ${D.border}`}}>
            <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:8}}>{editIdx!==null?"Edit Rule":"Add Rule"}</div>
            <input style={{...inp2(),width:"100%",boxSizing:"border-box",marginBottom:8}} value={newText} onChange={e=>setNewText(e.target.value)} placeholder="Rule description..." onKeyDown={e=>e.key==="Enter"&&addItem()}/>
            <input style={{...inp2(),width:"100%",boxSizing:"border-box",marginBottom:8}} value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Optional sub-note..."/>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><div onClick={()=>setNewRequired(v=>!v)} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}><div style={{width:16,height:16,borderRadius:4,border:`2px solid ${newRequired?"#EF4444":D.border}`,background:newRequired?"#EF4444":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{newRequired&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}</div><span style={{fontSize:12,color:D.text2,fontWeight:600}}>Mark as Required</span></div></div>
            <button onClick={addItem} style={{padding:"8px 18px",border:"none",borderRadius:8,background:color,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>{editIdx!==null?"Update Rule":"+ Add Rule"}</button>
            {editIdx!==null&&<button onClick={()=>{setEditIdx(null);setNewText("");setNewNote("");setNewRequired(false);}} style={{marginLeft:8,padding:"8px 14px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,cursor:"pointer"}}>Cancel</button>}
          </div>
        </div>
        <button onClick={submit} style={{width:"100%",padding:"13px",border:"none",borderRadius:10,background:color,color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer"}}>{existing?"Save Changes":"Create Checklist"}</button>
      </div>
    </div>
  );
}

function StrategyPanel({dark,D,store,setStore,accounts}){

  const notes=store.notes||[];
  const [activeClId,setActiveClId]=useState(null);
  const [showClModal,setShowClModal]=useState(false);

  const activeCl=checklists.find(c=>c.id===activeClId)||checklists[0]||null;
  const [newCriterion,setNewCriterion]=useState("");
  function saveChecklist(cl){setStore(s=>{const ex=(s.checklists||[]).find(c=>c.id===cl.id);return{...s,checklists:ex?(s.checklists||[]).map(c=>c.id===cl.id?cl:c):[...(s.checklists||[]),cl]};},true);}
  function deleteChecklist(id){setStore(s=>({...s,checklists:(s.checklists||[]).filter(c=>c.id!==id)}),true);if(activeClId===id)setActiveClId(null);}
  function duplicateChecklist(cl){const dup={...cl,id:uid(),name:cl.name+" (copy)"};setStore(s=>({...s,checklists:[...(s.checklists||[]),dup]}),true);}
  function updateClItems(cl,items){saveChecklist({...cl,items});}
  function addCriterion(cl){if(!newCriterion.trim())return;updateClItems(cl,[...(cl.items||[]),{text:newCriterion.trim(),note:"",required:false}]);setNewCriterion("");}
  function toggleRequired(cl,idx){const items=[...(cl.items||[])];items[idx]={...items[idx],required:!items[idx].required};updateClItems(cl,items);}
  function deleteItem(cl,idx){updateClItems(cl,(cl.items||[]).filter((_,i)=>i!==idx));}
  function saveNote(note){setStore(s=>{const ex=(s.notes||[]).find(n=>n.id===note.id);return{...s,notes:ex?(s.notes||[]).map(n=>n.id===note.id?note:n):[...(s.notes||[]),note]};});}
  function deleteNote(id){setStore(s=>({...s,notes:(s.notes||[]).filter(n=>n.id!==id)}),true);if(activeNoteId===id){setActiveNoteId(null);setShowNoteEditor(false);}}
  function togglePin(id){setStore(s=>({...s,notes:(s.notes||[]).map(n=>n.id===id?{...n,pinned:!n.pinned}:n)}),true);}
  const folders=["All",...[...new Set(notes.map(n=>n.folder||"General"))].sort()];
  const filteredNotes=notes.filter(n=>activeFolder==="All"||(n.folder||"General")===activeFolder).filter(n=>!noteSearch||(n.title+n.body).toLowerCase().includes(noteSearch.toLowerCase())).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updatedAt||0)-(a.updatedAt||0));
  const activeNote=notes.find(n=>n.id===activeNoteId)||null;
  const inp=(extra={})=>({fontSize:13,padding:"8px 10px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text,outline:"none",...extra});

        <div style={{fontSize:13,color:D.text3,marginTop:2}}>Build your trading rules and write your trading plan.</div>
      </div>
      <div style={{display:"flex",gap:4,padding:5,borderRadius:12,background:D.statBg,border:`1px solid ${D.border}`,marginBottom:20,width:"fit-content"}}>
        {[{id:"rules",icon:"✓",label:"Rules"},{id:"notes",icon:"📄",label:"Note For Plan"}].map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 18px",border:"none",borderRadius:8,background:tab===t.id?D.card:"transparent",color:tab===t.id?"#2563EB":D.text3,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.15s",display:"flex",alignItems:"center",gap:7}}>{t.icon} {t.label}</button>))}
      </div>
      {tab==="rules"&&(
        <div className="split-cols-260" style={{gap:16}}>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button onClick={()=>{setEditCl(null);setShowClModal(true);}} style={{padding:"11px",border:`2px dashed ${D.border}`,borderRadius:10,background:"transparent",color:D.text3,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:4}}>+ New Checklist</button>
            {checklists.length===0&&(<div style={{textAlign:"center",padding:"2rem 1rem",color:D.text3,fontSize:12,border:`1px dashed ${D.border}`,borderRadius:10}}>No checklists yet.<br/>Create one to get started.</div>)}
            {checklists.map(cl=>(<div key={cl.id} onClick={()=>setActiveClId(cl.id)} style={{padding:"12px 14px",borderRadius:10,border:`2px solid ${activeClId===cl.id?cl.color||"#2563EB":D.border}`,background:activeClId===cl.id?(cl.color||"#2563EB")+"18":D.card,cursor:"pointer",transition:"all 0.15s"}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}><div style={{width:10,height:10,borderRadius:"50%",background:cl.color||"#2563EB",flexShrink:0}}/><span style={{fontSize:13,fontWeight:700,color:activeClId===cl.id?(cl.color||"#2563EB"):D.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl.name}</span></div><div style={{fontSize:11,color:D.text3}}>{(cl.items||[]).length} rules · {cl.account||"All accounts"}</div></div>))}

  const propMaxed=isNew&&propCount>=limits.prop;

            </div>
          </div>

  function maskEmail(e){if(!e)return"";const parts=e.split("@");if(parts.length<2)return e;const u=parts[0];return u.slice(0,2)+"•••"+u.slice(-1)+"@"+parts[1];}

  async function submitPw(){
    if(!curPw||!newPw){setPwMsg({ok:false,msg:"Fill in both fields."});return;}
    if(newPw.length<6){setPwMsg({ok:false,msg:"New password must be at least 6 characters."});return;}
    setPwBusy(true);setPwMsg(null);
    const r=await onChangePassword(curPw,newPw);
    setPwMsg(r);setPwBusy(false);
    if(r.ok){setCurPw("");setNewPw("");setShowPwForm(false);}
  }
  async function submitSetPw(){
    if(!setPw1||!setPw2){setSetPwMsg({ok:false,msg:"Fill in both fields."});return;}
    if(setPw1.length<6){setSetPwMsg({ok:false,msg:"Password must be at least 6 characters."});return;}
    if(setPw1!==setPw2){setSetPwMsg({ok:false,msg:"Passwords do not match."});return;}
    setSetPwBusy(true);setSetPwMsg(null);
    const r=await onSetNewPassword(setPw1);
    setSetPwMsg(r);setSetPwBusy(false);
    if(r.ok){setSetPw1("");setSetPw2("");}
  }
  async function submitEmail(){
    if(!newEmail){setEmailMsg({ok:false,msg:"Enter the new email."});return;}
    if(hasPasswordProvider&&!curPw2){setEmailMsg({ok:false,msg:"Enter your current password."});return;}
    setEmailBusy(true);setEmailMsg(null);
    const r=await onChangeEmail(curPw2,newEmail);
    setEmailMsg(r);setEmailBusy(false);
    if(r.ok){setCurPw2("");setNewEmail("");setShowEmailForm(false);}
  }

  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)",padding:16};
  const inp=(extra={})=>({width:"100%",fontSize:13,padding:"9px 11px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text,outline:"none",boxSizing:"border-box",...extra});
  const msgBox=m=>(<div style={{marginBottom:12,padding:"9px 12px",borderRadius:8,fontSize:12,fontWeight:600,background:m.ok?(dark?"#0a2a1a":"#eafaf1"):(dark?"#2a0a0a":"#fdeeee"),color:m.ok?"#0f6e56":"#993c1d"}}>{m.msg}</div>);

  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:16,padding:"26px",width:"100%",maxWidth:560,maxHeight:"88vh",overflowY:"auto",border:`1px solid ${D.border}`,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",boxSizing:"border-box"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <div style={{fontSize:20,fontWeight:800,color:D.text}}>Settings</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:24,flexWrap:"wrap"}}>
          <button onClick={()=>setTab("personal")} style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",border:`1.5px solid ${tab==="personal"?D.navActive:D.border}`,background:tab==="personal"?D.navActive:"transparent",color:tab==="personal"?D.navActiveTxt:D.text2,transition:"all 0.15s"}}>Personal Data</button>
          <button onClick={()=>setTab("security")} style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",border:`1.5px solid ${tab==="security"?D.navActive:D.border}`,background:tab==="security"?D.navActive:"transparent",color:tab==="security"?D.navActiveTxt:D.text2,transition:"all 0.15s"}}>Security Settings</button>
          <button onClick={()=>setTab("referrals")} style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",border:`1.5px solid ${tab==="referrals"?D.navActive:D.border}`,background:tab==="referrals"?D.navActive:"transparent",color:tab==="referrals"?D.navActiveTxt:D.text2,transition:"all 0.15s"}}>Referrals</button>
        </div>

        {tab==="personal"&&(
          <div>
            <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:16}}>Personal Data</div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>Full Name</div>
              <input style={inp()} value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name"/>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>Phone Number</div>
              <input style={inp()} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="e.g. +234 800 000 0000"/>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>Email</div>
              <div style={{...inp(),background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text3}}>{user?.email}</div>
            </div>
            {profileMsg&&msgBox(profileMsg)}
            <button onClick={submitProfile} disabled={savingProfile} style={{padding:"12px 22px",border:"none",borderRadius:10,background:D.navActive,color:D.navActiveTxt,fontSize:14,fontWeight:800,cursor:savingProfile?"not-allowed":"pointer",opacity:savingProfile?0.6:1}}>{savingProfile?"Saving...":"Save Changes"}</button>
          </div>
        )}

        {tab==="security"&&(
          <div>
            <div style={{fontSize:16,fontWeight:800,color:D.text,marginBottom:6}}>Authorization</div>
            <div style={{fontSize:12,color:D.text3,marginBottom:20,lineHeight:1.5}}>Information for logging in to your account. Change your password whenever you think it might have been compromised.</div>

            {!hasPasswordProvider&&(<div style={{padding:"12px 16px",borderRadius:9,background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",border:`1px solid ${D.border}`,fontSize:12,color:D.text3,marginBottom:16,lineHeight:1.5}}>You signed in with Google. Set a password below to also be able to sign in with your email and a password.</div>)}

            <div style={{borderTop:`1px solid ${D.border}`}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 0",borderBottom:`1px solid ${D.border}`,flexWrap:"wrap",gap:10}}>
                <div>
                  <div style={{fontSize:12,color:D.text3,marginBottom:4}}>Email</div>
                  <div style={{fontSize:14,fontWeight:600,color:D.text}}>{maskEmail(user?.email)}</div>
                </div>
                <button onClick={()=>{setShowEmailForm(v=>!v);setEmailMsg(null);}} style={{padding:"8px 16px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,fontWeight:700,cursor:"pointer"}}>{showEmailForm?"Cancel":"Change"}</button>
              </div>
              {showEmailForm&&(
                <div style={{padding:"16px 0",borderBottom:`1px solid ${D.border}`}}>
                  {hasPasswordProvider?(
                    <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>Current Password</div><input type="password" style={inp()} value={curPw2} onChange={e=>setCurPw2(e.target.value)}/></div>
                  ):(
                    <div style={{marginBottom:10,fontSize:12,color:D.text3,lineHeight:1.5}}>You'll be asked to confirm via Google before the email updates.</div>
                  )}
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>New Email</div><input type="email" style={inp()} value={newEmail} onChange={e=>setNewEmail(e.target.value)}/></div>
                  {emailMsg&&msgBox(emailMsg)}
                  <button onClick={submitEmail} disabled={emailBusy} style={{padding:"10px 18px",border:"none",borderRadius:8,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:700,cursor:emailBusy?"not-allowed":"pointer",opacity:emailBusy?0.6:1}}>{emailBusy?"Updating...":"Update Email"}</button>
                </div>
              )}

              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 0",flexWrap:"wrap",gap:10}}>
                <div>
                  <div style={{fontSize:12,color:D.text3,marginBottom:4}}>Password</div>
                  <div style={{fontSize:14,fontWeight:600,color:D.text}}>{hasPasswordProvider?"••••••••••••":"Not set"}</div>
                </div>
                {hasPasswordProvider&&<button onClick={()=>{setShowPwForm(v=>!v);setPwMsg(null);}} style={{padding:"8px 16px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,fontWeight:700,cursor:"pointer"}}>{showPwForm?"Cancel":"Change"}</button>}
                {!hasPasswordProvider&&<button onClick={()=>{setShowSetPwForm(v=>!v);setSetPwMsg(null);}} style={{padding:"8px 16px",border:"none",borderRadius:8,background:"#2563EB",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>{showSetPwForm?"Cancel":"Set Password"}</button>}
              </div>
              {showSetPwForm&&(
                <div style={{padding:"0 0 16px"}}>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>New Password</div><input type="password" style={inp()} value={setPw1} onChange={e=>setSetPw1(e.target.value)} placeholder="At least 6 characters"/></div>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>Confirm Password</div><input type="password" style={inp()} value={setPw2} onChange={e=>setSetPw2(e.target.value)} placeholder="Repeat password"/></div>
                  {settingPwMsg&&msgBox(settingPwMsg)}
                  <button onClick={submitSetPw} disabled={settingPwBusy} style={{padding:"10px 18px",border:"none",borderRadius:8,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:700,cursor:settingPwBusy?"not-allowed":"pointer",opacity:settingPwBusy?0.6:1}}>{settingPwBusy?"Saving...":"Set Password"}</button>
                </div>
              )}
              {showPwForm&&(
                <div style={{padding:"0 0 16px"}}>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>Current Password</div><input type="password" style={inp()} value={curPw} onChange={e=>setCurPw(e.target.value)}/></div>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>New Password</div><input type="password" style={inp()} value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="At least 6 characters"/></div>
                  {pwMsg&&msgBox(pwMsg)}
                  <button onClick={submitPw} disabled={pwBusy} style={{padding:"10px 18px",border:"none",borderRadius:8,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:700,cursor:pwBusy?"not-allowed":"pointer",opacity:pwBusy?0.6:1}}>{pwBusy?"Updating...":"Update Password"}</button>
                </div>
              )}
            </div>
          </div>
        )}

        {tab==="referrals"&&(<ReferralsPanel D={D} dark={dark} user={user} profile={profile} refLink={refLink} refCopied={refCopied} setRefCopied={setRefCopied}/>)}
      </div>
    </div>
  );
}


function AdminPanel({D,dark}){
  const [adminTab,setAdminTab]=useState("pending");
  const [users,setUsers]=useState(null);
  const [busyId,setBusyId]=useState(null);
  const [err,setErr]=useState(null);
  const [q,setQ]=useState("");
  const [statusFilter,setStatusFilter]=useState("all");
  const [confirmDeleteUid,setConfirmDeleteUid]=useState(null);
  const [showAddUser,setShowAddUser]=useState(false);

  async function addNewUser({name,email,phone,password}){
    if(!window._fb)return{ok:false,msg:"Firebase not ready."};
    try{
      const {secondaryAuth,createUserWithEmailAndPassword,updateProfile,db,doc,setDoc,signOut}=window._fb;
      const cred=await createUserWithEmailAndPassword(secondaryAuth,email,password);
      if(name)await updateProfile(cred.user,{displayName:name});
      await setDoc(doc(db,"users",cred.user.uid,"profile","main"),{name:name||"",email,phone:phone||"",createdAt:new Date().toISOString(),approved:false,planType:null,expiresAt:null});
      await signOut(secondaryAuth);
      return{ok:true,msg:`Account created for ${email}. They're in Pending Approval — approve once they've paid.`};
    }catch(e){console.error(e);return{ok:false,msg:authErrMsg(e)};}
  }


  useEffect(()=>{
    if(!window._fb){setErr("Firebase not ready.");return;}
    const {db,collectionGroup,onSnapshot}=window._fb;
    const unsub=onSnapshot(collectionGroup(db,"profile"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,ref:d.ref,...d.data()}));
      list.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
      setUsers(list);
      setErr(null);
    },e=>{console.error(e);setErr("Couldn't load users. Make sure your Firestore rules allow admin access (see setup notes).");});
    return()=>unsub();
  },[]);

  async function deleteUserProfile(u){
    if(!window._fb)return;
    if(u.approved===true&&u.planType==="onetime")return;
    setBusyId(u.uid);
    try{
      const {db,doc,deleteDoc}=window._fb;
      await deleteDoc(doc(db,"users",u.uid,"profile","main"));
    }catch(e){console.error(e);setErr("Couldn't delete this user. Check your Firestore rules allow admin delete access.");}
    setBusyId(null);
    setConfirmDeleteUid(null);
  }

  async function rewardReferrer(referredBy,planType,referredUid){
    if(!window._fb||!referredBy)return;
    try{
      const {db,doc,getDoc,setDoc,collection,addDoc}=window._fb;
      const refDocRef=doc(db,"users",referredBy,"profile","main");
      const refSnap=await getDoc(refDocRef);
      if(!refSnap.exists())return;
      const refData=refSnap.data();

      const price=planType==="onetime"?49:planType==="monthly"?10:0;
      const earned=price*0.05;
      if(earned>0){
        await addDoc(collection(db,"users",referredBy,"referralEarnings"),{amount:earned,planType,referredUid,createdAt:new Date().toISOString()});
        const newTotal=(parseFloat(refData.referralEarningsTotal)||0)+earned;
        await setDoc(refDocRef,{referralEarningsTotal:newTotal},{merge:true});
      }

      if(refData.approved===true&&(refData.planType==="monthly"||refData.planType==="trial")){
        const base=refData.expiresAt&&new Date(refData.expiresAt).getTime()>Date.now()?new Date(refData.expiresAt):new Date();
        base.setDate(base.getDate()+15);
        await setDoc(refDocRef,{expiresAt:base.toISOString()},{merge:true});
      }
    }catch(e){console.error(e);}
  }

  async function setApproval(u,val,planType){
    if(!window._fb)return;
    setBusyId(u.uid);
    try{
      const {setDoc}=window._fb;
      if(val){
        const now=new Date();
        const payload={approved:true,planType,approvedAt:now.toISOString()};
        if(planType==="monthly"){
          const exp=new Date(now);exp.setDate(exp.getDate()+30);
          payload.expiresAt=exp.toISOString();
        }else if(planType==="trial"){
          const exp=new Date(now);exp.setDate(exp.getDate()+14);
          payload.expiresAt=exp.toISOString();
        }else{
          payload.expiresAt=null;
        }
        await setDoc(u.ref,payload,{merge:true});
        if((planType==="onetime"||planType==="monthly")&&u.referredBy&&!u.referralRewarded){
          await rewardReferrer(u.referredBy,planType,u.uid);
          await setDoc(u.ref,{referralRewarded:true},{merge:true});
        }
      }else{
        await setDoc(u.ref,{approved:false,planType:null,expiresAt:null},{merge:true});
      }
    }catch(e){console.error(e);}
    setBusyId(null);
  }

  function isActive(u){
    if(u.approved!==true)return false;
    if((u.planType==="monthly"||u.planType==="trial")&&u.expiresAt&&new Date(u.expiresAt).getTime()<Date.now())return false;
    return true;
  }

  const all=users||[];
  const ql=q.trim().toLowerCase();
  const searched=ql?all.filter(u=>(u.name||"").toLowerCase().includes(ql)||(u.email||"").toLowerCase().includes(ql)):all;

  function userStatus(u){
    if(isActive(u))return"approved";
    if(u.approvedAt)return"revoked";
    return"pending";
  }
  const pendingList=searched.filter(u=>userStatus(u)==="pending");
  const approvedList=searched.filter(u=>userStatus(u)==="approved");
  const revokedList=searched.filter(u=>userStatus(u)==="revoked");
  const statusFiltered=statusFilter==="all"?searched:statusFilter==="pending"?pendingList:statusFilter==="approved"?approvedList:revokedList;

  function badge(label,color){
    return(<span style={{display:"inline-flex",alignItems:"center",padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700,color,background:color+"22",whiteSpace:"nowrap"}}>{label}</span>);
  }

  function daysLeft(u){
    if(!u.expiresAt)return null;
    const ms=new Date(u.expiresAt).getTime()-Date.now();
    return Math.max(0,Math.ceil(ms/(1000*60*60*24)));
  }

  function userCard(u){
    const isAdminAcc=isAdminEmail(u.email);
    const status=userStatus(u);
    const dl=(status==="approved"&&(u.planType==="monthly"||u.planType==="trial"))?daysLeft(u):null;
    return(
      <div key={u.uid} style={{display:"flex",alignItems:"center",gap:14,padding:"16px 18px",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",border:`1px solid ${D.border}`,borderRadius:13,marginBottom:10,flexWrap:"wrap"}}>
        <div style={{width:38,height:38,borderRadius:"50%",background:"#2563EB",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:800,color:"#fff",flexShrink:0}}>{(u.name||u.email||"?").charAt(0).toUpperCase()}</div>
        <div style={{flex:1,minWidth:180}}>
          <div style={{fontSize:14,fontWeight:800,color:D.text}}>{u.name||"(no name)"}</div>
          <div style={{fontSize:11.5,color:D.text3,marginTop:1}}>{u.email}{u.phone?" · "+u.phone:""}</div>
          {u.referredBy&&<div style={{fontSize:11,color:D.text2,fontWeight:600,marginTop:2}}>Referred by: {u.referredBy}</div>}
          <div style={{fontSize:10.5,color:D.text3,marginTop:2}}>Signed up {u.createdAt?new Date(u.createdAt).toISOString().slice(0,10):"—"}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {isAdminAcc?badge("Admin","#D97706"):status==="pending"?badge("Pending","#D97706"):status==="revoked"?badge("Revoked","#EF4444"):badge(`Approved · ${u.planType||""}`,"#22C55E")}
          {dl!==null&&dl<=5&&badge(dl+"d left","#D97706")}
          {!isAdminAcc&&(<>
            {status==="pending"&&(
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button onClick={()=>setApproval(u,true,"onetime")} disabled={busyId===u.uid} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#22C55E",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"✓ Approve One-Time"}</button>
                <button onClick={()=>setApproval(u,true,"monthly")} disabled={busyId===u.uid} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#2563EB",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"✓ Approve Monthly"}</button>
                <button onClick={()=>setApproval(u,true,"trial")} disabled={busyId===u.uid} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#8B5CF6",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"14-Day Trial"}</button>
              </div>
            )}
            {status==="approved"&&(
              <button onClick={()=>setApproval(u,false,null)} disabled={busyId===u.uid} style={{padding:"6px 13px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:"#EF4444",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"✕ Revoke"}</button>
            )}
            {status==="revoked"&&(
              <button onClick={()=>setApproval(u,true,"monthly")} disabled={busyId===u.uid} style={{padding:"6px 13px",border:"none",borderRadius:7,background:"#22C55E",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"✓ Re-approve"}</button>
            )}
            {u.approved===true&&u.planType==="onetime"?(
              <button disabled title="One-Time access can't be deleted — revoke first if needed" style={{padding:"6px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text3,fontSize:11,fontWeight:700,cursor:"not-allowed",whiteSpace:"nowrap",opacity:0.45}}>🔒</button>
            ):confirmDeleteUid===u.uid?(
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontSize:11,color:D.text2,fontWeight:600,whiteSpace:"nowrap"}}>Delete?</span>
                <button onClick={()=>deleteUserProfile(u)} disabled={busyId===u.uid} style={{padding:"6px 11px",border:"none",borderRadius:7,background:"#EF4444",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"Yes"}</button>
                <button onClick={()=>setConfirmDeleteUid(null)} style={{padding:"6px 11px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>No</button>
              </div>
            ):(
              <button onClick={()=>setConfirmDeleteUid(u.uid)} title="Delete this account's profile" style={{padding:"6px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text3,fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>🗑️</button>
            )}
          </>)}
        </div>
      </div>
    );
  }

  const adminTabs=[{id:"pending",icon:"👥",l:"Pending Approvals"},{id:"homepage",icon:"✏️",l:"Landing Page Editor"},{id:"message",icon:"💬",l:"Bulk Messaging"},{id:"payouts",icon:"💲",l:"Referral Payouts"}];

  return(
    <div>
      <div style={{marginBottom:18}}>
        <div style={{fontSize:24,fontWeight:800,color:D.text}}>Admin Panel</div>
        <div style={{fontSize:13,color:D.text3,marginTop:2}}>Manage users, content, messages, and payouts.</div>
      </div>

      <div style={{display:"flex",gap:4,padding:5,borderRadius:13,background:D.statBg,border:`1px solid ${D.border}`,marginBottom:20,flexWrap:"wrap"}}>
        {adminTabs.map(t=>(
          <button key={t.id} onClick={()=>setAdminTab(t.id)} style={{flex:"1 1 auto",padding:"10px 14px",border:"none",borderRadius:9,background:adminTab===t.id?D.card:"transparent",color:adminTab===t.id?"#2563EB":D.text3,fontSize:12.5,fontWeight:700,cursor:"pointer",transition:"all 0.15s",display:"flex",alignItems:"center",justifyContent:"center",gap:7,whiteSpace:"nowrap"}}>{t.icon} {t.l}</button>
        ))}
      </div>

      {adminTab==="pending"&&(<>
        <div style={{display:"flex",gap:4,padding:4,borderRadius:11,background:D.statBg,border:`1px solid ${D.border}`,marginBottom:16,width:"fit-content"}}>

function BulkMessagingTab({D,dark,users}){
  const [audience,setAudience]=useState("all");
  const [channel,setChannel]=useState("inapp");
  const [message,setMessage]=useState("");
  const [sending,setSending]=useState(false);
  const [result,setResult]=useState(null);

  function isActiveUser(u){
    if(u.approved!==true)return false;
    if((u.planType==="monthly"||u.planType==="trial")&&u.expiresAt&&new Date(u.expiresAt).getTime()<Date.now())return false;
    return true;
  }

  const segments=[
    {id:"all",l:"All Users",n:users.length},
    {id:"trial",l:"Trial",n:users.filter(u=>isActiveUser(u)&&u.planType==="trial").length},
    {id:"monthly",l:"Monthly",n:users.filter(u=>isActiveUser(u)&&u.planType==="monthly").length},
    {id:"onetime",l:"Onetime",n:users.filter(u=>isActiveUser(u)&&u.planType==="onetime").length},
    {id:"pending",l:"Pending",n:users.filter(u=>!isActiveUser(u)).length},
  ];
  const audienceUsers=(()=>{
    if(audience==="all")return users;
    if(audience==="pending")return users.filter(u=>!isActiveUser(u));
    return users.filter(u=>isActiveUser(u)&&u.planType===audience);
  })();

  const channels=[{id:"inapp",l:"In-App Notification"},{id:"whatsapp",l:"WhatsApp"},{id:"email",l:"Email"}];

  async function send(){
    if(!message.trim())return;
    setSending(true);setResult(null);

        if(!window._fb)throw new Error("Firebase not ready.");
        const {db,collection,addDoc}=window._fb;
        await addDoc(collection(db,"broadcasts"),{audience,message:message.trim(),recipientCount:audienceUsers.length,createdAt:new Date().toISOString()});

          </div>
        ))}
      </div>
      <div style={{fontSize:12,color:D.text3,marginBottom:16,lineHeight:1.5}}>Referral 5% revenue-share withdrawal requests. Pay the person directly using the details shown, then mark it Paid.</div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>

      {filtered&&filtered.length===0&&(<div style={{textAlign:"center",padding:"40px 0",color:D.text3,fontSize:13}}>No {filter!=="all"?filter:""} requests.</div>)}

function HomepageContentTab({D,dark}){
  const [vals,setVals]=useState(DEFAULT_LANDING);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState(null);
  const [uploadingKey,setUploadingKey]=useState(null);
  const [uploadErr,setUploadErr]=useState({});
  const [confirmReset,setConfirmReset]=useState(false);

  useEffect(()=>{
    if(!window._fb)return;
    const {db,doc,getDoc}=window._fb;
    getDoc(doc(db,"siteContent","landing")).then(snap=>{
      if(snap.exists())setVals(prev=>({...prev,...snap.data()}));
      setLoading(false);
    }).catch(e=>{console.error(e);setLoading(false);});
  },[]);

  function set(key,val){setVals(v=>({...v,[key]:val}));}

  function resizeAndEncode(file,maxWidth=900,quality=0.75){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=()=>{
        URL.revokeObjectURL(url);
        const scale=Math.min(1,maxWidth/img.width);
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Couldn't read this image."));};
      img.src=url;
    });
  }

  async function uploadImage(key,file){
    if(!file)return;
    if(!file.type.startsWith("image/")){setUploadErr(e=>({...e,[key]:"Please choose an image file."}));return;}
    if(file.size>15*1024*1024){setUploadErr(e=>({...e,[key]:"Image is too large — please choose a smaller photo (under 15MB)."}));return;}
    setUploadErr(e=>({...e,[key]:null}));
    setUploadingKey(key);
    try{
      let dataUrl=await resizeAndEncode(file,900,0.75);
      if(dataUrl.length>700000)dataUrl=await resizeAndEncode(file,700,0.6);
      if(dataUrl.length>700000)dataUrl=await resizeAndEncode(file,500,0.5);
      if(dataUrl.length>700000){setUploadErr(e=>({...e,[key]:"This image is hard to compress enough — try a simpler photo or a smaller one."}));setUploadingKey(null);return;}
      set(key,dataUrl);
    }catch(e){console.error(e);setUploadErr(er=>({...er,[key]:"Couldn't process this image. Try a different file."}));}
    setUploadingKey(null);
  }

  async function save(){
    if(!window._fb)return;
    setSaving(true);setMsg(null);
    try{
      const {db,doc,setDoc}=window._fb;
      await setDoc(doc(db,"siteContent","landing"),vals,{merge:true});
      setMsg({ok:true,msg:"Saved! Changes are live on the homepage immediately."});
    }catch(e){console.error(e);setMsg({ok:false,msg:"Couldn't save. Check your Firestore rules allow admin write to siteContent."});}
    setSaving(false);
  }

  function resetToDefault(){
    setVals(DEFAULT_LANDING);
    setConfirmReset(false);
  }

  const inp=(extra={})=>({width:"100%",fontSize:13,padding:"10px 12px",border:`1px solid ${D.border}`,borderRadius:8,background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",color:D.text,outline:"none",boxSizing:"border-box",fontFamily:"inherit",...extra});
  const ta=(extra={})=>inp({resize:"vertical",lineHeight:1.5,...extra});
  const lbl={fontSize:11,color:D.text3,fontWeight:700,marginBottom:5,display:"block",textTransform:"uppercase",letterSpacing:"0.05em"};
  const section={fontSize:13,fontWeight:800,color:D.text,marginBottom:14,marginTop:26,paddingBottom:8,borderBottom:`1px solid ${D.border2}`};

function authErrMsg(e){
  const code=(e&&e.code)||"";
  if(code.includes("email-already-in-use"))return"This email is already registered. Try signing in instead.";
  if(code.includes("invalid-email"))return"Please enter a valid email address.";
  if(code.includes("weak-password"))return"Password is too weak. Use at least 6 characters.";
  if(code.includes("wrong-password")||code.includes("invalid-credential"))return"Incorrect email or password.";
  if(code.includes("user-not-found"))return"No account found with this email.";
  if(code.includes("too-many-requests"))return"Too many attempts. Please wait a moment and try again.";
  if(code.includes("popup-closed-by-user"))return"Sign-in popup was closed before completing.";
  if(code.includes("network-request-failed"))return"Network error. Check your connection and try again.";
  return"Something went wrong. Please try again.";
}

function AllTradesView({D,dark,accounts,allAccTrades,onJumpToWeek,onDelete}){

  const setups=Array.from(new Set(allTrades.map(t=>t.setup).filter(Boolean))).sort();

  const ql=q.trim().toLowerCase();
  const filtered=allTrades.filter(t=>{
    if(resultFilter!=="all"&&t.result!==resultFilter)return false;
    if(setupFilter!=="all"&&t.setup!==setupFilter)return false;
    if(accFilter!=="all"&&t._accId!==accFilter)return false;
    if(ql&&!(`${t.pair||""} ${t.note||""} ${t.noteBefore||""} ${t.noteAfter||""} ${t.setup||""}`.toLowerCase().includes(ql)))return false;
    return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  // correct symbol to sum in, so the aggregate stat cards fall back to USD
  // while each row still shows its own account's real currency.
