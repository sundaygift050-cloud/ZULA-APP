// ── ADMIN PANEL (approve/reject new signups) ─────────────────────
function AdminPanel({D,dark,onClose}){
  const [adminTab,setAdminTab]=useState("pending"); // pending | add | message
  const [users,setUsers]=useState(null);
  const [busyId,setBusyId]=useState(null);
  const [err,setErr]=useState(null);
  const [q,setQ]=useState("");
  const [confirmDeleteUid,setConfirmDeleteUid]=useState(null);

  // Creates a real login for a user via an isolated secondary Firebase Auth
  // instance, so the admin's own session is never touched. New account is
  // created NOT approved — admin still approves (one-time/monthly/trial)
  // after the user pays, same as any self-signup.
  async function addNewUser({name,email,phone,password}){
    if(!window._fb)return{ok:false,msg:"Firebase not ready."};
    try{
      const {secondaryAuth,createUserWithEmailAndPassword,updateProfile,db,doc,setDoc,signOut}=window._fb;
      const cred=await createUserWithEmailAndPassword(secondaryAuth,email,password);
      if(name)await updateProfile(cred.user,{displayName:name});
      await setDoc(doc(db,"users",cred.user.uid,"profile","main"),{name:name||"",email,phone:phone||"",createdAt:new Date().toISOString(),approved:false,planType:null,expiresAt:null});
      await signOut(secondaryAuth);
      return{ok:true,msg:`Account created for ${email}. They're in Pending Approval — approve once they've paid.`};
    }catch(e){console.error(e);return{ok:false,msg:authErrMsg(e)};}
  }


  useEffect(()=>{
    if(!window._fb){setErr("Firebase not ready.");return;}
    const {db,collectionGroup,onSnapshot}=window._fb;
    const unsub=onSnapshot(collectionGroup(db,"profile"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,ref:d.ref,...d.data()}));
      list.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
      setUsers(list);
      setErr(null);
    },e=>{console.error(e);setErr("Couldn't load users. Make sure your Firestore rules allow admin access (see setup notes).");});
    return()=>unsub();
  },[]);

  // Deletes the user's Firestore profile/data only. Their Firebase Auth
  // login still technically exists (deleting that requires a server-side
  // Admin SDK, which this app doesn't have) but with no profile doc they
  // disappear from every list here and can't use the app.
  async function deleteUserProfile(u){
    if(!window._fb)return;
    if(u.approved===true&&u.planType==="onetime")return; // blocked, button is disabled in UI for this case
    setBusyId(u.uid);
    try{
      const {db,doc,deleteDoc}=window._fb;
      await deleteDoc(doc(db,"users",u.uid,"profile","main"));
    }catch(e){console.error(e);setErr("Couldn't delete this user. Check your Firestore rules allow admin delete access.");}
    setBusyId(null);
    setConfirmDeleteUid(null);
  }

  // When a referred user is approved with a paid plan (one-time or monthly,
  // not trial), reward whoever referred them: +15 days if the referrer is on
  // monthly/trial, or a flag asking them to message you about a 5% revenue
  // share if the referrer already has lifetime (one-time) access.
  async function rewardReferrer(referredBy,planType,referredUid){
    if(!window._fb||!referredBy)return;
    try{
      const {db,doc,getDoc,setDoc,collection,addDoc}=window._fb;
      const refDocRef=doc(db,"users",referredBy,"profile","main");
      const refSnap=await getDoc(refDocRef);
      if(!refSnap.exists())return;
      const refData=refSnap.data();

      // 5% revenue share, every time — regardless of the referrer's own plan
      const price=planType==="onetime"?49:planType==="monthly"?10:0;
      const earned=price*0.05;
      if(earned>0){
        await addDoc(collection(db,"users",referredBy,"referralEarnings"),{amount:earned,planType,referredUid,createdAt:new Date().toISOString()});
        const newTotal=(parseFloat(refData.referralEarningsTotal)||0)+earned;
        await setDoc(refDocRef,{referralEarningsTotal:newTotal},{merge:true});
      }

      // Extra: +15 days, only if the referrer is on monthly/trial (has an
      // expiry to extend). One-time/lifetime referrers just earn the 5% above.
      if(refData.approved===true&&(refData.planType==="monthly"||refData.planType==="trial")){
        const base=refData.expiresAt&&new Date(refData.expiresAt).getTime()>Date.now()?new Date(refData.expiresAt):new Date();
        base.setDate(base.getDate()+15);
        await setDoc(refDocRef,{expiresAt:base.toISOString()},{merge:true});
      }
    }catch(e){console.error(e);}
  }

  async function setApproval(u,val,planType){
    if(!window._fb)return;
    setBusyId(u.uid);
    try{
      const {setDoc}=window._fb;
      if(val){
        const now=new Date();
        const payload={approved:true,planType,approvedAt:now.toISOString()};
        if(planType==="monthly"){
          const exp=new Date(now);exp.setDate(exp.getDate()+30);
          payload.expiresAt=exp.toISOString();
        }else if(planType==="trial"){
          const exp=new Date(now);exp.setDate(exp.getDate()+5);
          payload.expiresAt=exp.toISOString();
        }else{
          payload.expiresAt=null;
        }
        await setDoc(u.ref,payload,{merge:true});
        if((planType==="onetime"||planType==="monthly")&&u.referredBy&&!u.referralRewarded){
          await rewardReferrer(u.referredBy,planType,u.uid);
          await setDoc(u.ref,{referralRewarded:true},{merge:true});
        }
      }else{
        await setDoc(u.ref,{approved:false,planType:null,expiresAt:null},{merge:true});
      }
    }catch(e){console.error(e);}
    setBusyId(null);
  }

  // Monthly plans auto-expire after 30 days, trials after 5 — both treated
  // as not-approved automatically, no admin action needed.
  function isActive(u){
    if(u.approved!==true)return false;
    if((u.planType==="monthly"||u.planType==="trial")&&u.expiresAt&&new Date(u.expiresAt).getTime()<Date.now())return false;
    return true;
  }

  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)",padding:16};
  const all=users||[];
  const ql=q.trim().toLowerCase();
  const filtered=ql?all.filter(u=>(u.name||"").toLowerCase().includes(ql)||(u.email||"").toLowerCase().includes(ql)):all;
  const pending=filtered.filter(u=>!isActive(u));
  const oneTimeList=filtered.filter(u=>isActive(u)&&u.planType==="onetime");
  const monthlyList=filtered.filter(u=>isActive(u)&&u.planType==="monthly");
  const trialList=filtered.filter(u=>isActive(u)&&u.planType==="trial");

  function badge(label,color){
    return(<span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,border:`1px solid ${color}66`,color,background:color+"18",whiteSpace:"nowrap"}}>{label}</span>);
  }

  function daysLeft(u){
    if(!u.expiresAt)return null;
    const ms=new Date(u.expiresAt).getTime()-Date.now();
    return Math.max(0,Math.ceil(ms/(1000*60*60*24)));
  }

  function sectionTable(title,list,color,isPendingSection,showExpiry){
    if(list.length===0)return null;
    return(
      <div style={{marginBottom:18}}>
        <div style={{padding:"14px 22px 8px",fontSize:12,fontWeight:800,color,textTransform:"uppercase",letterSpacing:"0.05em"}}>{title} ({list.length})</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <tbody>
              {list.map(u=>{
                const isAdminAcc=isAdminEmail(u.email);
                const dl=showExpiry?daysLeft(u):null;
                return(
                  <tr key={u.uid}>
                    <td style={{padding:"11px 22px",borderBottom:`1px solid ${D.border2}`,minWidth:200}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={{width:30,height:30,borderRadius:"50%",background:D.statBg,border:`1px solid ${D.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:D.text2,flexShrink:0}}>{(u.name||u.email||"?").charAt(0).toUpperCase()}</div>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:700,color:D.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.name||"(no name)"}</div>
                          <div style={{fontSize:11,color:D.text3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.email}{u.phone?" · "+u.phone:""}</div>
                        </div>
                      </div>
                    </td>
                    <td style={{padding:"11px 22px",borderBottom:`1px solid ${D.border2}`,fontSize:12,color:D.text2,whiteSpace:"nowrap"}}>{u.createdAt?new Date(u.createdAt).toLocaleDateString():"—"}</td>
                    <td style={{padding:"11px 22px",borderBottom:`1px solid ${D.border2}`}}>
                      {isAdminAcc?badge("Admin","#D97706"):isPendingSection?badge("Pending","#D97706"):showExpiry?(dl!==null&&dl<=5?badge(dl+"d left","#D97706"):badge("Active","#1D9E75")):badge("Approved","#1D9E75")}
                    </td>
                    <td style={{padding:"11px 22px",borderBottom:`1px solid ${D.border2}`,textAlign:"right"}}>
                      {!isAdminAcc&&(
                        <div style={{display:"flex",gap:6,justifyContent:"flex-end",flexWrap:"wrap"}}>
                          {isPendingSection?(
                            <>
                              <button onClick={()=>setApproval(u,true,"onetime")} disabled={busyId===u.uid} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#1D9E75",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"Approve One-Time"}</button>
                              <button onClick={()=>setApproval(u,true,"monthly")} disabled={busyId===u.uid} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#2563EB",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"Approve Monthly"}</button>
                              <button onClick={()=>setApproval(u,true,"trial")} disabled={busyId===u.uid} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#8B5CF6",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"5-Day Trial"}</button>
                            </>
                          ):(
                            <button onClick={()=>setApproval(u,false,null)} disabled={busyId===u.uid} style={{padding:"6px 13px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:"#993c1d",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"Revoke"}</button>
                          )}
                          {u.approved===true&&u.planType==="onetime"?(
                            <button disabled title="One-Time access can't be deleted — revoke first if needed" style={{padding:"6px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text3,fontSize:11,fontWeight:700,cursor:"not-allowed",whiteSpace:"nowrap",opacity:0.45}}>🔒</button>
                          ):confirmDeleteUid===u.uid?(
                            <>
                              <span style={{fontSize:11,color:D.text2,fontWeight:600,whiteSpace:"nowrap"}}>Delete?</span>
                              <button onClick={()=>deleteUserProfile(u)} disabled={busyId===u.uid} style={{padding:"6px 11px",border:"none",borderRadius:7,background:"#E24B4A",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{busyId===u.uid?"...":"Yes"}</button>
                              <button onClick={()=>setConfirmDeleteUid(null)} style={{padding:"6px 11px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>No</button>
                            </>
                          ):(
                            <button onClick={()=>setConfirmDeleteUid(u.uid)} title="Delete this account's profile" style={{padding:"6px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text3,fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>🗑️</button>
                          )}
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,borderRadius:16,padding:0,width:"100%",maxWidth:880,maxHeight:"88vh",border:`1px solid ${D.border}`,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",boxSizing:"border-box",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 22px",borderBottom:`1px solid ${D.border2}`,flexShrink:0}}>
          <div>
            <div style={{fontSize:17,fontWeight:800,color:D.text,display:"flex",alignItems:"center",gap:9}}><Icon name="shield" size={19}/> Admin Panel</div>
            {users!==null&&<div style={{fontSize:11,color:D.text3,marginTop:2}}>{pending.length} pending · {oneTimeList.length} one-time · {monthlyList.length} monthly · {trialList.length} on trial</div>}
          </div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>
        </div>
        <div style={{display:"flex",gap:8,padding:"12px 22px 0",flexShrink:0}}>
          {[{id:"pending",l:"Pending Approval"},{id:"add",l:"Add User"},{id:"message",l:"Message User"},{id:"payouts",l:"Payout Requests"},{id:"homepage",l:"Homepage Content"}].map(t=>(
            <button key={t.id} onClick={()=>setAdminTab(t.id)} style={{padding:"9px 16px",borderRadius:"9px 9px 0 0",fontSize:13,fontWeight:700,cursor:"pointer",border:"none",borderBottom:adminTab===t.id?"2px solid #2563EB":"2px solid transparent",background:"transparent",color:adminTab===t.id?D.text:D.text3}}>{t.l}</button>
          ))}
        </div>
        {adminTab==="pending"&&(<>
        {users!==null&&users.length>0&&(
          <div style={{padding:"12px 22px",borderBottom:`1px solid ${D.border2}`,flexShrink:0}}>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search by name or email..." style={{width:"100%",padding:"9px 13px",borderRadius:9,border:`1px solid ${D.border}`,background:D.statBg,color:D.text,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
          </div>
        )}
        <div style={{overflowY:"auto",flex:1}}>
          {err&&(<div style={{margin:"16px 22px",padding:"12px 16px",borderRadius:9,background:dark?"#2a0a0a":"#fdeeee",color:"#993c1d",fontSize:12,fontWeight:600}}>{err}</div>)}
          {users===null&&!err&&(<div style={{textAlign:"center",padding:"40px 0",color:D.text3,fontSize:13}}>Loading users...</div>)}
          {users!==null&&!err&&(
            (pending.length+oneTimeList.length+monthlyList.length+trialList.length)===0?(<div style={{textAlign:"center",padding:"40px 0",color:D.text3,fontSize:13}}>{q?"No users match your search.":"No users yet."}</div>):(
              <React.Fragment>
                {sectionTable("Pending Approval",pending,"#D97706",true,false)}
                {sectionTable("One-Time Access",oneTimeList,"#1D9E75",false,false)}
                {sectionTable("Monthly Subscribers",monthlyList,"#2563EB",false,true)}
                {sectionTable("5-Day Trial Users",trialList,"#8B5CF6",false,true)}
              </React.Fragment>
            )
          )}
        </div>
        </>)}
        {adminTab==="add"&&(<AddUserTab D={D} dark={dark} onAdd={addNewUser}/>)}
        {adminTab==="message"&&(<MessageUserTab D={D} dark={dark} users={users||[]}/>)}
        {adminTab==="payouts"&&(<PayoutRequestsTab D={D} dark={dark}/>)}
        {adminTab==="homepage"&&(<HomepageContentTab D={D} dark={dark}/>)}
      </div>
    </div>
  );
}

// ── ADD USER TAB (admin creates a real login, stays Pending until paid) ──
function AddUserTab({D,dark,onAdd}){
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [phone,setPhone]=useState("");
  const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);

  async function submit(){
    setMsg(null);
    if(!email.trim()||!password){setMsg({ok:false,msg:"Email and password are required."});return;}
    if(password.length<6){setMsg({ok:false,msg:"Password must be at least 6 characters."});return;}
    setBusy(true);
    const r=await onAdd({name:name.trim(),email:email.trim(),phone:phone.trim(),password});
    setMsg(r);
    setBusy(false);
    if(r.ok){setName("");setEmail("");setPhone("");setPassword("");}
  }

  const inputStyle={width:"100%",padding:"11px 13px",borderRadius:9,border:`1px solid ${D.border}`,background:D.statBg,color:D.text,fontSize:13,outline:"none",boxSizing:"border-box"};
  const labelStyle={fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6,display:"block"};

  return(
    <div style={{padding:"20px 22px",overflowY:"auto",flex:1}}>
      <div style={{fontSize:12,color:D.text3,marginBottom:18,lineHeight:1.5}}>Create a login for someone manually — useful if you're onboarding them directly (e.g. over WhatsApp). Their account is created <b style={{color:D.text}}>Pending</b> — approve it after they've paid, same as a normal signup.</div>
      <div style={{display:"flex",flexDirection:"column",gap:14,maxWidth:420}}>
        <div>
          <label style={labelStyle}>Name</label>
          <input style={inputStyle} value={name} onChange={e=>setName(e.target.value)} placeholder="Full name"/>
        </div>
        <div>
          <label style={labelStyle}>Email</label>
          <input style={inputStyle} type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="user@email.com"/>
        </div>
        <div>
          <label style={labelStyle}>Phone (optional)</label>
          <input style={inputStyle} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+234..."/>
        </div>
        <div>
          <label style={labelStyle}>Temporary Password</label>
          <input style={inputStyle} type="text" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 6 characters"/>
        </div>
        {msg&&(<div style={{padding:"10px 13px",borderRadius:9,fontSize:12,fontWeight:600,background:msg.ok?(dark?"#0a2a1a":"#f0faf5"):(dark?"#2a0a0a":"#fdeeee"),color:msg.ok?"#1D9E75":"#993c1d"}}>{msg.msg}</div>)}
        <button onClick={submit} disabled={busy} style={{padding:"12px",border:"none",borderRadius:9,background:"#2563EB",color:"#fff",fontSize:14,fontWeight:700,cursor:busy?"not-allowed":"pointer",opacity:busy?0.6:1}}>{busy?"Creating...":"Create Account"}</button>
      </div>
    </div>
  );
}

// ── MESSAGE USER TAB (open WhatsApp or Email, pre-filled) ────────────────
function MessageUserTab({D,dark,users}){
  const [q,setQ]=useState("");
  const [selUid,setSelUid]=useState(null);
  const [text,setText]=useState("Hi! Just checking in about your EdgebookJournal access — let me know if you have any questions.");

  const ql=q.trim().toLowerCase();
  const filtered=ql?users.filter(u=>(u.name||"").toLowerCase().includes(ql)||(u.email||"").toLowerCase().includes(ql)):users;
  const sel=users.find(u=>u.uid===selUid)||null;

  function openWhatsapp(){
    if(!sel)return;
    const phone=(sel.phone||"").replace(/[^\d+]/g,"");
    if(!phone){alert("This user has no phone number on file.");return;}

// ── PAYOUT REQUESTS TAB (admin views & marks referral withdrawals as paid) ──
function PayoutRequestsTab({D,dark}){
  const [requests,setRequests]=useState(null);
  const [err,setErr]=useState(null);
  const [busyId,setBusyId]=useState(null);
  const [filter,setFilter]=useState("pending"); // pending | paid | all

  useEffect(()=>{
    if(!window._fb){setErr("Firebase not ready.");return;}
    const {db,collectionGroup,onSnapshot}=window._fb;
    const unsub=onSnapshot(collectionGroup(db,"referralWithdrawals"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,ref:d.ref,...d.data()}));
      list.sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""));
      setRequests(list);
      setErr(null);
    },e=>{console.error(e);setErr("Couldn't load payout requests. Make sure your Firestore rules allow admin access to referralWithdrawals.");});
    return()=>unsub();
  },[]);

  async function markPaid(r){
    if(!window._fb)return;
    setBusyId(r.id);
    try{
      const {setDoc}=window._fb;
      await setDoc(r.ref,{status:"paid",paidAt:new Date().toISOString()},{merge:true});
    }catch(e){console.error(e);alert("Couldn't update this request. Check your Firestore rules.");}
    setBusyId(null);
  }

  const filtered=requests?requests.filter(r=>filter==="all"?true:r.status===filter):null;

  function payoutDetails(r){
    const p=r.payout;
    if(!p)return"—";
    if(p.type==="bank")return`🏦 ${p.bankName||"Bank"} (${p.country==="us"?"US":p.country==="nigeria"?"Nigeria":"Other"}) — ${p.acctName||""} — ${p.acctNumber||""}`;
    if(p.type==="usdt")return`₮ USDT (${p.network==="tron"?"TRC20":p.network==="erc20"?"ERC20":"BEP20"}) — ${p.address||""}`;
    return"—";
  }

  return(
    <div style={{padding:"20px 22px",overflowY:"auto",flex:1}}>
      <div style={{fontSize:12,color:D.text3,marginBottom:16,lineHeight:1.5}}>Referral 5% revenue-share withdrawal requests. Pay the person directly using the details shown, then mark it Paid.</div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[{id:"pending",l:"Pending"},{id:"paid",l:"Paid"},{id:"all",l:"All"}].map(f=>(
          <button key={f.id} onClick={()=>setFilter(f.id)} style={{padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",border:`1.5px solid ${filter===f.id?"#2563EB":D.border}`,background:filter===f.id?"#2563EB18":"transparent",color:filter===f.id?"#2563EB":D.text2}}>{f.l}</button>
        ))}
      </div>
      {err&&(<div style={{padding:"12px 16px",borderRadius:9,background:dark?"#2a0a0a":"#fdeeee",color:"#993c1d",fontSize:12,fontWeight:600,marginBottom:16}}>{err}</div>)}
      {requests===null&&!err&&(<div style={{textAlign:"center",padding:"40px 0",color:D.text3,fontSize:13}}>Loading requests...</div>)}
      {filtered&&filtered.length===0&&(<div style={{textAlign:"center",padding:"40px 0",color:D.text3,fontSize:13}}>No {filter!=="all"?filter:""} requests.</div>)}
      {filtered&&filtered.map(r=>(
        <div key={r.id} style={{padding:"14px 16px",borderRadius:11,background:D.statBg,border:`1px solid ${D.statBorder}`,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:8,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:14,fontWeight:800,color:D.text}}>${parseFloat(r.amount).toFixed(2)} <span style={{fontSize:11,fontWeight:600,color:D.text3}}>· {r.requesterName||r.requesterEmail}</span></div>
              <div style={{fontSize:11,color:D.text3,marginTop:2}}>{r.requesterEmail} · {r.requestedAt&&new Date(r.requestedAt).toLocaleString()}</div>
            </div>
            <span style={{fontSize:10,fontWeight:800,color:"#fff",background:r.status==="paid"?"#1D9E75":"#D97706",padding:"4px 10px",borderRadius:20,whiteSpace:"nowrap"}}>{r.status==="paid"?"Paid":"Pending"}</span>
          </div>
          <div style={{fontSize:12.5,color:D.text2,padding:"9px 11px",background:D.card,border:`1px solid ${D.border}`,borderRadius:8,marginBottom:r.status==="paid"?0:10,wordBreak:"break-all"}}>{payoutDetails(r)}</div>
          {r.status!=="paid"&&(
            <button onClick={()=>markPaid(r)} disabled={busyId===r.id} style={{padding:"8px 16px",border:"none",borderRadius:8,background:"#1D9E75",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>{busyId===r.id?"...":"✓ Mark as Paid"}</button>
          )}
        </div>
      ))}
    </div>
  );
}

// ── HOMEPAGE CONTENT TAB (admin edits the public landing page) ──────────
function HomepageContentTab({D,dark}){
  const [vals,setVals]=useState(DEFAULT_LANDING);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState(null);
  const [uploadingKey,setUploadingKey]=useState(null);
  const [uploadErr,setUploadErr]=useState({});
  const [confirmReset,setConfirmReset]=useState(false);

  useEffect(()=>{
    if(!window._fb)return;
    const {db,doc,getDoc}=window._fb;
    getDoc(doc(db,"siteContent","landing")).then(snap=>{
      if(snap.exists())setVals(prev=>({...prev,...snap.data()}));
      setLoading(false);
    }).catch(e=>{console.error(e);setLoading(false);});
  },[]);

  function set(key,val){setVals(v=>({...v,[key]:val}));}

  // Resizes the chosen photo in the browser and saves it as Base64 directly
  // inside the Firestore document — no Firebase Storage (and no billing
  // upgrade) needed. Images are capped at 900px wide and compressed so the
  // result comfortably fits under Firestore's 1MB-per-document limit.
  function resizeAndEncode(file,maxWidth=900,quality=0.75){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=()=>{
        URL.revokeObjectURL(url);
        const scale=Math.min(1,maxWidth/img.width);
        const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Couldn't read this image."));};
      img.src=url;
    });
  }

  async function uploadImage(key,file){
    if(!file)return;
    if(!file.type.startsWith("image/")){setUploadErr(e=>({...e,[key]:"Please choose an image file."}));return;}
    if(file.size>15*1024*1024){setUploadErr(e=>({...e,[key]:"Image is too large — please choose a smaller photo (under 15MB)."}));return;}
    setUploadErr(e=>({...e,[key]:null}));
    setUploadingKey(key);
    try{
      let dataUrl=await resizeAndEncode(file,900,0.75);
      // If it's still too big for one Firestore field, compress harder.
      if(dataUrl.length>700000)dataUrl=await resizeAndEncode(file,700,0.6);
      if(dataUrl.length>700000)dataUrl=await resizeAndEncode(file,500,0.5);
      if(dataUrl.length>700000){setUploadErr(e=>({...e,[key]:"This image is hard to compress enough — try a simpler photo or a smaller one."}));setUploadingKey(null);return;}
      set(key,dataUrl);
    }catch(e){console.error(e);setUploadErr(er=>({...er,[key]:"Couldn't process this image. Try a different file."}));}
    setUploadingKey(null);
  }

  async function save(){
    if(!window._fb)return;
    setSaving(true);setMsg(null);
    try{
      const {db,doc,setDoc}=window._fb;
      await setDoc(doc(db,"siteContent","landing"),vals,{merge:true});
      setMsg({ok:true,msg:"Saved! Changes are live on the homepage immediately."});
    }catch(e){console.error(e);setMsg({ok:false,msg:"Couldn't save. Check your Firestore rules allow admin write to siteContent."});}
    setSaving(false);
  }

  function resetToDefault(){
    setVals(DEFAULT_LANDING);
    setConfirmReset(false);
  }

  const inp=(extra={})=>({width:"100%",fontSize:13,padding:"10px 12px",border:`1px solid ${D.border}`,borderRadius:8,background:D.statBg,color:D.text,outline:"none",boxSizing:"border-box",fontFamily:"inherit",...extra});
  const ta=(extra={})=>inp({resize:"vertical",lineHeight:1.5,...extra});
  const lbl={fontSize:11,color:D.text3,fontWeight:700,marginBottom:5,display:"block",textTransform:"uppercase",letterSpacing:"0.05em"};
  const section={fontSize:13,fontWeight:800,color:D.text,marginBottom:14,marginTop:26,paddingBottom:8,borderBottom:`1px solid ${D.border2}`};
  const field=(label,key,multiline)=>(
    <div style={{marginBottom:14}}>
      <label style={lbl}>{label}</label>
      {multiline?(
        <textarea style={ta({minHeight:70})} value={vals[key]||""} onChange={e=>set(key,e.target.value)}/>
      ):(
        <input style={inp()} value={vals[key]||""} onChange={e=>set(key,e.target.value)}/>
      )}
    </div>
  );

  const imageField=(label,key)=>{
    const inputId=`img-upload-${key}`;
    const isUploading=uploadingKey===key;
    return(
      <div style={{marginBottom:20}}>
        <label style={lbl}>{label}</label>
        {vals[key]&&(
          <div style={{marginBottom:10,position:"relative",display:"inline-block"}}>
            <img src={vals[key]} alt="" style={{maxWidth:260,maxHeight:140,borderRadius:9,border:`1px solid ${D.border}`,display:"block"}}/>
            <button onClick={()=>set(key,"")} title="Remove image" style={{position:"absolute",top:6,right:6,width:24,height:24,borderRadius:"50%",border:"none",background:"rgba(0,0,0,0.65)",color:"#fff",fontSize:12,cursor:"pointer"}}>✕</button>
          </div>
        )}
        {!vals[key]&&(<div style={{marginBottom:10,padding:"16px",borderRadius:9,border:`1px dashed ${D.border}`,background:D.statBg,fontSize:12,color:D.text3,textAlign:"center"}}>No image set — using the built-in mockup</div>)}
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <input id={inputId} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)uploadImage(key,f);e.target.value="";}}/>
          <label htmlFor={inputId} style={{padding:"9px 16px",border:`1px solid ${D.border}`,borderRadius:8,background:isUploading?D.statBg:"transparent",color:D.text2,fontSize:12,fontWeight:700,cursor:isUploading?"not-allowed":"pointer",opacity:isUploading?0.6:1}}>{isUploading?"Uploading...":vals[key]?"Replace Image":"Upload Image"}</label>
          {vals[key]&&!isUploading&&(<span style={{fontSize:11,color:D.text3}}>or remove to use the built-in mockup</span>)}
        </div>
        {uploadErr[key]&&(<div style={{fontSize:11,color:"#993c1d",marginTop:8}}>{uploadErr[key]}</div>)}
      </div>
    );
  };

  if(loading)return(<div style={{padding:"40px 22px",textAlign:"center",color:D.text3,fontSize:13}}>Loading homepage content...</div>);

  return(
    <div style={{padding:"20px 22px",overflowY:"auto",flex:1}}>
      <div style={{fontSize:12,color:D.text3,marginBottom:16,lineHeight:1.5}}>Edit the text and images shown on the public homepage (the first thing visitors see before logging in). Changes apply immediately after saving.</div>

      <div style={section}>Hero Section</div>
      {field("Eyebrow label","heroEyebrow")}
      {field("Headline (use a line break for two lines)","heroHeadline",true)}
      {field("Subtext","heroSubtext",true)}
      {field("Text next to the CTA button","heroCtaSub")}
      {imageField("Hero image","heroImageUrl")}

      <div style={section}>"How It Works" Section</div>
      {field("Section headline","worksHeadline")}
      {field("Section subtext","worksSubtext",true)}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14}}>
        <div>{field("Feature 1 title","feature1Title")}{field("Feature 1 text","feature1Text",true)}</div>
        <div>{field("Feature 2 title","feature2Title")}{field("Feature 2 text","feature2Text",true)}</div>
        <div>{field("Feature 3 title","feature3Title")}{field("Feature 3 text","feature3Text",true)}</div>
        <div>{field("Feature 4 title","feature4Title")}{field("Feature 4 text","feature4Text",true)}</div>
      </div>

      <div style={section}>Second Section</div>
      {field("Headline","section2Headline")}
      {field("Text","section2Text",true)}
      {imageField("Section image","section2ImageUrl")}

      <div style={section}>FAQs</div>
      {[1,2,3,4,5].map(n=>(
        <div key={n} style={{marginBottom:14,padding:"12px 14px",background:D.statBg,border:`1px solid ${D.statBorder}`,borderRadius:10}}>
          {field(`Question ${n}`,`faq${n}Q`)}
          {field(`Answer ${n}`,`faq${n}A`,true)}
        </div>
      ))}

      {msg&&(<div style={{margin:"14px 0",padding:"11px 14px",borderRadius:9,fontSize:12,fontWeight:600,background:msg.ok?(dark?"#0a2a1a":"#eafaf1"):(dark?"#2a0a0a":"#fdeeee"),color:msg.ok?"#0f6e56":"#993c1d"}}>{msg.msg}</div>)}

      <div style={{display:"flex",gap:10,marginTop:10,marginBottom:30,alignItems:"center",flexWrap:"wrap"}}>
        <button onClick={save} disabled={saving} style={{padding:"12px 24px",border:"none",borderRadius:9,background:"#2563EB",color:"#fff",fontSize:14,fontWeight:700,cursor:saving?"not-allowed":"pointer",opacity:saving?0.6:1}}>{saving?"Saving...":"Save Changes"}</button>
        {!confirmReset?(
          <button onClick={()=>setConfirmReset(true)} style={{padding:"12px 20px",border:`1px solid ${D.border}`,borderRadius:9,background:"transparent",color:D.text2,fontSize:13,fontWeight:700,cursor:"pointer"}}>Reset to Default</button>
        ):(
          <>
            <span style={{fontSize:12,color:D.text2,fontWeight:600}}>Reset everything to default?</span>
            <button onClick={resetToDefault} style={{padding:"10px 16px",border:"none",borderRadius:8,background:"#E24B4A",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>Yes, Reset</button>
            <button onClick={()=>setConfirmReset(false)} style={{padding:"10px 16px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,fontWeight:700,cursor:"pointer"}}>No, Cancel</button>
          </>
        )}
      </div>
    </div>
  );
}

// ── FRIENDLY FIREBASE AUTH ERROR MESSAGES ───────────────────────────
function authErrMsg(e){
  const code=(e&&e.code)||"";
  if(code.includes("email-already-in-use"))return"This email is already registered. Try signing in instead.";
  if(code.includes("invalid-email"))return"Please enter a valid email address.";
  if(code.includes("weak-password"))return"Password is too weak. Use at least 6 characters.";
  if(code.includes("wrong-password")||code.includes("invalid-credential"))return"Incorrect email or password.";
  if(code.includes("user-not-found"))return"No account found with this email.";
  if(code.includes("too-many-requests"))return"Too many attempts. Please wait a moment and try again.";
  if(code.includes("popup-closed-by-user"))return"Sign-in popup was closed before completing.";
  if(code.includes("network-request-failed"))return"Network error. Check your connection and try again.";
  return"Something went wrong. Please try again.";
}

// ── ALL TRADES VIEW (search/filter across every week) ────────────────────
function AllTradesView({D,dark,trades,onJumpToWeek,onDelete}){
  const [q,setQ]=useState("");
  const [resultFilter,setResultFilter]=useState("all"); // all | win | loss | open
  const [setupFilter,setSetupFilter]=useState("all");
  const [confirmDeleteKey,setConfirmDeleteKey]=useState(null);

  const setups=Array.from(new Set(trades.map(t=>t.setup).filter(Boolean))).sort();

  const ql=q.trim().toLowerCase();
  const filtered=trades.filter(t=>{
    if(resultFilter!=="all"&&t.result!==resultFilter)return false;
    if(setupFilter!=="all"&&t.setup!==setupFilter)return false;
    if(ql&&!(`${t.pair||""} ${t.note||""} ${t.noteBefore||""} ${t.noteAfter||""} ${t.setup||""}`.toLowerCase().includes(ql)))return false;
    return true;
  }).sort((a,b)=>(b._wk||"").localeCompare(a._wk||""));

  const totalPnl=filtered.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const wins=filtered.filter(t=>t.result==="win").length;
  const losses=filtered.filter(t=>t.result==="loss").length;
  const closed=wins+losses;
  const winRate=closed>0?Math.round((wins/closed)*100):0;

  const inp=(extra={})=>({padding:"9px 12px",borderRadius:8,border:`1px solid ${D.border}`,background:D.statBg,color:D.text,fontSize:12,outline:"none",boxSizing:"border-box",fontFamily:"inherit",...extra});
  const badge=(label,color)=>(<span style={{display:"inline-flex",alignItems:"center",padding:"2px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,color,background:color+"18",border:`1px solid ${color}55`,whiteSpace:"nowrap"}}>{label}</span>);

  function exportCsv(){
    const headers=["Date (week of)","Pair","Direction","Result","R:R","Risk","P&L","Setup","What I Saw","Why Won/Lost"];
    const rows=filtered.map(t=>[t._wk||"",t.pair||"",t.direction||"",t.result||"",t.rr||"",t.risk||"",t.pnl||"",t.setup||"",`"${(t.noteBefore||t.note||"").replace(/"/g,'""')}"`,`"${(t.noteAfter||"").replace(/"/g,'""')}"`]);
    const csv=[headers.join(","),...rows.map(r=>r.join(","))].join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`trades-export-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div style={{fontSize:15,fontWeight:700,color:D.text}}>🔍 All Trades</div>
        <button onClick={exportCsv} disabled={filtered.length===0} style={{padding:"8px 16px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,fontWeight:700,cursor:filtered.length===0?"not-allowed":"pointer",opacity:filtered.length===0?0.5:1}}>⬇ Export CSV</button>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search pair, setup, or notes..." style={inp({flex:1,minWidth:180})}/>
        <select value={resultFilter} onChange={e=>setResultFilter(e.target.value)} style={inp({minWidth:110})}>
          <option value="all">All results</option>
          <option value="win">Wins</option>
          <option value="loss">Losses</option>
          <option value="open">Open</option>
        </select>
        {setups.length>0&&(
          <select value={setupFilter} onChange={e=>setSetupFilter(e.target.value)} style={inp({minWidth:110})}>
            <option value="all">All setups</option>
            {setups.map(s=>(<option key={s} value={s}>{s}</option>))}
          </select>
        )}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8,marginBottom:18}}>
        <div style={{padding:"11px",borderRadius:9,background:D.statBg,border:`1px solid ${D.statBorder}`,textAlign:"center"}}><div style={{fontSize:9,color:D.text3,textTransform:"uppercase",marginBottom:3}}>Trades</div><div style={{fontSize:16,fontWeight:800,color:D.text}}>{filtered.length}</div></div>
        <div style={{padding:"11px",borderRadius:9,background:D.statBg,border:`1px solid ${D.statBorder}`,textAlign:"center"}}><div style={{fontSize:9,color:D.text3,textTransform:"uppercase",marginBottom:3}}>Win Rate</div><div style={{fontSize:16,fontWeight:800,color:winRate>=50?"#1D9E75":"#E24B4A"}}>{closed>0?winRate+"%":"—"}</div></div>
        <div style={{padding:"11px",borderRadius:9,background:D.statBg,border:`1px solid ${D.statBorder}`,textAlign:"center"}}><div style={{fontSize:9,color:D.text3,textTransform:"uppercase",marginBottom:3}}>Total P&L</div><div style={{fontSize:16,fontWeight:800,color:totalPnl>=0?"#1D9E75":"#E24B4A"}}>{totalPnl>=0?"+":""}{totalPnl.toFixed(2)}</div></div>
      </div>

      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"3rem 1rem",color:D.text3,fontSize:13,border:`1px dashed ${D.border}`,borderRadius:12,background:D.card}}>No trades match your filters.</div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {filtered.map((t,i)=>{
            const key=t._wk+"-"+t._idx;
            const confirming=confirmDeleteKey===key;
            return(
            <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"12px 14px",borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",flex:1,minWidth:200}}>
                <span style={{fontSize:13,fontWeight:800,color:D.text}}>{t.pair||"—"}</span>
                {t.setup&&badge(t.setup,"#2563EB")}
                {t.direction&&badge(t.direction.toUpperCase(),"#888")}
                {badge(t.result==="win"?"Win":t.result==="loss"?"Loss":"Open",t.result==="win"?"#1D9E75":t.result==="loss"?"#E24B4A":"#D97706")}
                <span style={{fontSize:11,color:D.text3}}>{t._wk}</span>
              </div>
              {!confirming?(
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <span style={{fontSize:13,fontWeight:800,color:parseFloat(t.pnl)>=0?"#1D9E75":"#E24B4A"}}>{t.pnl?(parseFloat(t.pnl)>=0?"+":"")+"$"+parseFloat(t.pnl).toFixed(2):"—"}</span>
                  <button onClick={()=>onJumpToWeek(t._wk)} title="Open this week" style={{border:"none",background:"transparent",color:D.text3,fontSize:13,cursor:"pointer"}}>↗</button>
                  <button onClick={()=>setConfirmDeleteKey(key)} title="Delete this trade" style={{border:"none",background:"transparent",color:D.text3,fontSize:13,cursor:"pointer"}}>🗑️</button>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:11.5,color:D.text2,fontWeight:600}}>Delete?</span>
                  <button onClick={()=>{onDelete(t._wk,t._idx);setConfirmDeleteKey(null);}} style={{padding:"5px 12px",border:"none",borderRadius:7,background:"#E24B4A",color:"#fff",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>Yes</button>
                  <button onClick={()=>setConfirmDeleteKey(null)} style={{padding:"5px 12px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:11.5,cursor:"pointer"}}>No</button>
                </div>
              )}
            </div>
          );})}
        </div>
      )}
    </div>
  );
}


function App(){
  const [fbReady,setFbReady]=useState(!!window._fb);
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(false);
  const [authError,setAuthError]=useState("");
  const [emailVerified,setEmailVerified]=useState(true);
  const [approved,setApproved]=useState(true);
  const [trialEligible,setTrialEligible]=useState(false);
  const [isAdmin,setIsAdmin]=useState(false);
  const [dataLoading,setDataLoading]=useState(false);
  const [store,setStoreRaw]=useState(emptyStore());
  const saveTimeout=useRef(null);
  const [publicView,setPublicView]=useState("landing"); // landing | login

  // Wait for Firebase
  useEffect(()=>{
    if(window._fb){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebase-ready",h);
    return()=>window.removeEventListener("firebase-ready",h);
  },[]);

  // Capture ?ref=UID from the URL (referral link) once, on first load,
  // and remember it for whenever this visitor signs up. Also logs a click
  // (once per browser session) so the referrer can see how many people
  // visited their link, even before anyone signs up.
  useEffect(()=>{
    try{
      const params=new URLSearchParams(window.location.search);
      const ref=params.get("ref");
      if(ref){
        sessionStorage.setItem("referredBy",ref);
        if(!sessionStorage.getItem("refClickLogged")&&window._fb){
          const {db,collection,addDoc}=window._fb;
          addDoc(collection(db,"referralClicks"),{referrerUid:ref,at:new Date().toISOString()}).catch(e=>console.error(e));
          sessionStorage.setItem("refClickLogged","1");
        }
      }
    }catch(e){}
  },[fbReady]);

  // Auth listener
  const loadedUidRef=useRef(null);
  useEffect(()=>{
    if(!fbReady||!window._fb)return;
    const {auth,onAuthStateChanged}=window._fb;
    return onAuthStateChanged(auth,async u=>{
      setUser(u);
      if(u){
        // Firebase re-fires this listener on auth refreshes that aren't a
        // new sign-in (e.g. linking a password to a Google account, token
        // refresh). Only reload journal data + show the full-screen loader
        // for an actual new sign-in, so those refreshes don't blank the
        // screen or close whatever modal is open.
        if(loadedUidRef.current===u.uid)return;
        loadedUidRef.current=u.uid;
        setDataLoading(true);
        const {db,doc,getDoc}=window._fb;
        const ref=doc(db,"users",u.uid,"data","journal");
        const snap=await getDoc(ref);
        if(snap.exists()){setStoreRaw(snap.data());}
        else{setStoreRaw(emptyStore());}
        setDataLoading(false);
      } else {
        loadedUidRef.current=null;
      }
    });
  },[fbReady]);

  // Save to Firestore with debounce
  function setStore(fn){
    setStoreRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      if(user&&window._fb){
        clearTimeout(saveTimeout.current);
        saveTimeout.current=setTimeout(()=>{
          const {db,doc,setDoc}=window._fb;
          setDoc(doc(db,"users",user.uid,"data","journal"),next).catch(console.error);
        },800);
      }
      return next;
    });
  }

  // Check email verification status (only applies to email/password accounts)
  // Using Firebase's built-in emailVerified flag (free, no extra service needed)
  useEffect(()=>{
    if(!user){setEmailVerified(true);return;}
    const hasPwd=(user.providerData||[]).some(p=>p.providerId==="password");
    if(!hasPwd){setEmailVerified(true);return;}
    setEmailVerified(!!user.emailVerified);
  },[user]);

  async function checkVerified(){
    if(!window._fb)return{ok:false,msg:"Not ready, please try again."};
    try{
      const {auth}=window._fb;
      await auth.currentUser.reload();
      if(auth.currentUser.emailVerified){
        setEmailVerified(true);
        setUser({...auth.currentUser});
        return{ok:true,msg:"Verified!"};
      }
      return{ok:false,msg:"Not verified yet — open the email and click the link, then try again."};
    }catch(e){console.error(e);return{ok:false,msg:"Something went wrong. Please try again."};}
  }

  async function resendVerificationCode(){
    if(!window._fb)return{ok:false,msg:"Not ready, please try again."};
    try{
      const {auth,sendEmailVerification}=window._fb;
      await sendEmailVerification(auth.currentUser,{url:window.location.origin});
      return{ok:true,msg:"Verification email sent! Check your inbox (and spam folder)."};
    }catch(e){console.error(e);return{ok:false,msg:authErrMsg(e)};}
  }

  // ── ACCESS APPROVAL: admins always get in; everyone else waits until
  // an admin approves their account in the Admin Panel. Live listener so
  // access unlocks instantly for the user once approved, no refresh needed.
  useEffect(()=>{
    if(!user){setApproved(true);setIsAdmin(false);return;}
    const admin=isAdminEmail(user.email);
    setIsAdmin(admin);
    if(admin){setApproved(true);return;}
    if(!window._fb)return;
    const {db,doc,onSnapshot}=window._fb;
    const unsub=onSnapshot(doc(db,"users",user.uid,"profile","main"),snap=>{
      const data=snap.exists()?snap.data():{};
      const active=data.approved===true&&!((data.planType==="monthly"||data.planType==="trial")&&data.expiresAt&&new Date(data.expiresAt).getTime()<Date.now());
      setApproved(active);
      // Self-serve trial only available if this account has never had any
      // plan before — stops someone re-triggering free trials repeatedly.
      setTrialEligible(!data.planType&&!data.approved);
    },err=>{console.error(err);});
    return()=>unsub();
  },[user]);

  // Lets a brand-new signup unlock a 5-day trial themselves, instantly, with
  // no admin approval needed. Only works once per account — blocked if this
  // account has ever had any plan set before (see trialEligible above).
  async function startSelfTrial(){
    if(!window._fb||!user||!trialEligible)return{ok:false,msg:"Trial isn't available for this account."};
    try{
      const {db,doc,setDoc}=window._fb;
      const now=new Date();
      const exp=new Date(now);exp.setDate(exp.getDate()+5);
      await setDoc(doc(db,"users",user.uid,"profile","main"),{approved:true,planType:"trial",approvedAt:now.toISOString(),expiresAt:exp.toISOString()},{merge:true});
      return{ok:true};
    }catch(e){console.error(e);return{ok:false,msg:"Couldn't start your trial. Check your connection and try again."};}
  }

  async function handleLogin(){
    if(!window._fb)return;
    setAuthError("");
    setAuthLoading(true);
    try{
      const {auth,provider,signInWithPopup,db,doc,getDoc,setDoc}=window._fb;
      const result=await signInWithPopup(auth,provider);
      const ref=doc(db,"users",result.user.uid,"profile","main");
      const snap=await getDoc(ref);
      if(!snap.exists()){
        let referredBy=null;
        try{referredBy=sessionStorage.getItem("referredBy")||null;}catch(e){}
        if(referredBy===result.user.uid)referredBy=null; // can't refer yourself
        await setDoc(ref,{name:result.user.displayName||"",email:result.user.email,phone:"",createdAt:new Date().toISOString(),approved:isAdminEmail(result.user.email),referredBy,referralRewarded:false});
      }
    }
    catch(e){console.error(e);setAuthError(authErrMsg(e));}
    setAuthLoading(false);
  }

  async function handleEmailLogin(email,password){
    if(!window._fb)return;
    setAuthError("");
    setAuthLoading(true);
    try{
      const {auth,signInWithEmailAndPassword}=window._fb;
      await signInWithEmailAndPassword(auth,email,password);
    }catch(e){console.error(e);setAuthError(authErrMsg(e));}
    setAuthLoading(false);
  }

  async function handleForgotPassword(email){
    if(!window._fb)return{ok:false,msg:"Not ready, please try again."};
    try{
      const {auth,sendPasswordResetEmail}=window._fb;
      await sendPasswordResetEmail(auth,email,{url:window.location.origin});
      return{ok:true,msg:"Reset link sent! Check your inbox (and spam folder)."};
    }catch(e){console.error(e);return{ok:false,msg:authErrMsg(e)};}
  }

  async function handleEmailSignup(name,email,phone,password){
    if(!window._fb)return;
    setAuthError("");
    setAuthLoading(true);
    try{
      const {auth,createUserWithEmailAndPassword,updateProfile,db,doc,setDoc,sendEmailVerification}=window._fb;
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(cred.user,{displayName:name});
      let referredBy=null;
      try{referredBy=sessionStorage.getItem("referredBy")||null;}catch(e){}
      if(referredBy===cred.user.uid)referredBy=null; // can't refer yourself
      await setDoc(doc(db,"users",cred.user.uid,"profile","main"),{name,email,phone,createdAt:new Date().toISOString(),approved:isAdminEmail(email),referredBy,referralRewarded:false});
      try{await sendEmailVerification(cred.user,{url:window.location.origin});}catch(emailErr){console.error("Verification email failed to send:",emailErr);}
      setEmailVerified(false);
    }catch(e){console.error(e);setAuthError(authErrMsg(e));}
    setAuthLoading(false);
  }

  async function handleLogout(){
    if(!window._fb)return;
    const {auth,signOut}=window._fb;
    await signOut(auth);
    setStoreRaw(emptyStore());
  }

  // Import from old localStorage
  function handleImport(){
    const OLD_KEYS=["tj_v10","tj_v11","tj_v12"];
    let found=null;
    for(const k of OLD_KEYS){try{const r=localStorage.getItem(k);if(r){found=JSON.parse(r);break;}}catch{}}
    if(found){setStore(found);alert("✅ Data imported successfully!");}
    else{alert("No old journal data found in this browser.");}
  }

  // Export backup
  function handleExport(){
    const blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`trading-journal-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  // Import from file
  function handleImportFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{const data=JSON.parse(ev.target.result);setStore(data);alert("✅ Backup imported successfully!");}catch{alert("❌ Invalid file. Please use a valid journal backup.");}};
    r.readAsText(file);
  }

  if(!fbReady||authLoading||dataLoading){
    return(
      <div style={{minHeight:"100vh",background:"#0d0d0d",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
        <div style={{fontSize:48}}>📊</div>
        <div style={{fontSize:16,color:"#888",fontFamily:"DM Sans,sans-serif"}}>{dataLoading?"Loading your data...":"Connecting..."}</div>
      </div>
    );
  }

  if(!user){
    if(publicView==="login"){
      return <LoginScreen onGoogleLogin={handleLogin} onEmailLogin={handleEmailLogin} onEmailSignup={handleEmailSignup} onForgotPassword={handleForgotPassword} loading={authLoading} authError={authError} onBack={()=>setPublicView("landing")}/>;
    }
    if(publicView==="terms"){return <LegalPage type="terms" onBack={()=>setPublicView("landing")}/>;}
    if(publicView==="privacy"){return <LegalPage type="privacy" onBack={()=>setPublicView("landing")}/>;}
    return <LandingPage onGetStarted={()=>setPublicView("login")} onShowTerms={()=>setPublicView("terms")} onShowPrivacy={()=>setPublicView("privacy")}/>;
  }

  if(!emailVerified){return <VerifyEmailScreen email={user.email} onCheck={checkVerified} onResend={resendVerificationCode} onSignOut={handleLogout}/>;}

  if(!approved){return <PendingApprovalScreen email={user.email} user={user} onSignOut={handleLogout} onStartTrial={startSelfTrial} trialEligible={trialEligible}/>;}

  // ── REST OF APP (same as before but uses setStore that saves to Firebase) ──
  return <Journal store={store} setStore={setStore} user={user} isAdmin={isAdmin} onLogout={handleLogout} onImport={handleImport} onExport={handleExport} onImportFile={handleImportFile}/>;
}

// ── PAYOUTS VIEW (request + admin approval) ───────────────────────
function PayoutsView({D,dark,user,isAdmin,accounts,allAccTrades,onWithdraw}){
  const [amount,setAmount]=useState("");
  const [accId,setAccId]=useState(accounts[0]?.id||"");
  const [submitting,setSubmitting]=useState(false);
  const [msg,setMsg]=useState(null);
  const [myHistory,setMyHistory]=useState(null);
  const [allHistory,setAllHistory]=useState(null);

  useEffect(()=>{
    if(!window._fb||!user)return;
    const {db,collection,onSnapshot}=window._fb;
    const unsub=onSnapshot(collection(db,"users",user.uid,"payouts"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()}));
      list.sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""));
      setMyHistory(list);
    },e=>console.error(e));
    return()=>unsub();
  },[user]);

  useEffect(()=>{
    if(!isAdmin||!window._fb)return;
    const {db,collectionGroup,onSnapshot}=window._fb;
    const unsub=onSnapshot(collectionGroup(db,"payouts"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,...d.data()}));
      list.sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""));
      setAllHistory(list);
    },e=>console.error(e));
    return()=>unsub();
  },[isAdmin]);

  const selectedAcc=accounts.find(a=>a.id===accId);
  const selectedAccPnl=selectedAcc?allAccTrades(selectedAcc.id).reduce((s,t)=>s+(parseFloat(t.pnl)||0),0):0;
  const availableBalance=selectedAcc?((parseFloat(selectedAcc.balance)||0)+selectedAccPnl):0;

  async function submit(){
    const amt=parseFloat(amount);
    if(!amt||amt<=0){setMsg({ok:false,msg:"Enter a valid amount."});return;}
    if(!selectedAcc){setMsg({ok:false,msg:"Select an account."});return;}
    if(amt>availableBalance){setMsg({ok:false,msg:`Insufficient balance. Available: $${availableBalance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`});return;}
    setSubmitting(true);setMsg(null);
    try{
      // Instant: just removes the amount from this account's displayed balance, no real payment is sent
      onWithdraw(accId,amt);
      if(window._fb){
        const {db,collection,addDoc}=window._fb;
        await addDoc(collection(db,"users",user.uid,"payouts"),{amount:amt,accountName:selectedAcc.name,requesterEmail:user.email,requesterName:user.displayName||"",requestedAt:new Date().toISOString()});
      }
      setAmount("");
      setMsg({ok:true,msg:`Removed $${amt.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} from ${selectedAcc.name}'s balance.`});
    }catch(e){console.error(e);setMsg({ok:false,msg:"Balance updated locally, but couldn't save history. Check your connection."});}
    setSubmitting(false);
  }

  const inp={width:"100%",fontSize:13,padding:"10px 12px",border:`1px solid ${D.inputBorder}`,borderRadius:9,background:D.inputBg,color:D.text,outline:"none",boxSizing:"border-box"};

  return(
    <div>
      <div style={{fontSize:18,fontWeight:800,color:D.text,marginBottom:18}}>💸 Remove From Balance</div>

      <div style={{background:D.card,border:`1px solid ${D.border}`,borderRadius:14,padding:"18px",marginBottom:24}}>
        <div style={{fontSize:13,fontWeight:700,color:D.text,marginBottom:4}}>Take Money Out</div>
        <div style={{fontSize:11,color:D.text3,marginBottom:14}}>This just removes the amount from the balance shown on your dashboard — no real transfer happens. Useful if you don't want certain profits showing on screen.</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:6}}>
          <div><div style={{fontSize:11,color:D.text3,marginBottom:5}}>Amount ($)</div><input style={inp} type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="e.g. 0.50"/></div>
          <div><div style={{fontSize:11,color:D.text3,marginBottom:5}}>Account</div><select style={inp} value={accId} onChange={e=>setAccId(e.target.value)}>{accounts.map(a=>(<option key={a.id} value={a.id}>{a.name}</option>))}</select></div>
        </div>
        {selectedAcc&&<div style={{fontSize:11,color:D.text3,marginBottom:14}}>Available balance: <span style={{fontWeight:700,color:D.text}}>${availableBalance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>}
        {msg&&(<div style={{marginBottom:12,padding:"9px 12px",borderRadius:8,fontSize:12,fontWeight:600,background:msg.ok?(dark?"#0a2a1a":"#eafaf1"):(dark?"#2a0a0a":"#fdeeee"),color:msg.ok?"#0f6e56":"#993c1d"}}>{msg.msg}</div>)}
        <button onClick={submit} disabled={submitting||accounts.length===0} style={{padding:"11px 22px",border:"none",borderRadius:9,background:D.navActive,color:D.navActiveTxt,fontSize:13,fontWeight:700,cursor:submitting?"not-allowed":"pointer",opacity:submitting?0.6:1}}>{submitting?"Processing...":"Remove Now"}</button>
      </div>

      <div style={{fontSize:12,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>My History</div>
      {myHistory===null&&<div style={{fontSize:12,color:D.text3,padding:"10px 0"}}>Loading...</div>}
      {myHistory!==null&&myHistory.length===0&&<div style={{fontSize:12,color:D.text3,padding:"10px 0",marginBottom:20}}>No withdrawals yet.</div>}
      {myHistory&&myHistory.map(r=>(
        <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",background:D.statBg,border:`1px solid ${D.statBorder}`,borderRadius:10,marginBottom:8,gap:10,flexWrap:"wrap"}}>
          <div><div style={{fontSize:13,fontWeight:700,color:D.text}}>${parseFloat(r.amount).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} — {r.accountName}</div><div style={{fontSize:11,color:D.text3}}>{r.requestedAt&&new Date(r.requestedAt).toLocaleDateString()}{r.note?" · "+r.note:""}</div></div>
          <span style={{fontSize:10,fontWeight:800,color:"#fff",background:"#1D9E75",padding:"3px 9px",borderRadius:20}}>Completed</span>
        </div>
      ))}

      {isAdmin&&(
        <div style={{marginTop:30}}>
          <div style={{fontSize:12,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>All Removals (Admin View)</div>
          {allHistory===null&&<div style={{fontSize:12,color:D.text3,padding:"10px 0"}}>Loading...</div>}
          {allHistory!==null&&allHistory.length===0&&<div style={{fontSize:12,color:D.text3,padding:"10px 0"}}>No removals from anyone yet.</div>}
          {allHistory&&allHistory.map(r=>(
            <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",background:D.card,border:`1px solid ${D.border}`,borderRadius:10,marginBottom:8,gap:10,flexWrap:"wrap"}}>
              <div><div style={{fontSize:13,fontWeight:700,color:D.text}}>${parseFloat(r.amount).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} — {r.accountName}</div><div style={{fontSize:11,color:D.text3}}>{r.requesterName||r.requesterEmail} · {r.requestedAt&&new Date(r.requestedAt).toLocaleDateString()}{r.note?" · "+r.note:""}</div></div>
              <span style={{fontSize:10,fontWeight:800,color:"#fff",background:"#1D9E75",padding:"3px 9px",borderRadius:20}}>Completed</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  // ── PROP FIRM CHALLENGE TRACKING ──────────────────────────────────
  // All figures are derived live from actual logged trades — nothing here
  // is stored/typed in manually, so it always reflects what really happened.
  function propStats(acc){
    if(!acc||acc.type!=="prop")return null;
    const startBal=parseFloat(acc.balance)||0;
    const accTrades=allAccTrades(acc.id);
    const cumPnl=accTrades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
    const todayStr=new Date().toISOString().slice(0,10);
    const todayPnl=accTrades.filter(t=>t.date===todayStr).reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);

    const maxDailyPct=parseFloat(acc.maxDailyLoss)||0;
    const maxOverallPct=parseFloat(acc.maxOverallLoss)||0;
    const maxDailyAmt=startBal*(maxDailyPct/100);
    const maxOverallAmt=startBal*(maxOverallPct/100);
    const dailyLossUsed=Math.max(0,-todayPnl);
    const overallLossUsed=Math.max(0,-cumPnl);
    // Shown as: how much you've actually lost, as a % of your account
    // balance (e.g. 1.07%), measured against the limit (e.g. 5%) — not
    // "% of your daily allowance used up", which read confusingly large
    // for small losses.
    const dailyLossPctUsed=startBal>0?(dailyLossUsed/startBal)*100:0;
    // Overall is shown as your real net result — positive when you're up
    // overall, negative when you're down — against the loss limit. Breach
    // detection below still only cares about actual losses, never gains.
    const overallNetPct=startBal>0?(cumPnl/startBal)*100:0;
    const overallLossPctUsed=startBal>0?(overallLossUsed/startBal)*100:0;
    const dailyBreached=maxDailyAmt>0&&dailyLossUsed>=maxDailyAmt;
    const overallBreached=maxOverallAmt>0&&overallLossUsed>=maxOverallAmt;

    const numPhases=acc.accountType==="Instant"?0:acc.accountType==="1-Step"?1:acc.accountType==="2-Step"?2:3;
    const targets=[parseFloat(acc.profitTarget1)||null,parseFloat(acc.profitTarget2)||null,parseFloat(acc.profitTarget3)||null];

    let phase="funded",phaseLabel="Funded",phaseTargetAmt=null,phaseProgressPct=null;
    if(acc.status==="fail"){
      phase="fail";phaseLabel="Failed";
    }else if(numPhases===0){
      phase="funded";phaseLabel="Funded";
    }else if(dailyBreached||overallBreached){
      phase="fail";phaseLabel="Failed";
    }else{
      // Work out which phase we're currently in based on cumulative profit
      // reached so far vs each phase's target (each measured from the
      // original starting balance, same as real prop firm rules).
      let reached=0,cur=1;
      for(let p=1;p<=numPhases;p++){
        const tgt=targets[p-1];
        if(tgt===null){cur=p;break;}
        const tgtAmt=startBal*(tgt/100);
        if(cumPnl>=tgtAmt){reached=p;cur=p+1;}
        else{cur=p;break;}
      }
      if(reached>=numPhases){
        phase="funded";phaseLabel="Funded";
      }else{
        phase=cur;phaseLabel="Phase "+cur;
        const tgt=targets[cur-1];
        if(tgt!==null){
          phaseTargetAmt=startBal*(tgt/100);
          phaseProgressPct=phaseTargetAmt>0?Math.min(100,Math.max(0,(cumPnl/phaseTargetAmt)*100)):0;
        }
      }
    }

    return{startBal,cumPnl,todayPnl,maxDailyPct,maxOverallPct,maxDailyAmt,maxOverallAmt,dailyLossUsed,overallLossUsed,dailyLossPctUsed,overallLossPctUsed,overallNetPct,dailyBreached,overallBreached,phase,phaseLabel,phaseTargetAmt,phaseProgressPct,numPhases};
