function getDayColor(ts){
  if(!ts.length)return null;
  const cl=ts.filter(t=>t.result==="win"||t.result==="loss");
  if(!cl.length)return"open";
  const w=cl.filter(t=>t.result==="win").length,l=cl.filter(t=>t.result==="loss").length;
  if(w>0&&l===0)return"win";if(l>0&&w===0)return"loss";
  return w>=l?"win":"loss";
}

// ── DONUT CHART ──────────────────────────────────────────────────
function DonutChart({data,title,size=160,D}){
  if(!data||!data.length)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",width:size,height:size}}><div style={{fontSize:11,color:D.text3,textAlign:"center"}}>{title}<br/>No data</div></div>);
  const total=data.reduce((s,d)=>s+Math.abs(d.value),0);
  if(total===0)return null;
  const r=60,cx=80,cy=80,stroke=22;
  let cumAngle=-90;
  const slices=data.map(d=>{const pct=Math.abs(d.value)/total;const angle=pct*360;const start=cumAngle;cumAngle+=angle;return{...d,pct,angle,start};});
  function polarToXY(angle,radius){const rad=angle*Math.PI/180;return{x:cx+radius*Math.cos(rad),y:cy+radius*Math.sin(rad)};}
  function describeArc(startAngle,endAngle,radius){const s=polarToXY(startAngle,radius);const e=polarToXY(endAngle,radius);const large=endAngle-startAngle>180?1:0;return`M${s.x},${s.y} A${radius},${radius},0,${large},1,${e.x},${e.y}`;}
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div style={{fontSize:11,fontWeight:700,color:D.text3,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,textAlign:"center"}}>{title}</div>
      <svg width={size} height={size} viewBox="0 0 160 160">
        {slices.map((s,i)=>(<path key={i} d={describeArc(s.start,s.start+s.angle-0.5,r)} fill="none" stroke={s.color} strokeWidth={stroke} strokeLinecap="butt"/>))}
        <circle cx={cx} cy={cy} r={r-stroke/2-2} fill={D.card}/>
        <text x={cx} y={cy-6} textAnchor="middle" style={{fontSize:11,fill:D.text3,fontFamily:"DM Sans,sans-serif"}}>top</text>
        <text x={cx} y={cy+10} textAnchor="middle" style={{fontSize:13,fontWeight:700,fill:D.text,fontFamily:"DM Sans,sans-serif"}}>{data[0]?.label||""}</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:4,width:"100%",marginTop:4}}>
        {slices.slice(0,4).map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11}}><div style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/><span style={{color:D.text,fontWeight:600,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.label}</span><span style={{color:s.value>=0?"#0f6e56":"#993c1d",fontWeight:700}}>{s.value>=0?"+":""}{s.value.toFixed(2)}$</span></div>))}
      </div>
    </div>
  );
}

function AnalyticsSection({all,mT,D,calMi,calYear}){
  const [view,setView]=useState("month");
  const trades=view==="month"?mT:all;
  const label=view==="month"?`${SHORT_MONTHS[calMi]} ${calYear}`:"All Time";
  function pairStats(arr){const m={};arr.forEach(t=>{if(!t.pair||t.result==="open")return;if(!m[t.pair])m[t.pair]={pnl:0,w:0,l:0};m[t.pair].pnl+=(parseFloat(t.pnl)||0);if(t.result==="win")m[t.pair].w++;if(t.result==="loss")m[t.pair].l++;});return Object.entries(m).map(([k,v])=>({label:k,...v})).sort((a,b)=>b.pnl-a.pnl);}
  function setupStatsArr(arr){const m={};arr.forEach(t=>{if(!t.setup||t.result==="open")return;if(!m[t.setup])m[t.setup]={pnl:0,w:0,l:0};m[t.setup].pnl+=(parseFloat(t.pnl)||0);if(t.result==="win")m[t.setup].w++;if(t.result==="loss")m[t.setup].l++;});return Object.entries(m).map(([k,v])=>({label:k,...v,color:SC[k]||"#888"})).sort((a,b)=>b.pnl-a.pnl);}
  const PAIR_COLORS=["#6366F1","#F59E0B","#10B981","#EF4444","#8B5CF6","#EC4899","#14B8A6","#F97316"];
  const pairs=pairStats(trades);
  const setups=setupStatsArr(trades);
  const bestPairs=pairs.slice(0,5).map((p,i)=>({...p,value:p.pnl,color:PAIR_COLORS[i%PAIR_COLORS.length]}));
  const worstPairs=[...pairs].reverse().slice(0,5).map((p,i)=>({...p,value:p.pnl,color:PAIR_COLORS[i%PAIR_COLORS.length]}));
  const bestSetups=setups.slice(0,5).map(s=>({...s,value:s.pnl}));
  const worstSetups=[...setups].reverse().slice(0,5).map(s=>({...s,value:s.pnl}));
  return(
    <div style={{marginTop:20,border:`1px solid ${D.border}`,borderRadius:12,overflow:"hidden"}}>
      <div style={{display:"flex",borderBottom:`1px solid ${D.border2}`}}>
        {[{id:"month",l:`${SHORT_MONTHS[calMi]} Analytics`},{id:"all",l:"All-Time Analytics"}].map(v=>(<button key={v.id} onClick={()=>setView(v.id)} style={{flex:1,padding:"12px",border:"none",background:view===v.id?D.navActive:D.statBg,color:view===v.id?D.navActiveTxt:D.text3,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{v.l}</button>))}
      </div>
      <div style={{padding:"20px",background:D.card}}>
        <div style={{fontSize:12,color:D.text3,marginBottom:18}}>{label} — Pair & Setup Performance</div>
        {trades.filter(t=>t.result!=="open").length===0?(<div style={{textAlign:"center",padding:"2rem",color:D.text3,fontSize:13}}>No closed trades for this period yet</div>):(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
            {bestPairs.length>0&&<DonutChart data={bestPairs} title="Best Pairs" D={D}/>}
            {worstPairs.filter(p=>p.value<0).length>0&&<DonutChart data={worstPairs.filter(p=>p.value<0)} title="Worst Pairs" D={D}/>}
            {bestSetups.length>0&&<DonutChart data={bestSetups} title="Best Setups" D={D}/>}
            {worstSetups.filter(s=>s.value<0).length>0&&<DonutChart data={worstSetups.filter(s=>s.value<0)} title="Worst Setups" D={D}/>}
          </div>
        )}
      </div>
    </div>
  );
}

// ── IMAGE EDITOR ─────────────────────────────────────────────────
function ImageEditorModal({src,onSave,onClose,D}){
  const canvasRef=useRef();
  const [brightness,setBrightness]=useState(100);
  const [contrast,setContrast]=useState(100);
  const [rotation,setRotation]=useState(0);
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const img=new Image();
    img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.filter=`brightness(${brightness}%) contrast(${contrast}%)`;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.drawImage(img,-img.width/2,-img.height/2);ctx.restore();};
    img.src=src;
  },[src,brightness,contrast,rotation]);
  function handleSave(){onSave(canvasRef.current.toDataURL("image/jpeg",0.92));}
  function handleDownload(){const a=document.createElement("a");a.href=canvasRef.current.toDataURL("image/jpeg",0.92);a.download="trade-chart.jpg";a.click();}
  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000,backdropFilter:"blur(6px)"};
  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,borderRadius:16,padding:"24px",width:"90%",maxWidth:700,border:`1px solid ${D.border}`,boxShadow:"0 24px 80px rgba(0,0,0,0.5)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:800,color:D.text}}>✏️ Edit Image</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>
        </div>
        <canvas ref={canvasRef} style={{width:"100%",borderRadius:8,border:`1px solid ${D.border}`,marginBottom:16,maxHeight:360,objectFit:"contain"}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:16}}>
          {[{label:"Brightness",val:brightness,set:setBrightness,min:50,max:150},{label:"Contrast",val:contrast,set:setContrast,min:50,max:150}].map(s=>(<div key={s.label}><div style={{fontSize:11,color:D.text3,marginBottom:4,fontWeight:700}}>{s.label}: {s.val}%</div><input type="range" min={s.min} max={s.max} value={s.val} onChange={e=>s.set(Number(e.target.value))} style={{width:"100%",accentColor:"#2563EB"}}/></div>))}
          <div><div style={{fontSize:11,color:D.text3,marginBottom:4,fontWeight:700}}>Rotation: {rotation}°</div><div style={{display:"flex",gap:6}}>{[-90,90,180].map(r=>(<button key={r} onClick={()=>setRotation(v=>(v+r+360)%360)} style={{flex:1,padding:"5px",border:`1px solid ${D.border}`,borderRadius:6,background:D.card2,color:D.text2,fontSize:11,cursor:"pointer"}}>{r>0?"+":""}{r}°</button>))}</div></div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={handleSave} style={{flex:1,padding:"11px",border:"none",borderRadius:10,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:800,cursor:"pointer"}}>💾 Save Changes</button>
          <button onClick={handleDownload} style={{padding:"11px 18px",border:`1px solid ${D.border}`,borderRadius:10,background:"transparent",color:D.text2,fontSize:13,fontWeight:700,cursor:"pointer"}}>⬇ Download</button>
          <button onClick={onClose} style={{padding:"11px 18px",border:`1px solid ${D.border}`,borderRadius:10,background:"transparent",color:D.text2,fontSize:13,fontWeight:700,cursor:"pointer"}}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── SETUP PERFORMANCE ─────────────────────────────────────────────
function SetupPerf({stats,D}){
  const entries=Object.keys(stats).map(s=>{const d=stats[s];const tot=d.w+d.l;const wr=tot>0?Math.round((d.w/tot)*100):null;return{name:s,...d,tot,wr};}).filter(e=>e.tot>0);
  if(!entries.length)return(<div style={{textAlign:"center",padding:"2rem",color:D.text3,fontSize:13}}>No closed trades for this period yet</div>);
  const best=entries.reduce((a,b)=>(a.wr||0)>=(b.wr||0)?a:b,entries[0]);
  const worst=entries.reduce((a,b)=>(a.wr||0)<=(b.wr||0)?a:b,entries[0]);
  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:14}}>
        <div style={{flex:1,padding:"11px 14px",background:D.statBg,borderRadius:10,border:"1px solid #1D9E75"}}><div style={{fontSize:10,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Best setup</div><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,fontWeight:800,padding:"3px 10px",borderRadius:6,background:SC[best.name]||"#666",color:"#fff"}}>{best.name}</span><span style={{fontSize:15,fontWeight:800,color:"#0f6e56"}}>{best.wr}% WR</span></div></div>
        {entries.length>1&&best.name!==worst.name&&(<div style={{flex:1,padding:"11px 14px",background:D.statBg,borderRadius:10,border:"1px solid #E24B4A"}}><div style={{fontSize:10,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:5}}>Worst setup</div><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,fontWeight:800,padding:"3px 10px",borderRadius:6,background:SC[worst.name]||"#666",color:"#fff"}}>{worst.name}</span><span style={{fontSize:15,fontWeight:800,color:"#993c1d"}}>{worst.wr}% WR</span></div></div>)}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {entries.sort((a,b)=>(b.wr||0)-(a.wr||0)).map(e=>(<div key={e.name} style={{padding:"11px 14px",background:D.statBg,borderRadius:9,border:`1px solid ${D.statBorder}`}}><div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}><span style={{fontSize:12,fontWeight:800,padding:"2px 9px",borderRadius:6,background:SC[e.name]||"#666",color:"#fff"}}>{e.name}</span><span style={{fontSize:12,color:D.text3}}>{e.tot} trades · {e.w}W / {e.l}L</span><span style={{marginLeft:"auto",fontSize:14,fontWeight:800,color:e.wr>=50?"#0f6e56":"#993c1d"}}>{e.wr}%</span><span style={{fontSize:12,fontWeight:700,color:e.pnl>0?"#0f6e56":e.pnl<0?"#993c1d":D.text3}}>{(e.pnl>=0?"+":"")+"$"+e.pnl.toFixed(2)}</span></div><div style={{height:5,background:D.border,borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:(e.wr||0)+"%",background:SC[e.name]||"#888",borderRadius:99,opacity:0.8}}/></div></div>))}
      </div>
    </div>
  );
}

// ── IMG CARD ──────────────────────────────────────────────────────
function ImgCard({trade,onImgBefore,onImgAfter,onImgBeforeData,onImgAfterData,onNote,D}){
  const bfRef=useRef(),afRef=useRef();
  const [editImg,setEditImg]=useState(null);
  const [focusedField,setFocusedField]=useState(null);
  const bs=RC[trade.result]||{bg:"#f0f0f0",c:"#888"};
  const wkDate=trade._wk?new Date(trade._wk+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
  useEffect(()=>{
    function handleGlobalPaste(e){
      if(!focusedField)return;
      const items=e.clipboardData?.items;if(!items)return;
      for(const item of items){if(item.type.startsWith("image/")){const file=item.getAsFile();if(!file)return;const r=new FileReader();r.onload=ev=>{if(focusedField==="imgBefore")onImgBeforeData(ev.target.result);else onImgAfterData(ev.target.result);};r.readAsDataURL(file);e.preventDefault();break;}}
    }
    document.addEventListener("paste",handleGlobalPaste);
    return()=>document.removeEventListener("paste",handleGlobalPaste);
  },[focusedField,onImgBeforeData,onImgAfterData]);
  function handleDownload(src,label){const a=document.createElement("a");a.href=src;a.download=`${trade.pair||"trade"}-${label}.jpg`;a.click();}
  return(
    <div style={{border:`1px solid ${D.border}`,borderRadius:12,overflow:"hidden",background:D.card}}>
      <div style={{padding:"11px 14px",borderBottom:`1px solid ${D.border2}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:14,fontWeight:800,color:D.text}}>{trade.pair||"Trade"}</span>
          {wkDate&&<span style={{fontSize:11,color:D.text3}}>{wkDate}</span>}
          {trade.setup&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:6,background:SC[trade.setup]||"#666",color:"#fff",fontWeight:700}}>{trade.setup}</span>}
          {trade.direction&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:6,background:trade.direction==="buy"?"#EAF3DE":"#FCEBEB",color:trade.direction==="buy"?"#3B6D11":"#A32D2D",fontWeight:700}}>{trade.direction.toUpperCase()}</span>}
          {trade.pnl&&<span style={{fontSize:12,fontWeight:700,color:parseFloat(trade.pnl)>0?"#0f6e56":parseFloat(trade.pnl)<0?"#993c1d":D.text3}}>{parseFloat(trade.pnl)>0?"+":""}{trade.pnl}$</span>}
        </div>
        <span style={{fontSize:11,padding:"4px 11px",borderRadius:20,fontWeight:700,background:bs.bg,color:bs.c}}>{(trade.result||"open").charAt(0).toUpperCase()+(trade.result||"open").slice(1)}</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr"}}>
        {[{label:"📸  BEFORE",img:trade.imgBefore,ref:bfRef,field:"imgBefore",onUp:onImgBefore},{label:"✅  AFTER",img:trade.imgAfter,ref:afRef,field:"imgAfter",onUp:onImgAfter}].map((s,si)=>(
          <div key={s.label} style={{borderRight:si===0?`1px solid ${D.border2}`:"none"}}>
            <div style={{fontSize:10,fontWeight:800,color:D.text3,textTransform:"uppercase",letterSpacing:"0.08em",padding:"7px 12px",borderBottom:`1px solid ${D.border2}`,background:D.card2,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>{s.label}</span>
              {s.img&&(<div style={{display:"flex",gap:6}}><button onClick={()=>setEditImg({field:s.field,src:s.img})} style={{fontSize:10,padding:"2px 7px",border:`1px solid ${D.border}`,borderRadius:4,background:"transparent",color:D.text2,cursor:"pointer"}}>✏️ Edit</button><button onClick={()=>handleDownload(s.img,s.field==="imgBefore"?"before":"after")} style={{fontSize:10,padding:"2px 7px",border:`1px solid ${D.border}`,borderRadius:4,background:"transparent",color:D.text2,cursor:"pointer"}}>⬇</button></div>)}
            </div>
            <div onFocus={()=>setFocusedField(s.field)} onBlur={()=>setFocusedField(null)} onClick={()=>s.ref.current.click()} tabIndex={0} style={{height:180,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:focusedField===s.field?(D.card2+"cc"):D.card2,cursor:"pointer",position:"relative",overflow:"hidden",outline:focusedField===s.field?"2px solid #2563EB":"none",transition:"outline 0.15s"}}>
              {s.img?<img src={s.img} alt={s.label} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<><div style={{fontSize:30,marginBottom:8}}>{si===0?"📸":"✅"}</div><div style={{fontSize:12,color:D.text3,fontWeight:500}}>Click to upload</div><div style={{fontSize:11,color:"#2563EB",marginTop:4,fontWeight:600}}>or click here then Ctrl+V to paste</div></>}
              <input ref={s.ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>s.onUp(e.target.files[0])}/>
            </div>
          </div>
        ))}
      </div>
      <div style={{padding:"10px 12px",borderTop:`1px solid ${D.border2}`}}>
        <input type="text" value={trade.imgNote||""} onChange={e=>onNote(e.target.value)} placeholder="Caption or notes..." style={{width:"100%",fontSize:12,padding:"6px 9px",border:`1px solid ${D.inputBorder}`,borderRadius:7,background:D.inputBg,color:D.text,outline:"none"}}/>
      </div>
      {editImg&&(<ImageEditorModal src={editImg.src} D={D} onSave={data=>{if(editImg.field==="imgBefore")onImgBeforeData(data);else onImgAfterData(data);setEditImg(null);}} onClose={()=>setEditImg(null)}/>)}
    </div>
  );
}

// ── CHECKLIST MODAL ───────────────────────────────────────────────
function ChecklistModal({D,existing,accounts,onSave,onClose}){
  const [name,setName]=useState(existing?.name||"");
  const [color,setColor]=useState(existing?.color||CLCOLORS[0]);
  const [account,setAccount]=useState(existing?.account||"");
  const [items,setItems]=useState(existing?.items||[]);
  const [newText,setNewText]=useState("");
  const [newNote,setNewNote]=useState("");
  const [newRequired,setNewRequired]=useState(false);
  const [editIdx,setEditIdx]=useState(null);
  function addItem(){if(!newText.trim())return;const item={text:newText.trim(),note:newNote.trim(),required:newRequired};if(editIdx!==null){setItems(p=>p.map((it,i)=>i===editIdx?item:it));setEditIdx(null);}else{setItems(p=>[...p,item]);}setNewText("");setNewNote("");setNewRequired(false);}
  function removeItem(i){setItems(p=>p.filter((_,j)=>j!==i));}
  function moveItem(i,dir){const a=[...items];const b=i+dir;if(b<0||b>=a.length)return;[a[i],a[b]]=[a[b],a[i]];setItems(a);}
  function startEdit(i){setEditIdx(i);setNewText(items[i].text);setNewNote(items[i].note||"");setNewRequired(items[i].required||false);}
  function submit(){if(!name.trim())return;onSave({id:existing?.id||uid(),name:name.trim(),color,account,items});}
  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)"};
  const inp2=(extra={})=>({fontSize:13,padding:"8px 10px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,color:D.text,outline:"none",...extra});
  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,borderRadius:16,padding:"28px",width:"100%",maxWidth:560,maxHeight:"90vh",overflowY:"auto",border:`1px solid ${D.border}`,boxShadow:"0 24px 80px rgba(0,0,0,0.4)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <div style={{fontSize:18,fontWeight:800,color:D.text}}>{existing?"Edit Checklist":"New Checklist"}</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>
        </div>
        <div style={{marginBottom:14}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Checklist Name</div><input style={{...inp2(),width:"100%",boxSizing:"border-box"}} value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. My OB Setup"/></div>
        <div style={{marginBottom:14}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Color</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{CLCOLORS.map(c=>(<div key={c} onClick={()=>setColor(c)} style={{width:28,height:28,borderRadius:7,background:c,cursor:"pointer",border:color===c?"3px solid "+D.text:"3px solid transparent",transition:"border 0.1s"}}/>))}</div></div>
        <div style={{marginBottom:18}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Assign to Account (optional)</div><select style={{...inp2(),width:"100%",boxSizing:"border-box"}} value={account} onChange={e=>setAccount(e.target.value)}><option value="">All accounts</option>{accounts.map(a=>(<option key={a.id} value={a.name}>{a.name}</option>))}</select></div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Rules ({items.length})</div>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
            {items.map((item,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"10px 12px",background:D.card2,borderRadius:8,border:`1px solid ${D.border}`}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}><span style={{fontSize:13,color:D.text,fontWeight:500}}>{item.text}</span>{item.required&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:4,background:"#EF4444",color:"#fff",fontWeight:800}}>REQ</span>}</div>{item.note&&<div style={{fontSize:11,color:D.text3}}>{item.note}</div>}</div><div style={{display:"flex",gap:4,flexShrink:0}}><button onClick={()=>moveItem(i,-1)} style={{border:`1px solid ${D.border}`,background:"transparent",color:D.text3,borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>↑</button><button onClick={()=>moveItem(i,1)} style={{border:`1px solid ${D.border}`,background:"transparent",color:D.text3,borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>↓</button><button onClick={()=>startEdit(i)} style={{border:`1px solid ${D.border}`,background:"transparent",color:D.text2,borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>✏️</button><button onClick={()=>removeItem(i)} style={{border:"1px solid #E24B4A",background:"transparent",color:"#E24B4A",borderRadius:5,padding:"2px 6px",cursor:"pointer",fontSize:11}}>✕</button></div></div>))}
          </div>
          <div style={{padding:"14px",background:D.card2,borderRadius:10,border:`1px solid ${D.border}`}}>
            <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:8}}>{editIdx!==null?"Edit Rule":"Add Rule"}</div>
            <input style={{...inp2(),width:"100%",boxSizing:"border-box",marginBottom:8}} value={newText} onChange={e=>setNewText(e.target.value)} placeholder="Rule description..." onKeyDown={e=>e.key==="Enter"&&addItem()}/>
            <input style={{...inp2(),width:"100%",boxSizing:"border-box",marginBottom:8}} value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Optional sub-note..."/>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><div onClick={()=>setNewRequired(v=>!v)} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}><div style={{width:16,height:16,borderRadius:4,border:`2px solid ${newRequired?"#EF4444":D.border}`,background:newRequired?"#EF4444":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{newRequired&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}</div><span style={{fontSize:12,color:D.text2,fontWeight:600}}>Mark as Required</span></div></div>
            <button onClick={addItem} style={{padding:"8px 18px",border:"none",borderRadius:8,background:color,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>{editIdx!==null?"Update Rule":"+ Add Rule"}</button>
            {editIdx!==null&&<button onClick={()=>{setEditIdx(null);setNewText("");setNewNote("");setNewRequired(false);}} style={{marginLeft:8,padding:"8px 14px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,cursor:"pointer"}}>Cancel</button>}
          </div>
        </div>
        <button onClick={submit} style={{width:"100%",padding:"13px",border:"none",borderRadius:10,background:color,color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer"}}>{existing?"Save Changes":"Create Checklist"}</button>
      </div>
    </div>
  );
}

// ── STRATEGY PANEL ────────────────────────────────────────────────
function StrategyPanel({dark,D,store,setStore,accounts}){
  const [tab,setTab]=useState("rules");
  const checklists=store.checklists||[];
  const notes=store.notes||[];
  const [activeClId,setActiveClId]=useState(null);
  const [showClModal,setShowClModal]=useState(false);
  const [editCl,setEditCl]=useState(null);
  const [ck,setCk]=useState({});
  const [confirmDeleteClId,setConfirmDeleteClId]=useState(null);
  const [activeNoteId,setActiveNoteId]=useState(null);
  const [noteSearch,setNoteSearch]=useState("");
  const [activeFolder,setActiveFolder]=useState("All");
  const [showNoteEditor,setShowNoteEditor]=useState(false);
  const [confirmDeleteNoteId,setConfirmDeleteNoteId]=useState(null);
  const activeCl=checklists.find(c=>c.id===activeClId)||checklists[0]||null;
  function saveChecklist(cl){setStore(s=>{const ex=(s.checklists||[]).find(c=>c.id===cl.id);return{...s,checklists:ex?(s.checklists||[]).map(c=>c.id===cl.id?cl:c):[...(s.checklists||[]),cl]};});}
  function deleteChecklist(id){setStore(s=>({...s,checklists:(s.checklists||[]).filter(c=>c.id!==id)}));if(activeClId===id)setActiveClId(null);}
  function duplicateChecklist(cl){const dup={...cl,id:uid(),name:cl.name+" (copy)"};setStore(s=>({...s,checklists:[...(s.checklists||[]),dup]}));}
  function saveNote(note){setStore(s=>{const ex=(s.notes||[]).find(n=>n.id===note.id);return{...s,notes:ex?(s.notes||[]).map(n=>n.id===note.id?note:n):[...(s.notes||[]),note]};});}
  function deleteNote(id){setStore(s=>({...s,notes:(s.notes||[]).filter(n=>n.id!==id)}));if(activeNoteId===id){setActiveNoteId(null);setShowNoteEditor(false);}}
  function togglePin(id){setStore(s=>({...s,notes:(s.notes||[]).map(n=>n.id===id?{...n,pinned:!n.pinned}:n)}));}
  const folders=["All",...[...new Set(notes.map(n=>n.folder||"General"))].sort()];
  const filteredNotes=notes.filter(n=>activeFolder==="All"||(n.folder||"General")===activeFolder).filter(n=>!noteSearch||(n.title+n.body).toLowerCase().includes(noteSearch.toLowerCase())).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updatedAt||0)-(a.updatedAt||0));
  const activeNote=notes.find(n=>n.id===activeNoteId)||null;
  const inp=(extra={})=>({fontSize:13,padding:"8px 10px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,color:D.text,outline:"none",...extra});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:0}}>
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {[{id:"rules",icon:"✅",label:"Rules"},{id:"notes",icon:"📝",label:"Note For Plan"}].map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"13px",border:tab===t.id?`2px solid ${D.navActive}`:`1px solid ${D.border}`,borderRadius:10,background:tab===t.id?D.navActive:"transparent",color:tab===t.id?D.navActiveTxt:D.text2,fontSize:14,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{t.icon} {t.label}</button>))}
      </div>
      {tab==="rules"&&(
        <div className="split-cols-260" style={{gap:16}}>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button onClick={()=>{setEditCl(null);setShowClModal(true);}} style={{padding:"11px",border:`2px dashed ${D.border}`,borderRadius:10,background:"transparent",color:D.text3,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:4}}>+ New Checklist</button>
            {checklists.length===0&&(<div style={{textAlign:"center",padding:"2rem 1rem",color:D.text3,fontSize:12,border:`1px dashed ${D.border}`,borderRadius:10}}>No checklists yet.<br/>Create one to get started.</div>)}
            {checklists.map(cl=>(<div key={cl.id} onClick={()=>setActiveClId(cl.id)} style={{padding:"12px 14px",borderRadius:10,border:`2px solid ${activeClId===cl.id?cl.color||"#2563EB":D.border}`,background:activeClId===cl.id?(cl.color||"#2563EB")+"18":D.card,cursor:"pointer",transition:"all 0.15s"}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}><div style={{width:10,height:10,borderRadius:3,background:cl.color||"#2563EB",flexShrink:0}}/><span style={{fontSize:13,fontWeight:700,color:activeClId===cl.id?(cl.color||"#2563EB"):D.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cl.name}</span></div><div style={{fontSize:11,color:D.text3}}>{(cl.items||[]).length} rules · {cl.account||"All accounts"}</div></div>))}
          </div>
          {activeCl?(
            <div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,padding:"14px 18px",background:D.card,borderRadius:12,border:`1px solid ${D.border}`}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:14,height:14,borderRadius:4,background:activeCl.color||"#2563EB"}}/><span style={{fontSize:16,fontWeight:800,color:D.text}}>{activeCl.name}</span>{activeCl.account&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:5,background:D.statBg,border:`1px solid ${D.border}`,color:D.text3}}>{activeCl.account}</span>}</div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <button onClick={()=>{setEditCl(activeCl);setShowClModal(true);}} style={{padding:"6px 12px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:12,cursor:"pointer",fontWeight:600}}>✏️ Edit</button>
                  <button onClick={()=>duplicateChecklist(activeCl)} style={{padding:"6px 12px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:12,cursor:"pointer",fontWeight:600}}>⧉ Duplicate</button>
                  {confirmDeleteClId===activeCl.id?(
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:12,color:"#E24B4A",fontWeight:700}}>Delete?</span>
                      <button onClick={()=>{deleteChecklist(activeCl.id);setConfirmDeleteClId(null);}} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#E24B4A",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:700}}>Yes</button>
                      <button onClick={()=>setConfirmDeleteClId(null)} style={{padding:"6px 12px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:12,cursor:"pointer"}}>No</button>
                    </div>
                  ):(
                    <button onClick={()=>setConfirmDeleteClId(activeCl.id)} style={{padding:"6px 12px",border:"1px solid #E24B4A",borderRadius:7,background:"transparent",color:"#E24B4A",fontSize:12,cursor:"pointer",fontWeight:600}}>🗑 Delete</button>
                  )}
                </div>
              </div>
              {(activeCl.items||[]).length>0&&(()=>{const checked=(activeCl.items||[]).filter((_,i)=>ck[`${activeCl.id}-${i}`]).length;const total=(activeCl.items||[]).length;const pct=Math.round(checked/total*100);const allOk=checked===total;return(<div style={{marginBottom:14,padding:"12px 16px",background:allOk?(dark?"#0a2a1a":"#f0faf5"):D.statBg,border:`1px solid ${allOk?"#1D9E75":D.statBorder}`,borderRadius:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:6}}><span style={{color:allOk?"#0f6e56":D.text3,fontWeight:700}}>{allOk?"✓ ALL CONDITIONS MET — TRADE VALID":"Checklist Progress"}</span><span style={{color:allOk?"#0f6e56":D.text3,fontWeight:700}}>{checked}/{total}</span></div><div style={{height:6,background:D.border,borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:allOk?"#1D9E75":(activeCl.color||"#2563EB"),borderRadius:99,transition:"width 0.3s"}}/></div></div>);})()}
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {(activeCl.items||[]).map((item,i)=>{const k=`${activeCl.id}-${i}`;const done=ck[k];const color=activeCl.color||"#2563EB";return(<div key={i} onClick={()=>setCk(p=>({...p,[k]:!p[k]}))} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"13px 16px",border:`1.5px solid ${done?color+"66":D.border}`,borderRadius:9,cursor:"pointer",background:done?color+"10":D.card,transition:"all 0.15s"}}><div style={{width:20,height:20,borderRadius:5,border:`2px solid ${done?color:D.border}`,background:done?color:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{done&&<span style={{color:"#fff",fontSize:12,fontWeight:900}}>✓</span>}</div><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,color:done?D.text3:D.text,fontWeight:done?400:500,lineHeight:1.6,textDecoration:done?"line-through":"none"}}>{item.text}</span>{item.required&&<span style={{fontSize:9,padding:"1px 6px",borderRadius:4,background:"#EF4444",color:"#fff",fontWeight:800,flexShrink:0}}>REQUIRED</span>}</div>{item.note&&<div style={{fontSize:11,color:D.text3,marginTop:3}}>{item.note}</div>}</div></div>);})}
              </div>
              {(activeCl.items||[]).length===0&&(<div style={{textAlign:"center",padding:"3rem",color:D.text3,fontSize:13,border:`1px dashed ${D.border}`,borderRadius:10}}>No rules yet — click Edit to add rules.</div>)}
            </div>
          ):(
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",border:`1px dashed ${D.border}`,borderRadius:12,color:D.text3,fontSize:13}}>Select a checklist or create a new one</div>
          )}
        </div>
      )}
      {tab==="notes"&&(
        <div className="split-cols-280" style={{gap:16}}>
          <div style={{display:"flex",flexDirection:"column",gap:0,background:D.card,borderRadius:12,border:`1px solid ${D.border}`,overflow:"hidden"}}>
            <div style={{padding:"12px",borderBottom:`1px solid ${D.border}`}}><input value={noteSearch} onChange={e=>setNoteSearch(e.target.value)} placeholder="🔍 Search notes..." style={{...inp(),width:"100%",fontSize:12,boxSizing:"border-box"}}/></div>
            <button onClick={()=>{const n={id:uid(),title:"",body:"",folder:"General",pinned:false,account:"",createdAt:Date.now(),updatedAt:Date.now()};saveNote(n);setActiveNoteId(n.id);setShowNoteEditor(true);}} style={{margin:"10px",padding:"10px",border:`2px dashed ${D.border}`,borderRadius:9,background:"transparent",color:D.text3,fontSize:13,fontWeight:700,cursor:"pointer"}}>+ New Note</button>
            <div style={{padding:"0 8px 6px",display:"flex",gap:4,flexWrap:"wrap"}}>{folders.map(f=>(<button key={f} onClick={()=>setActiveFolder(f)} style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,cursor:"pointer",border:`1px solid ${activeFolder===f?D.navActive:D.border}`,background:activeFolder===f?D.navActive:"transparent",color:activeFolder===f?D.navActiveTxt:D.text3}}>{f}</button>))}</div>
            <div style={{flex:1,overflowY:"auto"}}>
              {filteredNotes.length===0&&(<div style={{padding:"2rem",textAlign:"center",color:D.text3,fontSize:12}}>No notes found</div>)}
              {filteredNotes.map(n=>(<div key={n.id} onClick={()=>{setActiveNoteId(n.id);setShowNoteEditor(true);}} style={{padding:"12px 14px",borderBottom:`1px solid ${D.border2}`,cursor:"pointer",background:activeNoteId===n.id?D.statBg:"transparent",transition:"background 0.1s"}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>{n.pinned&&<span style={{fontSize:10}}>📌</span>}<span style={{fontSize:13,fontWeight:700,color:D.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.title||"Untitled"}</span></div><div style={{fontSize:11,color:D.text3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:3}}>{n.body||"No content"}</div><div style={{display:"flex",gap:6,alignItems:"center"}}><span style={{fontSize:10,color:D.text3}}>{new Date(n.updatedAt||n.createdAt||Date.now()).toLocaleDateString()}</span>{n.folder&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:4,background:D.border,color:D.text3}}>{n.folder}</span>}{n.account&&<span style={{fontSize:10,padding:"1px 6px",borderRadius:4,background:"#2563EB22",color:"#2563EB"}}>{n.account}</span>}</div></div>))}
            </div>
          </div>
          {showNoteEditor&&activeNote?(
            <div style={{background:D.card,borderRadius:12,border:`1px solid ${D.border}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:`1px solid ${D.border}`,flexWrap:"wrap"}}>
                <button onClick={()=>togglePin(activeNote.id)} style={{padding:"5px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:activeNote.pinned?"#F59E0B22":"transparent",color:activeNote.pinned?"#F59E0B":D.text3,fontSize:11,fontWeight:700,cursor:"pointer"}}>{activeNote.pinned?"📌 Pinned":"📌 Pin"}</button>
                <select value={activeNote.folder||"General"} onChange={e=>saveNote({...activeNote,folder:e.target.value,updatedAt:Date.now()})} style={{...inp(),fontSize:11,padding:"5px 8px",height:30}}>{[...new Set([...folders.filter(f=>f!=="All"),"General","Ideas","Account Plan","Market Analysis","Personal"])].map(f=>(<option key={f} value={f}>{f}</option>))}</select>
                <select value={activeNote.account||""} onChange={e=>saveNote({...activeNote,account:e.target.value,updatedAt:Date.now()})} style={{...inp(),fontSize:11,padding:"5px 8px",height:30}}><option value="">No account</option>{accounts.map(a=>(<option key={a.id} value={a.name}>{a.name}</option>))}</select>
                <div style={{marginLeft:"auto",display:"flex",gap:8}}>
                  {confirmDeleteNoteId===activeNote.id?(
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:11,color:"#E24B4A",fontWeight:700}}>Delete?</span>
                      <button onClick={()=>{deleteNote(activeNote.id);setConfirmDeleteNoteId(null);}} style={{padding:"5px 10px",border:"none",borderRadius:7,background:"#E24B4A",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>Yes</button>
                      <button onClick={()=>setConfirmDeleteNoteId(null)} style={{padding:"5px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:11,cursor:"pointer"}}>No</button>
                    </div>
                  ):(
                    <button onClick={()=>setConfirmDeleteNoteId(activeNote.id)} style={{padding:"5px 10px",border:"1px solid #E24B4A",borderRadius:7,background:"transparent",color:"#E24B4A",fontSize:11,fontWeight:700,cursor:"pointer"}}>🗑 Delete</button>
                  )}
                  <button onClick={()=>setShowNoteEditor(false)} style={{padding:"5px 10px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:11,fontWeight:700,cursor:"pointer"}}>✕ Close</button>
                </div>
              </div>
              <input value={activeNote.title||""} onChange={e=>saveNote({...activeNote,title:e.target.value,updatedAt:Date.now()})} placeholder="Note title..." style={{fontSize:22,fontWeight:800,color:D.text,border:"none",outline:"none",padding:"20px 20px 8px",background:"transparent",fontFamily:"inherit"}}/>
              <div style={{fontSize:11,color:D.text3,padding:"0 20px 12px"}}>{new Date(activeNote.updatedAt||Date.now()).toLocaleString()}</div>
              <textarea value={activeNote.body||""} onChange={e=>saveNote({...activeNote,body:e.target.value,updatedAt:Date.now()})} placeholder="Start writing your plan, ideas, market analysis..." style={{flex:1,fontSize:14,color:D.text,border:"none",outline:"none",padding:"0 20px 20px",background:"transparent",fontFamily:"inherit",resize:"none",lineHeight:1.8,minHeight:400}}/>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",border:`1px dashed ${D.border}`,borderRadius:12,color:D.text3,gap:12}}><div style={{fontSize:40}}>📝</div><div style={{fontSize:14,fontWeight:700,color:D.text}}>Note For Plan</div><div style={{fontSize:12,color:D.text3}}>Select a note or create a new one</div></div>
          )}
        </div>
      )}
      {showClModal&&(<ChecklistModal D={D} existing={editCl} accounts={accounts} onSave={cl=>{saveChecklist(cl);setActiveClId(cl.id);setShowClModal(false);}} onClose={()=>setShowClModal(false)}/>)}
    </div>
  );
}

// ── ACCOUNT MODAL ─────────────────────────────────────────────────
function AccountModal({D,dark,existing,onSave,onDelete,onClose}){
  const [name,setName]=useState(existing?.name||"");
  const [type,setType]=useState(existing?.type||"personal");
  const [balance,setBalance]=useState(existing?.balance||"");
  const [accountType,setAccountType]=useState(existing?.accountType||"1-Step");
  const [maxDaily,setMaxDaily]=useState(existing?.maxDailyLoss||"");
  const [maxOverall,setMaxOverall]=useState(existing?.maxOverallLoss||"");
  const [target1,setTarget1]=useState(existing?.profitTarget1||"");
  const [target2,setTarget2]=useState(existing?.profitTarget2||"");
  const [target3,setTarget3]=useState(existing?.profitTarget3||"");
  const [manualFail,setManualFail]=useState(existing?.status==="fail");
  const [confirmDelete,setConfirmDelete]=useState(false);
  const numPhases=accountType==="Instant"?0:accountType==="1-Step"?1:accountType==="2-Step"?2:3;
  function submit(){
    if(!name.trim())return;
    // Status for prop accounts is mostly auto-derived from phase progress
    // (see currentPhase() in App) — "fail" is the one manual override, for
    // when a loss limit is breached and the challenge is over.
    const status=type==="prop"?(manualFail?"fail":"active"):undefined;
    onSave({id:existing?.id||uid(),name:name.trim(),type,balance,accountType,maxDailyLoss:maxDaily,maxOverallLoss:maxOverall,profitTarget1:target1,profitTarget2:target2,profitTarget3:target3,status});
  }
  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)"};
  const inp=(extra={})=>({width:"100%",fontSize:13,padding:"8px 10px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,color:D.text,outline:"none",boxSizing:"border-box",...extra});
  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,borderRadius:16,padding:"28px",width:"100%",maxWidth:480,border:`1px solid ${D.border}`,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}><div style={{fontSize:18,fontWeight:800,color:D.text}}>{existing?"Edit Account":"New Account"}</div><button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button></div>
        <div style={{marginBottom:20}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Account Type</div><div style={{display:"flex",gap:8}}>{[{id:"personal",icon:"👤",label:"Personal"},{id:"prop",icon:"🏢",label:"Prop Firm"}].map(t=>(<button key={t.id} onClick={()=>setType(t.id)} style={{flex:1,padding:"12px",border:`2px solid ${type===t.id?(t.id==="prop"?"#D97706":"#2563EB"):D.border}`,borderRadius:10,background:type===t.id?(t.id==="prop"?"#D97706":"#2563EB"):"transparent",color:type===t.id?"#fff":D.text2,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.15s"}}>{t.icon} {t.label}</button>))}</div></div>
        <div style={{marginBottom:16}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Account Name</div><input style={inp()} value={name} onChange={e=>setName(e.target.value)} placeholder={type==="prop"?"e.g. FTMO $100K Challenge":"e.g. My Deriv Account"}/></div>
        <div style={{marginBottom:16}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Account Balance ($)</div><input style={inp()} type="number" value={balance} onChange={e=>setBalance(e.target.value)} placeholder="e.g. 10000"/></div>
        {type==="prop"&&(<>
          <div style={{marginBottom:16}}><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Challenge Type</div><select style={inp()} value={accountType} onChange={e=>setAccountType(e.target.value)}>{ACCOUNT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
            <div><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Max Daily Loss %</div><input style={inp()} type="number" value={maxDaily} onChange={e=>setMaxDaily(e.target.value)} placeholder="e.g. 5"/></div>
            <div><div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Max Overall Loss %</div><input style={inp()} type="number" value={maxOverall} onChange={e=>setMaxOverall(e.target.value)} placeholder="e.g. 10"/></div>
          </div>
          {numPhases>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Profit Targets (%) — for auto phase progress</div>
              <div style={{display:"grid",gridTemplateColumns:`repeat(${numPhases},1fr)`,gap:12}}>
                <div><div style={{fontSize:11,color:D.text3,marginBottom:6}}>Phase 1 Target %</div><input style={inp()} type="number" value={target1} onChange={e=>setTarget1(e.target.value)} placeholder="e.g. 8"/></div>
                {numPhases>=2&&(<div><div style={{fontSize:11,color:D.text3,marginBottom:6}}>Phase 2 Target %</div><input style={inp()} type="number" value={target2} onChange={e=>setTarget2(e.target.value)} placeholder="e.g. 5"/></div>)}
                {numPhases>=3&&(<div><div style={{fontSize:11,color:D.text3,marginBottom:6}}>Phase 3 Target %</div><input style={inp()} type="number" value={target3} onChange={e=>setTarget3(e.target.value)} placeholder="e.g. 5"/></div>)}
              </div>
              <div style={{fontSize:11,color:D.text3,marginTop:8,lineHeight:1.5}}>Each target is % profit from your starting balance. The account automatically moves to the next phase (or Funded) once your account P&L reaches that phase's target.</div>
            </div>
          )}
          <div style={{marginBottom:20,padding:"13px 15px",borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`}}>
            <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
              <input type="checkbox" checked={manualFail} onChange={e=>setManualFail(e.target.checked)} style={{width:16,height:16,cursor:"pointer"}}/>
              <span style={{fontSize:12.5,color:D.text,fontWeight:600}}>Mark this challenge as Failed (e.g. breached a loss limit)</span>
            </label>
            <div style={{fontSize:11,color:D.text3,marginTop:6,marginLeft:26}}>Phase and Funded status are calculated automatically from your trades — use this only to mark a failed challenge.</div>
          </div>
        </>)}
        {!confirmDelete?(
          <div style={{display:"flex",gap:10}}><button onClick={submit} style={{flex:1,padding:"13px",border:"none",borderRadius:10,background:type==="prop"?"#D97706":"#2563EB",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer"}}>{existing?"Save Changes":"Create Account"}</button>{existing&&(<button onClick={()=>setConfirmDelete(true)} style={{padding:"13px 18px",border:`1px solid ${D.border}`,borderRadius:10,background:"transparent",color:"#E24B4A",fontSize:13,fontWeight:700,cursor:"pointer"}}>Delete</button>)}</div>
        ):(
          <div style={{padding:"14px 16px",borderRadius:10,background:dark?"#2a0a0a":"#fdeeee",border:"1px solid #E24B4A55"}}>
            <div style={{fontSize:13,color:D.text,fontWeight:700,marginBottom:4}}>Delete "{existing?.name}"?</div>
            <div style={{fontSize:12,color:D.text3,marginBottom:12}}>This permanently deletes the account and every trade logged under it. This can't be undone.</div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>onDelete(existing.id)} style={{flex:1,padding:"11px",border:"none",borderRadius:9,background:"#E24B4A",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>Yes, Delete</button>
              <button onClick={()=>setConfirmDelete(false)} style={{flex:1,padding:"11px",border:`1px solid ${D.border}`,borderRadius:9,background:"transparent",color:D.text2,fontSize:13,fontWeight:700,cursor:"pointer"}}>No, Keep It</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── SETTINGS MODAL (Personal Data + Security Settings) ──────────────
// ── REFERRALS PANEL (clicks, signups, paid, 5% earnings, withdraw) ──────
function ReferralsPanel({D,dark,user,profile,refLink,refCopied,setRefCopied}){
  const [clicks,setClicks]=useState(null);
  const [referred,setReferred]=useState(null);
  const [showWithdraw,setShowWithdraw]=useState(false);
  const [amount,setAmount]=useState("");
  const [method,setMethod]=useState("bank");
  const [bankCountry,setBankCountry]=useState("nigeria");
  const [bankName,setBankName]=useState("");
  const [acctName,setAcctName]=useState("");
  const [acctNumber,setAcctNumber]=useState("");
  const [usdtNetwork,setUsdtNetwork]=useState("tron");
  const [usdtAddress,setUsdtAddress]=useState("");
  const [submitting,setSubmitting]=useState(false);
  const [msg,setMsg]=useState(null);
  const [myRequests,setMyRequests]=useState(null);

  useEffect(()=>{
    if(!window._fb||!user)return;
    const {db,collection,getDocs,query,where,collectionGroup,onSnapshot}=window._fb;
    // Clicks
    getDocs(query(collection(db,"referralClicks"),where("referrerUid","==",user.uid))).then(snap=>setClicks(snap.size)).catch(e=>{console.error(e);setClicks(0);});
    // People referred (signups) — relies on Firestore rules allowing each
    // user to read profile docs where referredBy == their own uid.
    getDocs(query(collectionGroup(db,"profile"),where("referredBy","==",user.uid))).then(snap=>{
      setReferred(snap.docs.map(d=>({uid:d.ref.parent.parent.id,...d.data()})));
    }).catch(e=>{console.error(e);setReferred([]);});
    // My withdraw requests
    const unsub2=onSnapshot(collection(db,"users",user.uid,"referralWithdrawals"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()}));
      list.sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""));
      setMyRequests(list);
    },e=>{console.error(e);setMyRequests([]);});
    return()=>{unsub2();};
  },[user]);

  const signups=referred?referred.length:0;
  const paid=referred?referred.filter(r=>r.referralRewarded).length:0;
  const totalEarned=parseFloat(profile?.referralEarningsTotal)||0;
  const totalWithdrawn=(myRequests||[]).filter(r=>r.status==="paid").reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const pendingWithdraw=(myRequests||[]).filter(r=>r.status==="pending").reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const availableToWithdraw=Math.max(0,totalEarned-totalWithdrawn-pendingWithdraw);

  const inp=(extra={})=>({width:"100%",fontSize:13,padding:"10px 12px",border:`1px solid ${D.border}`,borderRadius:8,background:D.statBg,color:D.text,outline:"none",boxSizing:"border-box",...extra});
  const lbl={fontSize:11,color:D.text3,fontWeight:700,marginBottom:5,display:"block"};

  async function submitWithdraw(){
    setMsg(null);
    const amt=parseFloat(amount);
    if(!amt||amt<=0){setMsg({ok:false,msg:"Enter a valid amount."});return;}
    if(amt>availableToWithdraw){setMsg({ok:false,msg:`You can withdraw up to $${availableToWithdraw.toFixed(2)}.`});return;}
    const payout=method==="bank"?{type:"bank",country:bankCountry,bankName,acctName,acctNumber}:{type:"usdt",network:usdtNetwork,address:usdtAddress};
    if(method==="bank"&&(!bankName||!acctName||!acctNumber)){setMsg({ok:false,msg:"Fill in all bank details."});return;}
    if(method==="usdt"&&!usdtAddress){setMsg({ok:false,msg:"Enter your USDT wallet address."});return;}
    setSubmitting(true);
    try{
      const {db,collection,addDoc}=window._fb;
      await addDoc(collection(db,"users",user.uid,"referralWithdrawals"),{amount:amt,payout,requesterName:user.displayName||"",requesterEmail:user.email,status:"pending",requestedAt:new Date().toISOString()});
      setMsg({ok:true,msg:"Withdrawal requested! We'll process it and pay you directly — message us on WhatsApp if it's urgent."});
      setAmount("");
    }catch(e){console.error(e);setMsg({ok:false,msg:"Couldn't submit. Check your connection and try again."});}
    setSubmitting(false);
  }

  return(
    <div>
      <div style={{fontSize:16,fontWeight:800,color:D.text,marginBottom:6}}>🎁 Refer & Earn</div>
      <div style={{fontSize:12,color:D.text3,marginBottom:20,lineHeight:1.6}}>Share your link below. You earn <b style={{color:D.text}}>5% of every payment</b> from people you refer, plus <b style={{color:D.text}}>15 free days</b> if you're on Monthly or Trial.</div>

      <div style={{marginBottom:6,fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em"}}>Your Referral Link</div>
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200,padding:"11px 13px",borderRadius:9,border:`1px solid ${D.border}`,background:D.statBg,color:D.text,fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{refLink}</div>
        <button onClick={()=>{navigator.clipboard.writeText(refLink);setRefCopied(true);setTimeout(()=>setRefCopied(false),2000);}} style={{padding:"11px 18px",border:"none",borderRadius:9,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{refCopied?"✓ Copied":"Copy Link"}</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:18}}>
        <div style={{padding:"12px 10px",borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`,textAlign:"center"}}><div style={{fontSize:9,color:D.text3,textTransform:"uppercase",marginBottom:3}}>Clicks</div><div style={{fontSize:18,fontWeight:800,color:D.text}}>{clicks===null?"…":clicks}</div></div>
        <div style={{padding:"12px 10px",borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`,textAlign:"center"}}><div style={{fontSize:9,color:D.text3,textTransform:"uppercase",marginBottom:3}}>Signups</div><div style={{fontSize:18,fontWeight:800,color:D.text}}>{referred===null?"…":signups}</div></div>
        <div style={{padding:"12px 10px",borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`,textAlign:"center"}}><div style={{fontSize:9,color:D.text3,textTransform:"uppercase",marginBottom:3}}>Paid</div><div style={{fontSize:18,fontWeight:800,color:"#1D9E75"}}>{referred===null?"…":paid}</div></div>
      </div>

      <div style={{padding:"16px 18px",borderRadius:12,background:dark?"#0a2a1a":"#eafaf1",border:"1px solid #1D9E7540",marginBottom:18}}>
        <div style={{fontSize:11,color:"#0f6e56",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>5% Earnings Available</div>
        <div style={{fontSize:24,fontWeight:800,color:"#0f6e56",marginBottom:10}}>${availableToWithdraw.toFixed(2)}</div>
        <div style={{fontSize:11,color:D.text3,marginBottom:12}}>Total earned: ${totalEarned.toFixed(2)} · Withdrawn: ${totalWithdrawn.toFixed(2)}{pendingWithdraw>0?` · Pending: $${pendingWithdraw.toFixed(2)}`:""}</div>
        <button onClick={()=>{setShowWithdraw(v=>!v);setMsg(null);}} disabled={availableToWithdraw<=0} style={{padding:"10px 20px",border:"none",borderRadius:9,background:availableToWithdraw>0?"#1D9E75":D.border,color:"#fff",fontSize:13,fontWeight:700,cursor:availableToWithdraw>0?"pointer":"not-allowed"}}>{showWithdraw?"Cancel":"💵 Withdraw"}</button>
      </div>

      {showWithdraw&&(
        <div style={{padding:"18px",borderRadius:12,background:D.card,border:`1px solid ${D.border}`,marginBottom:18}}>
          <div style={{marginBottom:14}}>
            <label style={lbl}>Amount ($)</label>
            <input style={inp()} type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder={`Up to ${availableToWithdraw.toFixed(2)}`}/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={lbl}>Payout Method</label>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setMethod("bank")} style={{flex:1,padding:"10px",border:`2px solid ${method==="bank"?"#2563EB":D.border}`,borderRadius:9,background:method==="bank"?"#2563EB18":"transparent",color:method==="bank"?"#2563EB":D.text2,fontSize:12,fontWeight:700,cursor:"pointer"}}>🏦 Bank Account</button>
              <button onClick={()=>setMethod("usdt")} style={{flex:1,padding:"10px",border:`2px solid ${method==="usdt"?"#2563EB":D.border}`,borderRadius:9,background:method==="usdt"?"#2563EB18":"transparent",color:method==="usdt"?"#2563EB":D.text2,fontSize:12,fontWeight:700,cursor:"pointer"}}>₮ USDT Wallet</button>
            </div>
          </div>
          {method==="bank"?(
            <>
              <div style={{marginBottom:12}}>
                <label style={lbl}>Bank Country</label>
                <select style={inp()} value={bankCountry} onChange={e=>setBankCountry(e.target.value)}>
                  <option value="nigeria">Nigeria</option>
                  <option value="us">United States</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div style={{marginBottom:12}}><label style={lbl}>Bank Name</label><input style={inp()} value={bankName} onChange={e=>setBankName(e.target.value)} placeholder={bankCountry==="us"?"e.g. Chase, Bank of America":"e.g. GTBank, Access Bank"}/></div>
              <div style={{marginBottom:12}}><label style={lbl}>Account Name</label><input style={inp()} value={acctName} onChange={e=>setAcctName(e.target.value)} placeholder="Name on the account"/></div>
              <div style={{marginBottom:14}}><label style={lbl}>{bankCountry==="us"?"Account Number (+ Routing Number)":"Account Number"}</label><input style={inp()} value={acctNumber} onChange={e=>setAcctNumber(e.target.value)} placeholder={bankCountry==="us"?"Account # — add routing # in notes if needed":"10-digit account number"}/></div>
            </>
          ):(
            <>
              <div style={{marginBottom:12}}>
                <label style={lbl}>Network</label>
                <select style={inp()} value={usdtNetwork} onChange={e=>setUsdtNetwork(e.target.value)}>
                  <option value="tron">USDT (TRC20 — Tron)</option>
                  <option value="erc20">USDT (ERC20 — Ethereum)</option>
                  <option value="bep20">USDT (BEP20 — BNB Smart Chain)</option>
                </select>
              </div>
              <div style={{marginBottom:14}}><label style={lbl}>Wallet Address</label><input style={inp()} value={usdtAddress} onChange={e=>setUsdtAddress(e.target.value)} placeholder="Paste your wallet address"/></div>
            </>
          )}
          {msg&&(<div style={{marginBottom:12,padding:"10px 13px",borderRadius:9,fontSize:12,fontWeight:600,background:msg.ok?(dark?"#0a2a1a":"#eafaf1"):(dark?"#2a0a0a":"#fdeeee"),color:msg.ok?"#0f6e56":"#993c1d"}}>{msg.msg}</div>)}
          <button onClick={submitWithdraw} disabled={submitting} style={{width:"100%",padding:"12px",border:"none",borderRadius:9,background:"#1D9E75",color:"#fff",fontSize:14,fontWeight:700,cursor:submitting?"not-allowed":"pointer",opacity:submitting?0.6:1}}>{submitting?"Submitting...":"Submit Withdrawal Request"}</button>
        </div>
      )}

      {myRequests&&myRequests.length>0&&(
        <div style={{marginBottom:18}}>
          <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Your Withdrawal Requests</div>
          {myRequests.map(r=>(
            <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:D.statBg,border:`1px solid ${D.statBorder}`,borderRadius:9,marginBottom:6,gap:10,flexWrap:"wrap"}}>
              <div><div style={{fontSize:13,fontWeight:700,color:D.text}}>${parseFloat(r.amount).toFixed(2)}</div><div style={{fontSize:10.5,color:D.text3}}>{r.requestedAt&&new Date(r.requestedAt).toLocaleDateString()}</div></div>
              <span style={{fontSize:10,fontWeight:800,color:"#fff",background:r.status==="paid"?"#1D9E75":"#D97706",padding:"3px 9px",borderRadius:20}}>{r.status==="paid"?"Paid":"Pending"}</span>
            </div>
          ))}
        </div>
      )}

      {referred&&referred.length>0&&(
        <div>
          <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>People You Referred</div>
          {referred.map(r=>(
            <div key={r.uid} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:D.statBg,border:`1px solid ${D.statBorder}`,borderRadius:9,marginBottom:6,gap:10,flexWrap:"wrap"}}>
              <div><div style={{fontSize:13,fontWeight:700,color:D.text}}>{r.name||"(no name)"}</div><div style={{fontSize:10.5,color:D.text3}}>{r.email}</div></div>
              <span style={{fontSize:10,fontWeight:800,color:"#fff",background:r.referralRewarded?"#1D9E75":"#888",padding:"3px 9px",borderRadius:20}}>{r.referralRewarded?"Paid":"Not Paid Yet"}</span>
            </div>
          ))}
        </div>
      )}

      <div style={{marginTop:18,fontSize:11,color:D.text3,textAlign:"center"}}>Forgot to get paid, or need it urgently? Message us on <a href="https://wa.me/2347056908596" target="_blank" style={{color:"#25D366",fontWeight:700,textDecoration:"none"}}>WhatsApp</a>.</div>
    </div>
  );
}

function SettingsModal({D,dark,user,profile,onSaveProfile,onChangePassword,onSetNewPassword,onChangeEmail,initialTab,onClose}){
  const [tab,setTab]=useState(initialTab||"personal");
  const [name,setName]=useState(profile?.name||user?.displayName||"");
  const [phone,setPhone]=useState(profile?.phone||"");
  const [savingProfile,setSavingProfile]=useState(false);
  const [profileMsg,setProfileMsg]=useState(null);

  const [showPwForm,setShowPwForm]=useState(false);
  const [curPw,setCurPw]=useState("");
  const [newPw,setNewPw]=useState("");
  const [pwBusy,setPwBusy]=useState(false);
  const [pwMsg,setPwMsg]=useState(null);

  const [showSetPwForm,setShowSetPwForm]=useState(false);
  const [setPw1,setSetPw1]=useState("");
  const [setPw2,setSetPw2]=useState("");
  const [settingPwBusy,setSetPwBusy]=useState(false);
  const [settingPwMsg,setSetPwMsg]=useState(null);

  const [showEmailForm,setShowEmailForm]=useState(false);
  const [curPw2,setCurPw2]=useState("");
  const [newEmail,setNewEmail]=useState("");
  const [emailBusy,setEmailBusy]=useState(false);
  const [emailMsg,setEmailMsg]=useState(null);

  const [refCopied,setRefCopied]=useState(false);
  const refLink=user?.uid?`${window.location.origin}${window.location.pathname}?ref=${user.uid}`:"";

  useEffect(()=>{setName(profile?.name||user?.displayName||"");setPhone(profile?.phone||"");},[profile,user]);

  const hasPasswordProvider=(user?.providerData||[]).some(p=>p.providerId==="password");

  function maskEmail(e){if(!e)return"";const parts=e.split("@");if(parts.length<2)return e;const u=parts[0];return u.slice(0,2)+"•••"+u.slice(-1)+"@"+parts[1];}

  async function submitProfile(){
    setSavingProfile(true);setProfileMsg(null);
    const r=await onSaveProfile(name.trim(),phone.trim());
    setProfileMsg(r);
    setSavingProfile(false);
  }
  async function submitPw(){
    if(!curPw||!newPw){setPwMsg({ok:false,msg:"Fill in both fields."});return;}
    if(newPw.length<6){setPwMsg({ok:false,msg:"New password must be at least 6 characters."});return;}
    setPwBusy(true);setPwMsg(null);
    const r=await onChangePassword(curPw,newPw);
    setPwMsg(r);setPwBusy(false);
    if(r.ok){setCurPw("");setNewPw("");setShowPwForm(false);}
  }
  async function submitSetPw(){
    if(!setPw1||!setPw2){setSetPwMsg({ok:false,msg:"Fill in both fields."});return;}
    if(setPw1.length<6){setSetPwMsg({ok:false,msg:"Password must be at least 6 characters."});return;}
    if(setPw1!==setPw2){setSetPwMsg({ok:false,msg:"Passwords do not match."});return;}
    setSetPwBusy(true);setSetPwMsg(null);
    const r=await onSetNewPassword(setPw1);
    setSetPwMsg(r);setSetPwBusy(false);
    if(r.ok){setSetPw1("");setSetPw2("");}
  }
  async function submitEmail(){
    if(!newEmail){setEmailMsg({ok:false,msg:"Enter the new email."});return;}
    if(hasPasswordProvider&&!curPw2){setEmailMsg({ok:false,msg:"Enter your current password."});return;}
    setEmailBusy(true);setEmailMsg(null);
    const r=await onChangeEmail(curPw2,newEmail);
    setEmailMsg(r);setEmailBusy(false);
    if(r.ok){setCurPw2("");setNewEmail("");setShowEmailForm(false);}
  }

  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)",padding:16};
  const inp=(extra={})=>({width:"100%",fontSize:13,padding:"9px 11px",border:`1px solid ${D.inputBorder}`,borderRadius:8,background:D.inputBg,color:D.text,outline:"none",boxSizing:"border-box",...extra});
  const msgBox=m=>(<div style={{marginBottom:12,padding:"9px 12px",borderRadius:8,fontSize:12,fontWeight:600,background:m.ok?(dark?"#0a2a1a":"#eafaf1"):(dark?"#2a0a0a":"#fdeeee"),color:m.ok?"#0f6e56":"#993c1d"}}>{m.msg}</div>);

  return(
    <div style={overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:D.card,borderRadius:16,padding:"26px",width:"100%",maxWidth:560,maxHeight:"88vh",overflowY:"auto",border:`1px solid ${D.border}`,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",boxSizing:"border-box"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <div style={{fontSize:20,fontWeight:800,color:D.text}}>Settings</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:20,cursor:"pointer",color:D.text3}}>✕</button>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:24,flexWrap:"wrap"}}>
          <button onClick={()=>setTab("personal")} style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",border:`1.5px solid ${tab==="personal"?D.navActive:D.border}`,background:tab==="personal"?D.navActive:"transparent",color:tab==="personal"?D.navActiveTxt:D.text2,transition:"all 0.15s"}}>Personal Data</button>
          <button onClick={()=>setTab("security")} style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",border:`1.5px solid ${tab==="security"?D.navActive:D.border}`,background:tab==="security"?D.navActive:"transparent",color:tab==="security"?D.navActiveTxt:D.text2,transition:"all 0.15s"}}>Security Settings</button>
          <button onClick={()=>setTab("referrals")} style={{padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",border:`1.5px solid ${tab==="referrals"?D.navActive:D.border}`,background:tab==="referrals"?D.navActive:"transparent",color:tab==="referrals"?D.navActiveTxt:D.text2,transition:"all 0.15s"}}>Referrals</button>
        </div>

        {tab==="personal"&&(
          <div>
            <div style={{fontSize:11,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:16}}>Personal Data</div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>Full Name</div>
              <input style={inp()} value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name"/>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>Phone Number</div>
              <input style={inp()} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="e.g. +234 800 000 0000"/>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>Email</div>
              <div style={{...inp(),background:D.statBg,color:D.text3}}>{user?.email}</div>
            </div>
            {profileMsg&&msgBox(profileMsg)}
            <button onClick={submitProfile} disabled={savingProfile} style={{padding:"12px 22px",border:"none",borderRadius:10,background:D.navActive,color:D.navActiveTxt,fontSize:14,fontWeight:800,cursor:savingProfile?"not-allowed":"pointer",opacity:savingProfile?0.6:1}}>{savingProfile?"Saving...":"Save Changes"}</button>
          </div>
        )}

        {tab==="security"&&(
          <div>
            <div style={{fontSize:16,fontWeight:800,color:D.text,marginBottom:6}}>Authorization</div>
            <div style={{fontSize:12,color:D.text3,marginBottom:20,lineHeight:1.5}}>Information for logging in to your account. Change your password whenever you think it might have been compromised.</div>

            {!hasPasswordProvider&&(<div style={{padding:"12px 16px",borderRadius:9,background:D.statBg,border:`1px solid ${D.border}`,fontSize:12,color:D.text3,marginBottom:16,lineHeight:1.5}}>You signed in with Google. Set a password below to also be able to sign in with your email and a password.</div>)}

            <div style={{borderTop:`1px solid ${D.border}`}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 0",borderBottom:`1px solid ${D.border}`,flexWrap:"wrap",gap:10}}>
                <div>
                  <div style={{fontSize:12,color:D.text3,marginBottom:4}}>Email</div>
                  <div style={{fontSize:14,fontWeight:600,color:D.text}}>{maskEmail(user?.email)}</div>
                </div>
                <button onClick={()=>{setShowEmailForm(v=>!v);setEmailMsg(null);}} style={{padding:"8px 16px",border:`1px solid ${D.border}`,borderRadius:8,background:"transparent",color:D.text2,fontSize:12,fontWeight:700,cursor:"pointer"}}>{showEmailForm?"Cancel":"Change"}</button>

                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:D.text3,marginBottom:5}}>New Password</div><input type="password" style={inp()} value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="At least 6 characters"/></div>
                  {pwMsg&&msgBox(pwMsg)}
