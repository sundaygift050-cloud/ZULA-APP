}


function CalendarView({D,dark,accounts,allAccTrades,calMi,calYear,setCalMonth,selDay,setSelDay,today,daysInMonth}){
  const [scope,setScope]=useState("all");
  const trades=scope==="all"?accounts.flatMap(a=>allAccTrades(a.id).map(t=>({...t,_accName:a.name,_currency:a.currency}))):allAccTrades(scope).map(t=>({...t,_accName:(accounts.find(a=>a.id===scope)||{}).name,_currency:(accounts.find(a=>a.id===scope)||{}).currency}));
  // If every account shares one currency (or a specific account is selected),
  // show that symbol. With mixed currencies across "All Accounts" there's no
  // single correct symbol without a conversion rate, so fall back to USD.
  const displayCurrency=scope!=="all"?(accounts.find(a=>a.id===scope)||{}).currency:(accounts.length>0&&accounts.every(a=>(a.currency||"USD")===(accounts[0].currency||"USD"))?accounts[0].currency:"USD");
  const monthTrades=trades.filter(t=>{if(!t.date)return false;const d=new Date(t.date+"T00:00:00");return d.getFullYear()===calYear&&d.getMonth()===calMi;});
  const mWins=monthTrades.filter(t=>t.result==="win").length;
  const mLosses=monthTrades.filter(t=>t.result==="loss").length;
  const mClosed=mWins+mLosses;
  const mWinRate=mClosed>0?Math.round(mWins/mClosed*100):0;
  const mNetPnl=monthTrades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);

  const monthStart=new Date(calYear,calMi,1);
  let startDow=monthStart.getDay();
  startDow=startDow===0?6:startDow-1;
  const cells=[];
  for(let i=startDow;i>0;i--)cells.push(new Date(calYear,calMi,1-i));
  for(let d=1;d<=daysInMonth;d++)cells.push(new Date(calYear,calMi,d));
  let trail=1;
  while(cells.length%7!==0){cells.push(new Date(calYear,calMi,daysInMonth+trail));trail++;}
  const weeks=[];
  for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));

  function dayColor(ts){
    if(!ts.length)return null;
    const w=ts.filter(t=>t.result==="win").length;
    const l=ts.filter(t=>t.result==="loss").length;
    const be=ts.filter(t=>t.result==="be").length;
    if(w>0||l>0)return w>=l?"win":"loss";
    if(be>0)return"be";
    return null;
  }

  const weekRows=weeks.map(week=>{
    const days=week.map(dt=>{
      const inMonth=dt.getMonth()===calMi;
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
      const dayTrades=trades.filter(t=>t.date===ds);
      const isToday=today.getFullYear()===dt.getFullYear()&&today.getMonth()===dt.getMonth()&&today.getDate()===dt.getDate();
      const isSel=selDay===ds;
      const dc=dayColor(dayTrades);
      const dayPnl=dayTrades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
      const w=dayTrades.filter(t=>t.result==="win").length;
      const l=dayTrades.filter(t=>t.result==="loss").length;
      return{date:dt,inMonth,ds,dayTrades,isToday,isSel,dc,dayPnl,w,l};
    });
    const weekPnl=days.reduce((s,d)=>s+d.dayPnl,0);
    const weekTradeCount=days.reduce((s,d)=>s+d.dayTrades.length,0);
    return{days,weekPnl,weekTradeCount};
  });

  function cellBg(dc){
    if(dc==="win")return dark?"rgba(34,197,94,0.16)":"rgba(34,197,94,0.10)";
    if(dc==="loss")return dark?"rgba(239,68,68,0.16)":"rgba(239,68,68,0.10)";
    if(dc==="be")return dark?"rgba(217,119,6,0.16)":"rgba(217,119,6,0.10)";
    return D.card;
  }
  function dotColor(dc){return dc==="win"?"#22C55E":dc==="loss"?"#EF4444":dc==="be"?"#D97706":D.text3;}

  const selDayTrades=selDay?trades.filter(t=>t.date===selDay):[];
  const selBg={background:dark?"#1a1a1a":"#ffffff",color:dark?"#f0f0f0":"#111111"};

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:18}}>
        <div>
          <div style={{fontSize:24,fontWeight:800,color:D.text}}>Calendar View</div>
          <div style={{fontSize:13,color:D.text3,marginTop:2}}>Monthly trade overview with daily P&L and weekly summaries</div>
        </div>
        <select value={scope} onChange={e=>setScope(e.target.value)} style={{padding:"9px 14px",borderRadius:9,border:`1px solid ${D.border}`,background:D.card,color:D.text,fontSize:12.5,fontWeight:700,outline:"none",colorScheme:dark?"dark":"light"}}>
          <option style={selBg} value="all">All Accounts</option>
          {accounts.map(a=>(<option style={selBg} key={a.id} value={a.id}>{a.name}</option>))}
        </select>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:20}}>
        {[
          {l:"Trades",v:monthTrades.length,c:D.text},
          {l:"Wins",v:mWins,c:"#22C55E"},
          {l:"Losses",v:mLosses,c:"#EF4444"},
          {l:"Win Rate",v:mWinRate+"%",c:mWinRate>=50?"#22C55E":"#EF4444"},
          {l:"Net P&L",v:fmtMoney(mNetPnl,displayCurrency,{sign:true,decimals:0}),c:mNetPnl>=0?"#22C55E":"#EF4444"},
        ].map(s=>(
          <div key={s.l} style={{background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:13,border:`1px solid ${D.border}`,padding:"14px 16px"}}>
            <div style={{fontSize:11,color:D.text3,fontWeight:700,marginBottom:6}}>{s.l}</div>
            <div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.v}</div>
          </div>
        ))}
      </div>

      <div style={{background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:14,border:`1px solid ${D.border}`,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",borderBottom:`1px solid ${D.border}`}}>
          <button onClick={()=>setCalMonth(new Date(calYear,calMi-1,1))} style={{border:"none",background:"none",color:D.text2,fontSize:18,cursor:"pointer",padding:"2px 8px"}}>‹</button>
          <span style={{fontSize:16,fontWeight:700,color:D.text}}>{MONTHS[calMi]} {calYear}</span>
          <button onClick={()=>setCalMonth(new Date(calYear,calMi+1,1))} style={{border:"none",background:"none",color:D.text2,fontSize:18,cursor:"pointer",padding:"2px 8px"}}>›</button>
        </div>
        <div style={{overflowX:"auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(90px,1fr)) minmax(100px,120px)",borderBottom:`1px solid ${D.border}`,minWidth:820}}>
          {["MON","TUE","WED","THU","FRI","SAT","SUN","WEEK P&L"].map(d=>(
            <div key={d} style={{padding:"10px 8px",textAlign:d==="WEEK P&L"?"right":"center",fontSize:10,fontWeight:700,color:D.text3,letterSpacing:"0.05em"}}>{d}</div>
          ))}
        </div>
        {weekRows.map((wk,wi)=>(
          <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(90px,1fr)) minmax(100px,120px)",borderBottom:wi<weekRows.length-1?`1px solid ${D.border}`:"none",minWidth:820}}>
            {wk.days.map((d,di)=>(
              <div key={di} onClick={()=>d.dayTrades.length>0&&setSelDay(d.isSel?null:d.ds)} style={{minHeight:78,padding:"8px 10px",background:d.inMonth?cellBg(d.dc):"transparent",borderRight:`1px solid ${D.border}`,cursor:d.dayTrades.length>0?"pointer":"default",opacity:d.inMonth?1:0.35,position:"relative",outline:d.isSel?`2px solid #2563EB`:"none",outlineOffset:-2}}>
                {d.isToday?(
                  <div style={{width:22,height:22,borderRadius:"50%",background:"#2563EB",color:"#fff",fontSize:12,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{d.date.getDate()}</div>
                ):(
                  <div style={{fontSize:12.5,fontWeight:600,color:d.inMonth?D.text2:D.text3}}>{d.date.getDate()}</div>
                )}
                {d.dayTrades.length>0&&(
                  <div style={{marginTop:6}}>
                    <div style={{fontSize:12.5,fontWeight:800,color:d.dayPnl>0?"#22C55E":d.dayPnl<0?"#EF4444":D.text3}}>{fmtMoney(d.dayPnl,displayCurrency,{sign:true,decimals:0})}</div>
                    <div style={{display:"flex",gap:5,marginTop:2}}>
                      {d.w>0&&<span style={{fontSize:9.5,fontWeight:700,color:"#22C55E"}}>{d.w}W</span>}
                      {d.l>0&&<span style={{fontSize:9.5,fontWeight:700,color:"#EF4444"}}>{d.l}L</span>}
                    </div>
                    <span style={{position:"absolute",bottom:8,right:8,width:6,height:6,borderRadius:"50%",background:dotColor(d.dc)}}/>
                  </div>
                )}
              </div>
            ))}
            <div style={{minHeight:78,padding:"8px 10px",textAlign:"right",display:"flex",flexDirection:"column",justifyContent:"center"}}>
              {wk.weekTradeCount>0?(<>
                <div style={{fontSize:14,fontWeight:800,color:wk.weekPnl>0?"#22C55E":wk.weekPnl<0?"#EF4444":D.text3}}>{fmtMoney(wk.weekPnl,displayCurrency,{sign:true,decimals:0})}</div>
                <div style={{fontSize:10.5,color:D.text3,marginTop:2}}>{wk.weekTradeCount} trade{wk.weekTradeCount!==1?"s":""}</div>
              </>):(<div style={{fontSize:14,color:D.text3}}>—</div>)}
            </div>
          </div>
        ))}
        </div>
      </div>

      <div style={{display:"flex",gap:20,marginTop:14,flexWrap:"wrap",fontSize:11.5,color:D.text3,alignItems:"center"}}>
        <span style={{fontWeight:700,color:D.text2}}>Legend:</span>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:9,height:9,borderRadius:"50%",background:"#22C55E"}}/>Profitable day</span>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:9,height:9,borderRadius:"50%",background:"#EF4444"}}/>Loss day</span>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:9,height:9,borderRadius:"50%",background:"#D97706"}}/>Breakeven</span>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:9,height:9,borderRadius:"50%",background:D.text3}}/>No trades</span>
      </div>

      {selDay&&selDayTrades.length>0&&(
        <div style={{marginTop:16,border:`1px solid ${D.border}`,borderRadius:12,padding:"16px",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)"}}>
          <div style={{fontSize:13,fontWeight:700,color:D.text,marginBottom:12}}>{new Date(selDay+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
          {selDayTrades.map((t,i)=>{
            const rc=RC[t.result]||{bg:"#eee",c:"#888"};
            return(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:D.statBg,borderRadius:8,marginBottom:6,flexWrap:"wrap"}}>
                <span style={{fontSize:12.5,fontWeight:700,color:D.text}}>{t.pair||"—"}</span>
                {t._accName&&<span style={{fontSize:10.5,color:D.text3}}>{t._accName}</span>}
                {t.setup&&<span style={{fontSize:10.5,padding:"2px 7px",borderRadius:5,background:D.card2,border:`1px solid ${D.border}`,color:D.text3}}>{t.setup}</span>}
                <span style={{fontSize:10.5,fontWeight:800,padding:"2px 8px",borderRadius:20,background:rc.bg,color:rc.c}}>{RESULT_LABELS[t.result]||t.result}</span>
                {t.pnl&&<span style={{fontSize:12,fontWeight:700,marginLeft:"auto",color:parseFloat(t.pnl)>=0?"#22C55E":"#EF4444"}}>{fmtMoney(t.pnl,t._currency,{sign:true})}</span>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App(){
  const [fbReady,setFbReady]=useState(!!window._fb);
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(false);
  const [authError,setAuthError]=useState("");
  const [emailVerified,setEmailVerified]=useState(true);
  const [approved,setApproved]=useState(true);
  const [trialEligible,setTrialEligible]=useState(false);
  const [isAdmin,setIsAdmin]=useState(false);
  const [dataLoading,setDataLoading]=useState(false);
  const [store,setStoreRaw]=useState(emptyStore());
  const saveTimeout=useRef(null);
  const pendingSaveRef=useRef(null);
  const [saveError,setSaveError]=useState(null);
  const [publicView,setPublicView]=useState("landing");

  function stripUndefined(val){
    if(Array.isArray(val))return val.map(stripUndefined);
    if(val&&typeof val==="object"&&!(val instanceof Date)){
      const out={};
      for(const k of Object.keys(val)){
        if(val[k]===undefined)continue;
        out[k]=stripUndefined(val[k]);
      }
      return out;
    }
    return val;
  }

  function flushSave(){
    if(!pendingSaveRef.current||!user||!window._fb)return Promise.resolve(false);
    clearTimeout(saveTimeout.current);
    const {db,doc,setDoc}=window._fb;
    const dataToSave=pendingSaveRef.current;
    pendingSaveRef.current=null;
    try{
      return setDoc(doc(db,"users",user.uid,"data","journal"),stripUndefined(dataToSave))
        .then(()=>{setSaveError(null);return true;})
        .catch(e=>{
          console.error(e);
          pendingSaveRef.current=dataToSave;
          setSaveError(e&&e.code==="invalid-argument"?"Your journal is too large to save (usually caused by chart images) — remove an old image and try again.":"Your last changes couldn't be saved. Check your internet connection.");
          return false;
        });
    }catch(e){
      console.error(e);
      pendingSaveRef.current=dataToSave;
      setSaveError("Your last changes couldn't be saved due to a data error. Please try again — if this keeps happening, use the Reload App button.");
      return Promise.resolve(false);
    }
  }

  const [compressing,setCompressing]=useState(false);
  async function compressAndRetrySave(){
    if(!user||!window._fb)return;
    setCompressing(true);
    try{
      const next=JSON.parse(JSON.stringify(store));
      let storageFailed=false;
      const accIds=Object.keys(next.trades||{});
      for(const accId of accIds){
        const weeks=next.trades[accId]||{};
        for(const wk of Object.keys(weeks)){
          const arr=weeks[wk]||[];
          for(let i=0;i<arr.length;i++){
            for(const field of ["imgBefore","imgAfter"]){
              const val=arr[i][field];
              if(!val||typeof val!=="string"||!val.startsWith("data:image"))continue;
              try{
                const small=await compressDataUrl(val,1400,0.8);
                arr[i][field]=await uploadImageToCloudinary(small);
              }catch(uploadErr){
                console.error(uploadErr);
                storageFailed=true;
                arr[i][field]=await compressDataUrl(val,500,0.4);
              }
            }
          }
        }
      }
      setStoreRaw(next);
      pendingSaveRef.current=next;
      const ok=await flushSave();
      if(!ok){
        setSaveError("Your journal is still too large even after processing every image. Open Chart Images and delete one or two old screenshots you no longer need, then try again.");
      }else if(storageFailed){
        setSaveError("Saved for now, but Cloudinary isn't set up correctly, so images were only compressed rather than moved off Firestore — this can happen again. Double-check CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET so it's fixed for good.");
      }
    }catch(e){
      console.error(e);
      setSaveError("Couldn't process your images automatically. Try opening Chart Images and manually removing one old screenshot, then refresh.");
    }
    setCompressing(false);
  }

  useEffect(()=>{
    function onHide(){flushSave();}
    window.addEventListener("beforeunload",onHide);
    document.addEventListener("visibilitychange",onHide);
    return()=>{window.removeEventListener("beforeunload",onHide);document.removeEventListener("visibilitychange",onHide);};
  },[user]);

  useEffect(()=>{
    if(window._fb){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebase-ready",h);
    return()=>window.removeEventListener("firebase-ready",h);
  },[]);

  useEffect(()=>{
    try{
      const params=new URLSearchParams(window.location.search);
      const ref=params.get("ref");
      if(ref){
        sessionStorage.setItem("referredBy",ref);
        if(!sessionStorage.getItem("refClickLogged")&&window._fb){
          const {db,collection,addDoc}=window._fb;
          addDoc(collection(db,"referralClicks"),{referrerUid:ref,at:new Date().toISOString()}).catch(e=>console.error(e));
          sessionStorage.setItem("refClickLogged","1");
        }
      }
    }catch(e){}
  },[fbReady]);

  const loadedUidRef=useRef(null);
  useEffect(()=>{
    if(!fbReady||!window._fb)return;
    const {auth,onAuthStateChanged}=window._fb;
    return onAuthStateChanged(auth,async u=>{
      setUser(u);
      if(u){
        if(loadedUidRef.current===u.uid)return;
        loadedUidRef.current=u.uid;
        setDataLoading(true);
        const {db,doc,getDoc}=window._fb;
        const ref=doc(db,"users",u.uid,"data","journal");
        const snap=await getDoc(ref);
        if(snap.exists()){setStoreRaw(snap.data());}
        else{setStoreRaw(emptyStore());}
        setDataLoading(false);
      } else {
        loadedUidRef.current=null;
      }
    });
  },[fbReady]);

  function setStore(fn,immediate){
    setStoreRaw(prev=>{
      const next=typeof fn==="function"?fn(prev):fn;
      if(user&&window._fb){
        pendingSaveRef.current=next;
        clearTimeout(saveTimeout.current);
        if(immediate){flushSave();}
        else{saveTimeout.current=setTimeout(flushSave,800);}
      }
      return next;
    });
  }

  useEffect(()=>{
    if(!user){setEmailVerified(true);return;}
    const hasPwd=(user.providerData||[]).some(p=>p.providerId==="password");
    if(!hasPwd){setEmailVerified(true);return;}
    setEmailVerified(!!user.emailVerified);
  },[user]);

  async function checkVerified(){
    if(!window._fb)return{ok:false,msg:"Not ready, please try again."};
    try{
      const {auth}=window._fb;
      await auth.currentUser.reload();
      if(auth.currentUser.emailVerified){
        setEmailVerified(true);
        setUser({...auth.currentUser});
        return{ok:true,msg:"Verified!"};
      }
      return{ok:false,msg:"Not verified yet — open the email and click the link, then try again."};
    }catch(e){console.error(e);return{ok:false,msg:"Something went wrong. Please try again."};}
  }

  async function resendVerificationCode(){
    if(!window._fb)return{ok:false,msg:"Not ready, please try again."};
    try{
      const {auth,sendEmailVerification}=window._fb;
      await sendEmailVerification(auth.currentUser,{url:window.location.origin});
      return{ok:true,msg:"Verification email sent! Check your inbox (and spam folder)."};
    }catch(e){console.error(e);return{ok:false,msg:authErrMsg(e)};}
  }

  useEffect(()=>{
    if(!user){setApproved(true);setIsAdmin(false);return;}
    const admin=isAdminEmail(user.email);
    setIsAdmin(admin);
    if(admin){setApproved(true);return;}
    if(!window._fb)return;
    const {db,doc,onSnapshot}=window._fb;
    const unsub=onSnapshot(doc(db,"users",user.uid,"profile","main"),snap=>{
      const data=snap.exists()?snap.data():{};
      const active=data.approved===true&&!((data.planType==="monthly"||data.planType==="trial")&&data.expiresAt&&new Date(data.expiresAt).getTime()<Date.now());
      setApproved(active);
      setTrialEligible(!data.planType&&!data.approved);
    },err=>{console.error(err);});
    return()=>unsub();
  },[user]);

  async function startSelfTrial(){
    if(!window._fb||!user||!trialEligible)return{ok:false,msg:"Trial isn't available for this account."};
    try{
      const {db,doc,setDoc}=window._fb;
      const now=new Date();
      const exp=new Date(now);exp.setDate(exp.getDate()+14);
      await setDoc(doc(db,"users",user.uid,"profile","main"),{approved:true,planType:"trial",approvedAt:now.toISOString(),expiresAt:exp.toISOString()},{merge:true});
      return{ok:true};
    }catch(e){console.error(e);return{ok:false,msg:"Couldn't start your trial. Check your connection and try again."};}
  }

  async function rewardReferrerForPayment(referredBy,planType,referredUid){
    if(!window._fb||!referredBy)return;
    try{
      const {db,doc,getDoc,setDoc,collection,addDoc}=window._fb;
      const refDocRef=doc(db,"users",referredBy,"profile","main");
      const refSnap=await getDoc(refDocRef);
      if(!refSnap.exists())return;
      const refData=refSnap.data();
      const price=planType==="onetime"?49:planType==="monthly"?10:0;
      const earned=price*0.05;
      if(earned>0){
        await addDoc(collection(db,"users",referredBy,"referralEarnings"),{amount:earned,planType,referredUid,createdAt:new Date().toISOString()});
        const newTotal=(parseFloat(refData.referralEarningsTotal)||0)+earned;
        await setDoc(refDocRef,{referralEarningsTotal:newTotal},{merge:true});
      }
      if(refData.approved===true&&(refData.planType==="monthly"||refData.planType==="trial")){
        const base=refData.expiresAt&&new Date(refData.expiresAt).getTime()>Date.now()?new Date(refData.expiresAt):new Date();
        base.setDate(base.getDate()+15);
        await setDoc(refDocRef,{expiresAt:base.toISOString()},{merge:true});
      }
    }catch(e){console.error(e);}
  }

  async function handlePaystackPayment(planType){
    if(!window._fb||!user)return{ok:false,msg:"Not signed in."};
    const amountMinor=planType==="onetime"?ONE_TIME_PRICE_MINOR:MONTHLY_PRICE_MINOR;
    try{
      const response=await payWithPaystack({email:user.email,amountMinor,planType,metadata:{uid:user.uid}});
      const {db,doc,getDoc,setDoc,collection,addDoc}=window._fb;
      const now=new Date();
      const payload={approved:true,planType,approvedAt:now.toISOString()};
      if(planType==="monthly"){
        const exp=new Date(now);exp.setDate(exp.getDate()+30);
        payload.expiresAt=exp.toISOString();
      }else{
        payload.expiresAt=null;
      }
      const profileRef=doc(db,"users",user.uid,"profile","main");
      await setDoc(profileRef,payload,{merge:true});
      await addDoc(collection(db,"users",user.uid,"payments"),{amountMinor,currency:PAYSTACK_CURRENCY,planType,reference:response.reference,status:response.status||"success",paidAt:now.toISOString()});
      try{
        const profSnap=await getDoc(profileRef);
        const profData=profSnap.exists()?profSnap.data():{};
        if(profData.referredBy&&!profData.referralRewarded){
          await rewardReferrerForPayment(profData.referredBy,planType,user.uid);
          await setDoc(profileRef,{referralRewarded:true},{merge:true});
        }
      }catch(e){console.error(e);}
      return{ok:true};
    }catch(e){
      if(e&&e.message==="cancelled")return{ok:false,msg:"cancelled"};
      console.error(e);
      return{ok:false,msg:(e&&e.message)||"Payment couldn't be completed. Please try again."};
    }
  }

  async function handleLogin(){
    if(!window._fb)return;
    setAuthError("");
    setAuthLoading(true);
    try{
      const {auth,provider,signInWithPopup,db,doc,getDoc,setDoc}=window._fb;
      const result=await signInWithPopup(auth,provider);
      const ref=doc(db,"users",result.user.uid,"profile","main");
      const snap=await getDoc(ref);
      if(!snap.exists()){
        let referredBy=null;
        try{referredBy=sessionStorage.getItem("referredBy")||null;}catch(e){}
        if(referredBy===result.user.uid)referredBy=null;
        await setDoc(ref,{name:result.user.displayName||"",email:result.user.email,phone:"",createdAt:new Date().toISOString(),approved:isAdminEmail(result.user.email),referredBy,referralRewarded:false});
      }
    }
    catch(e){console.error(e);setAuthError(authErrMsg(e));}
    setAuthLoading(false);
  }

  async function handleEmailLogin(email,password){
    if(!window._fb)return;
    setAuthError("");
    setAuthLoading(true);
    try{
      const {auth,signInWithEmailAndPassword}=window._fb;
      await signInWithEmailAndPassword(auth,email,password);
    }catch(e){console.error(e);setAuthError(authErrMsg(e));}
    setAuthLoading(false);
  }

  async function handleForgotPassword(email){
    if(!window._fb)return{ok:false,msg:"Not ready, please try again."};
    try{
      const {auth,sendPasswordResetEmail}=window._fb;
      await sendPasswordResetEmail(auth,email,{url:window.location.origin});
      return{ok:true,msg:"Reset link sent! Check your inbox (and spam folder)."};
    }catch(e){console.error(e);return{ok:false,msg:authErrMsg(e)};}
  }

  async function handleEmailSignup(name,email,phone,password){
    if(!window._fb)return;
    setAuthError("");
    setAuthLoading(true);
    try{
      const {auth,createUserWithEmailAndPassword,updateProfile,db,doc,setDoc,sendEmailVerification}=window._fb;
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(cred.user,{displayName:name});
      let referredBy=null;
      try{referredBy=sessionStorage.getItem("referredBy")||null;}catch(e){}
      if(referredBy===cred.user.uid)referredBy=null;
      await setDoc(doc(db,"users",cred.user.uid,"profile","main"),{name,email,phone,createdAt:new Date().toISOString(),approved:isAdminEmail(email),referredBy,referralRewarded:false});
      try{await sendEmailVerification(cred.user,{url:window.location.origin});}catch(emailErr){console.error("Verification email failed to send:",emailErr);}
      setEmailVerified(false);
    }catch(e){console.error(e);setAuthError(authErrMsg(e));}
    setAuthLoading(false);
  }

  async function handleLogout(){
    if(!window._fb)return;
    const {auth,signOut}=window._fb;
    await signOut(auth);
    setStoreRaw(emptyStore());
  }

  function handleImport(){
    const OLD_KEYS=["tj_v10","tj_v11","tj_v12"];
    let found=null;
    for(const k of OLD_KEYS){try{const r=localStorage.getItem(k);if(r){found=JSON.parse(r);break;}}catch{}}
    if(found){setStore(found,true);alert("✅ Data imported successfully!");}
    else{alert("No old journal data found in this browser.");}
  }

  function handleExport(){
    const blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`trading-journal-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function handleImportFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{const data=JSON.parse(ev.target.result);setStore(data,true);alert("✅ Backup imported successfully!");}catch{alert("❌ Invalid file. Please use a valid journal backup.");}};
    r.readAsText(file);
  }

  if(!fbReady||authLoading||dataLoading){
    return(
      <div style={{minHeight:"100vh",background:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
        <div style={{fontSize:48}}>📊</div>
        <div style={{fontSize:16,color:"#888",fontFamily:"DM Sans,sans-serif"}}>{dataLoading?"Loading your data...":"Connecting..."}</div>
      </div>
    );
  }

  if(!user){
    if(publicView==="login"){
      return <LoginScreen onGoogleLogin={handleLogin} onEmailLogin={handleEmailLogin} onEmailSignup={handleEmailSignup} onForgotPassword={handleForgotPassword} loading={authLoading} authError={authError} onBack={()=>setPublicView("landing")}/>;
    }
    if(publicView==="terms"){return <LegalPage type="terms" onBack={()=>setPublicView("landing")}/>;}
    if(publicView==="privacy"){return <LegalPage type="privacy" onBack={()=>setPublicView("landing")}/>;}
    return <LandingPage onGetStarted={()=>setPublicView("login")} onShowTerms={()=>setPublicView("terms")} onShowPrivacy={()=>setPublicView("privacy")}/>;
  }

  if(!emailVerified){return <VerifyEmailScreen email={user.email} onCheck={checkVerified} onResend={resendVerificationCode} onSignOut={handleLogout}/>;}

  if(!approved){return <PendingApprovalScreen email={user.email} user={user} onSignOut={handleLogout} onStartTrial={startSelfTrial} trialEligible={trialEligible} onPaystackPay={handlePaystackPayment}/>;}

  return <Journal store={store} setStore={setStore} saveError={saveError} compressing={compressing} onCompressAndRetry={compressAndRetrySave} user={user} isAdmin={isAdmin} onLogout={handleLogout} onImport={handleImport} onExport={handleExport} onImportFile={handleImportFile}/>;
}

function PayoutsView({D,dark,user,isAdmin,accounts,allAccTrades,onWithdraw}){
  const [amount,setAmount]=useState("");
  const [accId,setAccId]=useState(accounts[0]?.id||"");
  const [submitting,setSubmitting]=useState(false);
  const [msg,setMsg]=useState(null);
  const [myHistory,setMyHistory]=useState(null);
  const [allHistory,setAllHistory]=useState(null);

  useEffect(()=>{
    if(!window._fb||!user)return;
    const {db,collection,onSnapshot}=window._fb;
    const unsub=onSnapshot(collection(db,"users",user.uid,"payouts"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()}));
      list.sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""));
      setMyHistory(list);
    },e=>console.error(e));
    return()=>unsub();
  },[user]);

  useEffect(()=>{
    if(!isAdmin||!window._fb)return;
    const {db,collectionGroup,onSnapshot}=window._fb;
    const unsub=onSnapshot(collectionGroup(db,"payouts"),snap=>{
      const list=snap.docs.map(d=>({id:d.id,uid:d.ref.parent.parent.id,...d.data()}));
      list.sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""));
      setAllHistory(list);
    },e=>console.error(e));
    return()=>unsub();
  },[isAdmin]);

  function saveAccount(acc){setStore(s=>{const ex=(s.accounts||[]).find(a=>a.id===acc.id);return{...s,accounts:ex?(s.accounts||[]).map(a=>a.id===acc.id?acc:a):[...(s.accounts||[]),acc]};},true);}
  function withdrawFromAccount(accId,amount){setStore(s=>({...s,accounts:(s.accounts||[]).map(a=>a.id===accId?{...a,balance:((parseFloat(a.balance)||0)-amount)}:a)}),true);}
  function deleteAccount(id){setStore(s=>{const{[id]:_,...rest}=s.trades||{};return{...s,accounts:(s.accounts||[]).filter(a=>a.id!==id),trades:rest};},true);if(activeAccId===id)setActiveAccId((accounts.find(a=>a.id!==id))||null);}

  function getAccTrades(accId){return store.trades?.[accId]||{};}
  function wk(){return weekKey(weekStart);}
  function weekTrades(){return getAccTrades(activeAccId)[wk()]||[];}
  function setWeekTrades(fn,immediate){if(!activeAccId)return;setStore(s=>{const acc=s.trades?.[activeAccId]||{};const cur=acc[wk()]||[];return{...s,trades:{...s.trades,[activeAccId]:{...acc,[wk()]:typeof fn==="function"?fn(cur):fn}}};},immediate);}
  function addTrade(){setWeekTrades(c=>[...c,emptyTrade()]);setTimeout(()=>setEditingTradeIdx(weekTrades().length),50);}
  function updateTrade(idx,field,val){setWeekTrades(c=>c.map((t,i)=>{
    if(i!==idx)return t;
    const u={...t,[field]:val};
    const riskAmt=parseFloat(field==="riskPct"?val:u.riskPct);
    const rr=parseFloat(field==="rr"?val:u.rr);
    if(field!=="pnl"&&riskAmt>0&&!isNaN(rr)){
      // Risk is a direct dollar amount (e.g. "100" = $100 risked on this trade).
      u.risk=riskAmt.toFixed(2);
      const result=field==="result"?val:u.result;
      // Always keep P&L in sync with Risk × R:R live, so the field never shows a
      // stale number. Loss = lose the risk amount. Breakeven = 0. Anything else
      // (win, or no result chosen yet) previews the win-case amount.
      let autoP;
      if(result==="loss")autoP=-riskAmt;
      else if(result==="be")autoP=0;
      else autoP=riskAmt*rr;
      u.pnl=autoP.toFixed(2);
    }
    return u;
  }));}
  function updateTradeRule(idx,ruleIdx,checked){setWeekTrades(c=>c.map((t,i)=>{
    if(i!==idx)return t;
    const rules=Array.isArray(t.rules)?[...t.rules]:[false,false,false,false,false];
    rules[ruleIdx]=checked;
    return{...t,rules};
  }));}
  function removeTrade(idx){setWeekTrades(c=>c.filter((_,i)=>i!==idx),true);setEditingTradeIdx(null);setOpenMenuIdx(null);}

    const rows=[["Date","Pair","Direction","Setup","Result","R:R","P&L","Risk %","Pre-Trade Thesis","Post-Trade Review"]];
    src.forEach(t=>{rows.push([t.date||"",t.pair||"",t.direction||"",t.setup||"",t.result||"",t.rr||"",t.pnl||"",t.riskPct||"",(t.noteBefore||"").replace(/\n/g," "),(t.noteAfter||"").replace(/\n/g," ")]);});
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`${(activeAcc&&activeAcc.name)||"trades"}-journal.csv`;a.click();
    URL.revokeObjectURL(url);
  }

  async function uploadImageDataUrl(accId,wkk,idx,field,dataUrl){
    if(!user){alert("Not signed in — can't upload image.");return;}
    try{
      const url=await uploadImageToCloudinary(dataUrl);
      setStore(s=>{const acc=s.trades?.[accId]||{};const wkTrades=[...(acc[wkk]||[])];wkTrades[idx]={...wkTrades[idx],[field]:url};return{...s,trades:{...s.trades,[accId]:{...acc,[wkk]:wkTrades}}};},true);

      console.error(e);
      alert("Couldn't upload this image to Cloudinary. Check CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET are set correctly, then try again.");
    }
  }

  function propStats(acc){
    if(!acc||acc.type!=="prop")return null;
    const startBal=parseFloat(acc.balance)||0;
    const accTrades=allAccTrades(acc.id);
    const cumPnl=accTrades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
    const todayStr=new Date().toISOString().slice(0,10);
    const todayPnl=accTrades.filter(t=>t.date===todayStr).reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);

    const maxDailyPct=parseFloat(acc.maxDailyLoss)||0;
    const maxOverallPct=parseFloat(acc.maxOverallLoss)||0;
    const maxDailyAmt=startBal*(maxDailyPct/100);
    const maxOverallAmt=startBal*(maxOverallPct/100);
    const dailyLossUsed=Math.max(0,-todayPnl);
    const overallLossUsed=Math.max(0,-cumPnl);
    const dailyLossPctUsed=startBal>0?(dailyLossUsed/startBal)*100:0;
    const overallNetPct=startBal>0?(cumPnl/startBal)*100:0;
    const overallLossPctUsed=startBal>0?(overallLossUsed/startBal)*100:0;
    const dailyBreached=maxDailyAmt>0&&dailyLossUsed>=maxDailyAmt;
    const overallBreached=maxOverallAmt>0&&overallLossUsed>=maxOverallAmt;

    const numPhases=acc.accountType==="Instant"?0:acc.accountType==="1-Step"?1:acc.accountType==="2-Step"?2:3;
    const targets=[parseFloat(acc.profitTarget1)||null,parseFloat(acc.profitTarget2)||null,parseFloat(acc.profitTarget3)||null];

    let phase="funded",phaseLabel="Funded",phaseTargetAmt=null,phaseProgressPct=null,phasePnl=0;
    let consistencyOk=null,consistencyWorstPct=null,consistencyRulePct=null,consistencyBestDay=null,consistencyDaysTraded=0;

    if(acc.status==="fail"){
      phase="fail";phaseLabel="Failed";
    }else if(numPhases===0){
      // Instant account — already funded from day one, no phases to climb.
      // Instead, check the "consistency rule": no single day's profit should
      // make up more than X% of total profit, so a payout isn't riding on one
      // lucky day. This is about how profit is *spread across days*, not how
      // many trades you've logged — 7 trades crammed into 1-2 days can still
      // fail this even though 7 trades sounds like a lot.
      phase="funded";phaseLabel="Funded";
      consistencyRulePct=parseFloat(acc.consistencyRulePct)||30;
      if(dailyBreached||overallBreached){
        phase="fail";phaseLabel="Failed";
      }else if(cumPnl>0){
        const dayMap={};
        accTrades.forEach(t=>{if(!t.date)return;dayMap[t.date]=(dayMap[t.date]||0)+(parseFloat(t.pnl)||0);});
        const dayEntries=Object.entries(dayMap);
        consistencyDaysTraded=dayEntries.length;
        let bestDay=0,bestDayDate=null;
        dayEntries.forEach(([d,v])=>{if(v>bestDay){bestDay=v;bestDayDate=d;}});
        consistencyWorstPct=cumPnl>0?(bestDay/cumPnl)*100:0;
        consistencyOk=consistencyWorstPct<=consistencyRulePct;
        consistencyBestDay={date:bestDayDate,amount:bestDay};
      }else{
        consistencyOk=false;
        consistencyWorstPct=0;
      }
    }else if(dailyBreached||overallBreached){
      phase="fail";phaseLabel="Failed";
    }else{
      // Walk through trades in chronological order, tracking P&L *within the
      // current phase only*. Every time a phase's target is hit, that phase
      // is marked passed and the running total resets to $0 for the next
      // phase — a fresh evaluation, not a continuation of the same total.
      const sorted=[...accTrades].filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date)||(a._idx||0)-(b._idx||0));
      let cur=1,running=0;
      for(const t of sorted){
        if(cur>numPhases)break;
        running+=parseFloat(t.pnl)||0;
        const tgt=targets[cur-1];
        if(tgt!==null){
          const tgtAmt=startBal*(tgt/100);
          if(tgtAmt>0&&running>=tgtAmt){
            cur++;running=0;
          }
        }
      }
      if(cur>numPhases){
        phase="funded";phaseLabel="Funded";
      }else{
        phase=cur;phaseLabel="Phase "+cur;phasePnl=running;
        const tgt=targets[cur-1];

          phaseTargetAmt=startBal*(tgt/100);
          phaseProgressPct=phaseTargetAmt>0?Math.min(100,Math.max(0,(running/phaseTargetAmt)*100)):0;
        }
      }
    }

                {activePropStats.consistencyOk!==null&&(
                  <div style={{fontSize:11,color:D.text3,lineHeight:1.6}}>
                    Your biggest day{activePropStats.consistencyBestDay?.date?` (${activePropStats.consistencyBestDay.date})`:""} is <b style={{color:activePropStats.consistencyOk?"#22C55E":"#D97706"}}>{fmtMoney(activePropStats.consistencyBestDay?.amount||0,activeAcc.currency)}</b> — <b style={{color:activePropStats.consistencyOk?"#22C55E":"#D97706"}}>{activePropStats.consistencyWorstPct.toFixed(1)}%</b> of total profit {activePropStats.consistencyOk?"— within the limit.":`— needs to be under ${activePropStats.consistencyRulePct}%.`}
                    <br/>Traded on {activePropStats.consistencyDaysTraded} day{activePropStats.consistencyDaysTraded!==1?"s":""} so far. This rule checks how profit is spread across days, not how many trades you've placed — trades bunched into 1–2 days can still fail even with several trades logged.
                  </div>
                )}
              </div>
            ):activePropStats.phase==="funded"?(
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:20}}>🏆</span>
                <div><div style={{fontSize:14,fontWeight:800,color:"#22C55E"}}>Funded — no more targets</div><div style={{fontSize:11.5,color:D.text3,marginTop:1}}>All phases passed. Any further profit is yours for payout.</div></div>
              </div>
            ):(

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}>

                  <span style={{fontSize:12,color:D.text3}}>{fmtMoney(activePropStats.phasePnl,activeAcc.currency,{sign:true})} of {fmtMoney(activePropStats.phaseTargetAmt,activeAcc.currency)} target ({activePropStats.phaseProgressPct.toFixed(0)}%)</span>
                </div>
                <div style={{height:8,background:D.border,borderRadius:99,overflow:"hidden"}}>
                  <div style={{height:"100%",width:activePropStats.phaseProgressPct+"%",background:"#D97706",borderRadius:99,transition:"width 0.4s"}}/>
                </div>
                <div style={{fontSize:11,color:D.text3,marginTop:8}}>Hit this target and {activePropStats.phase<activePropStats.numPhases?`Phase ${activePropStats.phase+1} starts fresh from $0`:"the account moves to Funded — no more targets"}.</div>
              </div>
            )}
          </div>
        )}

        {phase==="dashboard"&&activeAcc&&(
          <AnalyticsDashboard D={D} dark={dark} activeAcc={activeAcc} all={all}/>

        {phase==="dashboard"&&!activeAcc&&(
          <div style={{textAlign:"center",padding:"4rem 2rem",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:12,border:`2px dashed ${D.border}`,color:D.text3,fontSize:13}}>Select or create an account to see analytics.</div>

            <button onClick={()=>{setEditAcc(null);setShowAccModal(true);}} style={{padding:"12px 28px",borderRadius:10,background:D.navActive,color:D.navActiveTxt,border:"none",fontSize:14,fontWeight:700,cursor:"pointer"}}>+ Create Account</button>
          </div>

        {phase==="strategy"&&<StrategyPanel dark={dark} D={D} store={store} setStore={setStore} accounts={accounts}/>}

        {phase==="weekly"&&activeAcc&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:16,background:D.statBg,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",border:`1px solid ${D.statBorder}`,borderRadius:12,padding:"10px 14px"}}>
              <button onClick={()=>{const w=new Date(weekStart);w.setDate(w.getDate()-7);setWeekStart(w);setEditingTradeIdx(null);}} style={{border:"none",background:"none",color:D.text2,fontSize:18,cursor:"pointer",padding:"2px 6px",lineHeight:1}}>‹</button>
              <span style={{fontSize:15,fontWeight:700,color:D.text,textAlign:"center"}}>{fmtWeek(weekStart)}</span>
              <button onClick={()=>{const w=new Date(weekStart);w.setDate(w.getDate()+7);setWeekStart(w);setEditingTradeIdx(null);}} style={{border:"none",background:"none",color:D.text2,fontSize:18,cursor:"pointer",padding:"2px 6px",lineHeight:1}}>›</button>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:16}}>
              <button onClick={()=>{setWeekStart(getWeekStart(new Date()));setEditingTradeIdx(null);}} style={NB({fontSize:12,padding:"7px 16px",fontWeight:700})}>Today</button>
            </div>

            <div style={{display:"flex",alignItems:"center",gap:22,flexWrap:"wrap",marginBottom:16,padding:"16px 18px",background:D.card,border:`1px solid ${D.border}`,borderRadius:14,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)"}}>
              <div>
                <div style={{display:"flex",alignItems:"baseline",gap:6}}>
                  <span style={{fontSize:24,fontWeight:800,color:D.text}}>{wt.length}</span>
                  <span style={{fontSize:11,color:D.text3,fontWeight:600}}>Trades</span>
                </div>
                <div style={{display:"flex",gap:8,marginTop:5,flexWrap:"wrap"}}>
                  <span style={{fontSize:10,color:"#1D9E75",fontWeight:700}}>● {wWins}W</span>
                  <span style={{fontSize:10,color:"#E24B4A",fontWeight:700}}>● {wLoss}L</span>
                  <span style={{fontSize:10,color:"#D97706",fontWeight:700}}>● {wBE}BE</span>
                  <span style={{fontSize:10,color:D.text3,fontWeight:700}}>● {wPending}P</span>
                </div>
              </div>
              <div>
                <div style={{fontSize:19,fontWeight:800,color:wWr>=50?"#1D9E75":"#E24B4A"}}>{wWr}%</div>
                <div style={{fontSize:10.5,color:D.text3,fontWeight:600}}>Win Rate</div>
              </div>
              <div>
                <div style={{fontSize:19,fontWeight:800,color:wNetR>=0?"#1D9E75":"#E24B4A"}}>{(wNetR>=0?"+":"")+wNetR.toFixed(1)}R</div>
                <div style={{fontSize:10.5,color:D.text3,fontWeight:600}}>Net R</div>
              </div>
              <div style={{padding:"8px 16px",borderRadius:10,background:wPnl>=0?"rgba(29,158,117,0.14)":"rgba(226,75,74,0.14)",border:`1px solid ${wPnl>=0?"#1D9E75":"#E24B4A"}`}}>
                <div style={{fontSize:19,fontWeight:800,color:wPnl>=0?"#1D9E75":"#E24B4A"}}>{fmtMoney(wPnl,activeAcc?.currency,{sign:true})}</div>
                <div style={{fontSize:10.5,color:D.text3,fontWeight:600}}>Net P&L</div>
              </div>
              <div style={{flex:1,minWidth:140}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:D.text3,fontWeight:700,marginBottom:4}}>

                </div>
                <div style={{height:6,background:D.border,borderRadius:99,overflow:"hidden"}}>
                  <div style={{height:"100%",width:(wClosed>0?(wWins/wClosed*100):0)+"%",background:"#1D9E75",borderRadius:99,transition:"width 0.4s"}}/>
                </div>
              </div>
            </div>

            {wRisk>0&&(<div style={{display:"flex",gap:12,padding:"10px 14px",background:D.riskBg,border:`1px solid ${D.riskBorder}`,borderRadius:10,marginBottom:14,fontSize:12}}><span style={{color:D.riskText,fontWeight:700}}>⚠ Total risk: {fmtMoney(wRisk,activeAcc?.currency)}</span><span style={{color:D.text3}}>across {wt.filter(t=>parseFloat(t.risk)>0).length} trade(s)</span></div>)}

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
              <span style={{fontSize:12,color:D.text3}}>{wt.length} trade{wt.length!==1?"s":""} this week</span>
              {wt.length>0&&<span style={{fontSize:11.5,color:D.text3}}>Click any row to expand details</span>}
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {wt.map((t,i)=>{
                const bs=RC[t.result]||{bg:"#f0f0f0",c:"#888"};
                const rLabel=RESULT_LABELS[t.result]||t.result;
                const pnlNum=parseFloat(t.pnl)||0;
                const isExpanded=expandedTradeIdx===i;
                const dayLabel=t.date?new Date(t.date+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}):"";
                const durationDays=(t.date&&t.endDate)?Math.round((new Date(t.endDate+"T00:00:00")-new Date(t.date+"T00:00:00"))/86400000)+1:null;
                return(
                  <div key={i} style={{position:"relative",zIndex:(openMenuIdx===i||confirmDeleteTradeIdx===i)?50:1}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"13px 16px",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",border:`1px solid ${D.border}`,borderRadius:isExpanded?"10px 10px 0 0":10,flexWrap:"wrap"}}>
                      <div onClick={()=>setExpandedTradeIdx(isExpanded?null:i)} style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:220,cursor:"pointer",flexWrap:"wrap"}}>
                        <span style={{fontSize:13,fontWeight:800,color:D.text,padding:"4px 10px",borderRadius:7,background:D.card2,border:`1px solid ${D.border}`}}>{t.pair||<span style={{color:D.text3,fontStyle:"italic",fontWeight:400}}>No pair</span>}</span>
                        {t.direction&&<span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:6,background:t.direction==="buy"?"rgba(29,158,117,0.16)":"rgba(226,75,74,0.16)",color:t.direction==="buy"?"#1D9E75":"#E24B4A"}}>{t.direction==="buy"?"LONG":"SHORT"}</span>}
                        {t.setup&&<span style={{fontSize:11,fontWeight:600,padding:"3px 9px",borderRadius:6,background:D.statBg,color:D.text3}}>{t.setup}</span>}
                        {dayLabel&&<span style={{fontSize:11.5,color:D.text3,fontWeight:600}}>{dayLabel}</span>}
                        {durationDays!==null&&durationDays>1&&<span style={{fontSize:10.5,fontWeight:700,padding:"3px 9px",borderRadius:6,background:D.statBg,color:"#2563EB"}}>⏱ {durationDays} days</span>}
                        {(t.tags||[]).map(tag=>(<span key={tag} style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:6,background:"rgba(239,68,68,0.12)",color:"#EF4444"}}>⚠ {tag}</span>))}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:16,flexShrink:0}}>
                        {t.rr&&<div style={{textAlign:"center",minWidth:38}}><div style={{fontSize:13,fontWeight:800,color:D.text}}>{t.rr}{/^-?[\d.]+$/.test(String(t.rr))?"R":""}</div><div style={{fontSize:8.5,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.04em"}}>R:R</div></div>}
                        {t.pnl&&<div style={{textAlign:"center",minWidth:50}}><div style={{fontSize:13,fontWeight:800,color:pnlNum>0?"#1D9E75":pnlNum<0?"#E24B4A":D.text3}}>{fmtMoney(pnlNum,activeAcc?.currency,{sign:true})}</div><div style={{fontSize:8.5,color:D.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.04em"}}>P&L</div></div>}
                        <span style={{fontSize:11,fontWeight:800,padding:"4px 12px",borderRadius:20,background:bs.bg,color:bs.c,whiteSpace:"nowrap"}}>{rLabel}</span>
                        <div data-trademenu="true" style={{display:"flex",alignItems:"center",gap:6,position:"relative"}}>
                          <button data-trademenu="true" onClick={e=>{e.stopPropagation();setEditingTradeIdx(i);}} title="Edit trade" style={{border:"none",background:"none",cursor:"pointer",color:D.text3,padding:"4px",borderRadius:6,display:"flex",alignItems:"center"}}><Icon name="edit" size={15}/></button>
                          {confirmDeleteTradeIdx===i?(
                            <div data-trademenu="true" style={{position:"absolute",right:0,bottom:"110%",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",border:`1px solid ${D.border}`,borderRadius:10,boxShadow:"0 -8px 32px rgba(0,0,0,0.22)",zIndex:200,minWidth:200,padding:"12px 14px"}}>
                              <div style={{fontSize:12,color:D.text,fontWeight:600,marginBottom:10}}>Delete this trade?</div>
                              <div style={{display:"flex",gap:8}}>
                                <button data-trademenu="true" onClick={e=>{e.stopPropagation();removeTrade(i);setConfirmDeleteTradeIdx(null);}} style={{padding:"6px 12px",border:"none",borderRadius:7,background:"#E24B4A",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:700}}>Yes</button>
                                <button data-trademenu="true" onClick={e=>{e.stopPropagation();setConfirmDeleteTradeIdx(null);}} style={{padding:"6px 12px",border:`1px solid ${D.border}`,borderRadius:7,background:"transparent",color:D.text2,fontSize:12,cursor:"pointer"}}>No</button>
                              </div>
                            </div>
                          ):(
                            <button data-trademenu="true" onClick={e=>{e.stopPropagation();setConfirmDeleteTradeIdx(i);}} title="Delete trade" style={{border:"none",background:"none",cursor:"pointer",color:D.text3,padding:"4px",borderRadius:6,display:"flex",alignItems:"center",position:"relative"}}><Icon name="trash" size={15}/></button>
                          )}
                        </div>
                        <button onClick={()=>setExpandedTradeIdx(isExpanded?null:i)} style={{border:"none",background:"none",cursor:"pointer",color:D.text3,fontSize:12,padding:"4px 4px",display:"flex",alignItems:"center"}}>{isExpanded?"▲":"▼"}</button>
                      </div>
                    </div>
                    {isExpanded&&(
                      <div style={{padding:16,background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",border:`1px solid ${D.border}`,borderTop:"none",borderRadius:"0 0 10px 10px",display:"flex",flexDirection:"column",gap:12}}>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
                          <div style={{padding:12,borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`}}>
                            <div style={{fontSize:10,fontWeight:800,color:"#2563EB",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Before Trade</div>
                            <div style={{fontSize:12,color:D.text2,lineHeight:1.5}}>{t.noteBefore||<span style={{color:D.text3,fontStyle:"italic"}}>No pre-trade thesis recorded</span>}</div>
                          </div>
                          <div style={{padding:12,borderRadius:10,background:D.statBg,border:`1px solid ${D.statBorder}`}}>
                            <div style={{fontSize:10,fontWeight:800,color:"#D97706",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>After Trade</div>
                            <div style={{fontSize:12,color:D.text2,lineHeight:1.5}}>{t.noteAfter||<span style={{color:D.text3,fontStyle:"italic"}}>No post-trade review recorded</span>}</div>
                          </div>
                        </div>
                        <div style={{padding:12,borderRadius:10,background:D.card2,border:`1px solid ${D.border}`}}>
                          <div style={{fontSize:10,fontWeight:800,color:D.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Notes</div>
                          <div style={{fontSize:12,color:D.text2,lineHeight:1.5}}>{t.quickNote||<span style={{color:D.text3,fontStyle:"italic"}}>No notes added</span>}</div>
                        </div>
                        <div className="grid-2" style={{gap:12}}>
                          {[{label:"Before Chart",field:"imgBefore"},{label:"After Chart",field:"imgAfter"}].map(c=>{
                            const img=t[c.field];
                            return(
                              <div key={c.field} style={{border:`1px solid ${D.border}`,borderRadius:10,overflow:"hidden"}}>
                                <div style={{fontSize:10,fontWeight:700,color:D.text3,padding:"6px 10px",borderBottom:`1px solid ${D.border2}`,textAlign:"center"}}>{c.label}</div>
                                {img?(
                                  <div onClick={()=>setViewImage(img)} style={{position:"relative",height:110,cursor:"pointer",overflow:"hidden"}}>
                                    <img src={img} alt={c.label} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                                    <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.35)",opacity:0,transition:"opacity 0.15s",display:"flex",alignItems:"center",justifyContent:"center"}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0}>
                                      <span style={{fontSize:11,fontWeight:700,color:"#fff",padding:"5px 12px",borderRadius:20,background:"rgba(0,0,0,0.55)"}}>🔍 View</span>
                                    </div>
                                  </div>
                                ):(
                                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,height:110,background:D.inputBg,color:D.text3}}>
                                    <Icon name="image" size={18} color={D.text3}/>
                                    <div style={{fontSize:11,fontWeight:600}}>No chart uploaded</div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
              {wt.length===0&&(
                <div style={{textAlign:"center",padding:"2.5rem 1rem",background:D.card,backdropFilter:"blur(26px) saturate(140%)",WebkitBackdropFilter:"blur(26px) saturate(140%)",borderRadius:12,border:`2px dashed ${D.border}`,color:D.text3,fontSize:13}}>No trades logged this week yet.</div>
              )}
            </div>
          </div>
        )}

        {editingTradeIdx!==null&&wt[editingTradeIdx]&&(()=>{
          const i=editingTradeIdx;
          const customSetups=(store.checklists||[]).map(c=>c.name);
          return(
            <LogTradeModal
              D={D} dark={dark}
              trade={wt[i]}
              currency={activeAcc?.currency}
              customSetups={customSetups}
              onUpdate={(field,val)=>updateTrade(i,field,val)}
              onUpdateRule={(ri,val)=>updateTradeRule(i,ri,val)}
              onImgFile={(field,file)=>handleImg(activeAccId,wk(),i,field,file)}
              onClose={()=>setEditingTradeIdx(null)}
            />
          );
        })()}


        {phase==="all"&&activeAcc&&(
          <AllTradesView D={D} dark={dark} accounts={accounts} allAccTrades={allAccTrades} onJumpToWeek={(accId,wkk)=>{setActiveAccId(accId);setWeekStart(new Date(wkk+"T00:00:00"));setPhase("weekly");}} onDelete={(accId,wkk,idx)=>deleteAnyTrade(accId,wkk,idx)}/>
        )}

        {phase==="calendar"&&activeAcc&&(
          <CalendarView D={D} dark={dark} accounts={accounts} allAccTrades={allAccTrades} calMi={calMi} calYear={calYear} setCalMonth={setCalMonth} selDay={selDay} setSelDay={setSelDay} today={today} daysInMonth={daysInMonth}/>
        )}
        </>)}

        {view==="accounts"&&(
          <AccountsView D={D} dark={dark} accounts={accounts} activeAccId={activeAccId} setActiveAccId={setActiveAccId} allAccTrades={allAccTrades} onNew={()=>{setEditAcc(null);setShowAccModal(true);}} onEdit={a=>{setEditAcc(a);setShowAccModal(true);}}/>
        )}

        {view==="payouts"&&(
          <PayoutsView D={D} dark={dark} user={user} isAdmin={isAdmin} accounts={accounts} allAccTrades={allAccTrades} onWithdraw={withdrawFromAccount}/>
        )}

        {view==="achievements"&&(
          <AchievementsView D={D} dark={dark} user={user} globalPnl={globalPnl} globalPnlPct={globalPnlPct}/>
        )}

        {view==="helpcenter"&&(
          <HelpCenterView D={D} dark={dark}/>
        )}

        {view==="admin"&&isAdmin&&(
          <AdminPanel D={D} dark={dark}/>
        )}
      </div>
    </div>
      {showSidebar&&(<Sidebar D={D} dark={dark} user={user} isAdmin={isAdmin} view={view} phase={phase} onNavigate={v=>{setView(v);setShowSidebar(false);}} onNavigatePhase={p=>{setView("dashboard");setPhase(p);setShowSidebar(false);}} onCreateAccount={()=>{setView("dashboard");setEditAcc(null);setShowAccModal(true);setShowSidebar(false);}} onSettings={()=>{setShowSettings("personal");setShowSidebar(false);}} onReferrals={()=>{setShowSettings("referrals");setShowSidebar(false);}} onAdminPanel={()=>{setView("admin");setShowSidebar(false);}} onConnect={()=>{setShowConnectModal(true);setShowSidebar(false);}} onSync={()=>{setShowSyncModal(true);setShowSidebar(false);}} onClose={()=>setShowSidebar(false)}/>)}
      {showAccModal&&(<AccountModal dark={dark} D={D} existing={editAcc} accounts={accounts} planType={profile.planType} isAdmin={isAdmin} onSave={acc=>{saveAccount(acc);setShowAccModal(false);if(!activeAccId)setActiveAccId(acc.id);}} onDelete={id=>{deleteAccount(id);setShowAccModal(false);}} onClose={()=>setShowAccModal(false)}/>)}
      {showConnectModal&&(<ConnectPlatformModal D={D} dark={dark} user={user} onClose={()=>setShowConnectModal(false)} onAddManually={()=>{setEditAcc(null);setShowAccModal(true);}}/>)}
      {showSyncModal&&(<SyncModal D={D} dark={dark} user={user} onClose={()=>setShowSyncModal(false)}/>)}
      {showSettings&&(<SettingsModal D={D} dark={dark} user={user} profile={profile} onSaveProfile={saveProfile} onChangePassword={changePassword} onSetNewPassword={setNewPassword} onChangeEmail={changeEmail} initialTab={showSettings==="referrals"?"referrals":"personal"} onClose={()=>setShowSettings(false)}/>)}
      {viewImage&&(
        <div onClick={()=>setViewImage(null)} style={{position:"fixed",inset:0,zIndex:1300,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",padding:24,cursor:"zoom-out"}}>
          <button onClick={()=>setViewImage(null)} style={{position:"absolute",top:20,right:24,border:"none",background:"rgba(255,255,255,0.1)",color:"#fff",width:38,height:38,borderRadius:"50%",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          <img src={viewImage} alt="Chart" onClick={e=>e.stopPropagation()} style={{maxWidth:"92vw",maxHeight:"90vh",borderRadius:10,boxShadow:"0 20px 60px rgba(0,0,0,0.6)",cursor:"default"}}/>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error("App crashed:",error,info);}
  render(){
    if(this.state.error){
      return(
        <div style={{minHeight:"100vh",background:"transparent",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"DM Sans,sans-serif"}}>
          <div style={{maxWidth:520,width:"100%",background:"rgba(255,255,255,0.08)",backdropFilter:"blur(30px) saturate(140%)",WebkitBackdropFilter:"blur(30px) saturate(140%)",border:"1px solid rgba(255,255,255,0.16)",borderRadius:20,padding:"28px",boxShadow:"0 24px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2)",color:"#eee"}}>
            <div style={{fontSize:18,fontWeight:800,marginBottom:10}}>⚠️ Something went wrong</div>
            <div style={{fontSize:13,color:"#aaa",marginBottom:16,lineHeight:1.5}}>The app hit an error and stopped. Here's the detail (screenshot this if you need help fixing it):</div>
            <pre style={{background:"#0d0d0d",border:"1px solid #2a2a2a",borderRadius:8,padding:12,fontSize:12,color:"#ff6b6b",overflowX:"auto",whiteSpace:"pre-wrap"}}>{String(this.state.error&&(this.state.error.stack||this.state.error.message||this.state.error))}</pre>
            <button onClick={()=>{this.setState({error:null});window.location.reload();}} style={{marginTop:16,padding:"11px 18px",border:"none",borderRadius:9,background:"#2563EB",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>Reload App</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
